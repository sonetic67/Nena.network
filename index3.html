<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NENA NETWORK – Gallery & Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0f0f0f;
            --text-color: #f0f0f0;
            --accent-red: #b80f0a; /* Rich Blood Red */
            --banner-bg: #0f0f0f;
            --banner-text: #ffffff;
            --divider-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* TOP BANNER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--banner-bg);
            color: var(--banner-text);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            border-bottom: 1.5px solid var(--divider-color);
        }

        header.scrolled-away {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .title-text {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--banner-text);
        }

        /* NAVIGATION CONTAINER */
        .nav-wrapper {
            position: fixed;
            top: 15px;
            right: 2rem;
            z-index: 1002;
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        .menu-hitbox {
            padding: 15px;
            margin: -15px;
            cursor: pointer;
        }

        /* TOGGLE BUTTON */
        .menu-toggle-btn {
            position: relative;
            width: 28px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-toggle-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--accent-red);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center;
        }

        body.is-scrolled .menu-toggle-btn {
            width: 8px;
            height: 8px;
        }

        body.is-scrolled .menu-toggle-btn span {
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        body.is-scrolled .menu-toggle-btn span:nth-child(1),
        body.is-scrolled .menu-toggle-btn span:nth-child(3) {
            opacity: 0;
            transform: scale(0);
        }

        body.is-scrolled .menu-toggle-btn span:nth-child(2) {
            width: 8px;
            height: 8px;
        }

        body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
        body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
            height: 180px !important;
            width: 4px !important;
        }

        body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
        body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
            width: 4px !important;
            height: 100% !important;
            border-radius: 0 !important;
            background-color: var(--accent-red) !important;
        }

        /* MENU POPUP */
        .banner-menu-popup {
            position: absolute;
            top: 0px;
            right: 0;
            background-color: var(--bg-color);
            border: 1px solid var(--divider-color);
            padding: 1.5rem 2rem;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            z-index: 1003;
        }

        body:not(.is-scrolled) .nav-wrapper:hover .banner-menu-popup,
        body:not(.is-scrolled) .nav-wrapper.near-mouse .banner-menu-popup {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .banner-menu-popup a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.2s, transform 0.2s;
            cursor: pointer;
        }

        .banner-menu-popup a:hover {
            color: var(--accent-red);
            transform: translateX(5px);
        }

        /* FLYOUT MENU */
        .flyout-menu {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: right;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 1000;
        }

        .flyout-menu a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(60px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            cursor: pointer;
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu,
        body.is-scrolled .nav-wrapper.near-mouse .flyout-menu {
            pointer-events: auto;
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu a,
        body.is-scrolled .nav-wrapper.near-mouse .flyout-menu a {
            opacity: 1;
            transform: translateX(0);
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(1) { transition-delay: 0.05s; }
        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(2) { transition-delay: 0.10s; }
        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(3) { transition-delay: 0.15s; }

        .flyout-menu a:hover {
            color: var(--accent-red);
            transform: translateX(-8px) !important;
        }

        /* SCROLL TO TOP ARROW BUTTON */
        .scroll-to-top-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            background-color: var(--accent-red);
            border: 1px solid var(--accent-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease, visibility 0.3s;
            box-shadow: 0 4px 20px rgba(184, 15, 10, 0.4);
            border-radius: 4px;
        }

        .scroll-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-to-top-btn:hover {
            background-color: #e0120c;
        }

        .scroll-to-top-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            transition: transform 0.2s ease;
        }

        .scroll-to-top-btn:hover svg {
            transform: translateY(-3px);
        }

        /* VIEWS MANAGEMENT */
        .view-section {
            display: none;
            width: 100vw;
            min-height: 100vh;
        }

        .view-section.active-view {
            display: block;
        }

        /* GALLERY VIEW */
        .collection-wrapper {
            width: 100vw;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 2rem;
            padding: 80px 2rem 4rem 2rem;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .hero-item {
            position: sticky;
            top: 80px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .hero-item .image-wrapper {
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }

        .hero-overlay-text {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            z-index: 2;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        .grid-right {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-content: start;
        }

        .ratio-16-9 { aspect-ratio: 16 / 9; }
        .ratio-1-1  { aspect-ratio: 1 / 1; }

        .gallery-item {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .gallery-item.span-2 {
            grid-column: span 2;
        }

        .image-wrapper {
            width: 100%;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tiny-label {
            margin-top: 6px;
            font-size: 0.68rem;
            color: #777;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* TIMELINE VIEW */
        .timeline-view {
            display: none;
            padding: 6rem 2rem 3rem 7rem;
            position: relative;
            width: 100vw;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .timeline-line-nav {
            position: fixed;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            height: 300px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .line-track {
            position: relative;
            width: 1px;
            height: 100%;
            background-color: #333;
        }

        .line-pip {
            position: absolute;
            left: 50%;
            width: 3px;
            height: 30px;
            background-color: #fff;
            transform: translateX(-50%);
            transition: top 0.3s ease;
        }

        .line-ticks {
            position: absolute;
            left: 10px;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tick-item {
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .tick-item:hover, .tick-item.active {
            color: #fff;
            font-weight: 600;
        }

        .timeline-stack {
            display: flex;
            flex-direction: column;
            gap: 10vh;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 2rem;
        }

        .timeline-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 80vh;
        }

        .timeline-item-container {
            display: flex;
            flex-direction: column;
            width: 45vh;
            max-width: 400px;
            flex-shrink: 0;
            z-index: 2;
        }

        .timeline-item-wrapper {
            width: 100%;
            aspect-ratio: 9 / 16;
