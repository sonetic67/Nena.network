/* --- LIGHTBOX OVERLAY LOGIC --- */
let currentZoomScale = 1;
let imageOffsetX = 0;
let imageOffsetY = 0;

let isDraggingImage = false;
let dragStartX = 0;
let dragStartY = 0;
let dragOriginX = 0;
let dragOriginY = 0;

function clampImageOffsets() {
    if (currentZoomScale <= 1) {
        imageOffsetX = 0;
        imageOffsetY = 0;
        return;
    }
    const maxX = (overlayImage.offsetWidth * currentZoomScale) / 2;
    const maxY = (overlayImage.offsetHeight * currentZoomScale) / 2;
    imageOffsetX = Math.max(-maxX, Math.min(maxX, imageOffsetX));
    imageOffsetY = Math.max(-maxY, Math.min(maxY, imageOffsetY));
}

// Touch devices: red dot + line hide while zoomed in; a tap on the picture or zooming fully out brings them back
let uiShownByTap = false;
function updateLightboxUi() {
    const touch = window.matchMedia('(pointer: coarse)').matches;
    const hide = touch && currentZoomScale > 1.01 && !uiShownByTap;
    lightboxOverlay.classList.toggle('ui-hidden', hide);
}

function updateImageTransform() {
    clampImageOffsets();
    if (currentZoomScale <= 1.01) uiShownByTap = false;
    updateLightboxUi();
    overlayImage.style.transform =
        `translate(${imageOffsetX}px, ${imageOffsetY}px) scale(${currentZoomScale})`;

    overlayImage.style.cursor =
        currentZoomScale > 1
            ? (isDraggingImage ? 'grabbing' : 'grab')
            : 'zoom-in';
}

let lightboxList = [];
let lightboxIndex = 0;

function showLightboxAt(index) {
    const entry = lightboxList[index];
    if (!entry) return;
    if (typeof setBrollOpen === 'function') setBrollOpen(false);
    lightboxIndex = index;

    overlayImage.src = entry.src;
    currentZoomScale = 1;
    imageOffsetX = 0;
    imageOffsetY = 0;
    isDraggingImage = false;
    touchPanActive = false;
    updateImageTransform();

    drawerTitle.textContent = entry.title || '';
    drawerDesc.textContent = entry.description || '';
    overlayDrawer.classList.remove('expanded', 'show-title');
    document.querySelector('.lightbox-info-group').classList.remove('suppress-hover');
    updateLightboxNav();
    updateBrollButton();
}

/* --- B-ROLL: Skizzen/Nebenbilder zu einem Timeline-Bild ---
   Das Symbol ueber der roten Linie erscheint nur, wenn es B-Roll gibt.
   Klick: das Bild gleitet nach links, rechts gleitet die B-Roll-Liste (Titel, Bilder, Texte) herein
   und blendet von 0 auf volle Deckkraft auf. Klick auf ein B-Roll-Bild zeigt es gross,
   nochmals Klick auf das Symbol: alles gleitet zurueck. */
let brollOpen = false;
let brollShownSrc = null; // welches B-Roll-Bild gerade gross gezeigt wird (null = das eigentliche Bild)

function currentBrollSet() {
    const entry = lightboxList[lightboxIndex];
    return entry && entry.broll && entry.broll.images && entry.broll.images.length ? entry.broll : null;
}

function updateBrollButton() {
    const btn = document.getElementById('brollBtn');
    if (!btn) return;
    const set = currentBrollSet();
    btn.hidden = !set;
    btn.classList.toggle('active', brollOpen);
    const count = set ? set.images.length : 0;
    btn.querySelector('.broll-count').textContent = count > 1 ? String(count) : '';
    btn.title = brollOpen ? t('brollBack') : t('broll');
    btn.setAttribute('aria-label', btn.title);
}

function showInLightboxSlot(src, title, description) {
    overlayImage.src = src;
    currentZoomScale = 1;
    imageOffsetX = 0;
    imageOffsetY = 0;
    updateImageTransform();

    drawerDesc.textContent = description || '';

function buildBrollPanel(set) {
    const panel = document.getElementById('brollPanel');
    panel.innerHTML = '';
    let i = 0;
    const stagger = (el) => { el.style.setProperty('--i', i++); return el; };

    if (set.title) {
        const h = document.createElement('div');
        h.className = 'broll-title';
        h.textContent = set.title;
        panel.appendChild(stagger(h));
    }

    // Bilder ungefaehr gleich gross, aber nicht ganz gleichfoermig: Breite und Seite wechseln leicht
    const widths = [88, 78, 94, 82, 90, 76];
    let imgCount = 0;
    set.blocks.forEach((block) => {
        if (block.type === 'text') {
            const tx = document.createElement('div');
            tx.className = 'broll-text';
            tx.textContent = block.text;
            panel.appendChild(stagger(tx));
            return;
        }
        const n = imgCount++;
        const fig = document.createElement('figure');
        fig.className = 'broll-item' + (block.wide ? ' wide' : '');
        if (!block.wide) fig.style.setProperty('--w', widths[n % widths.length] + '%');
        const img = document.createElement('img');
        img.alt = block.title || '';
        img.src = block.src;
        img.decoding = 'async';
        fig.appendChild(img);
        if (block.title || block.description) {
            const cap = document.createElement('figcaption');
            if (block.title) {
                const strong = document.createElement('strong');
                strong.textContent = block.title;
                cap.appendChild(strong);
            }
            if (block.description) {
                const d = document.createElement('span');
                d.textContent = block.description;
                cap.appendChild(d);
            }
            fig.appendChild(cap);
        }
        fig.addEventListener('click', (e) => {
            e.stopPropagation();
            const entry = lightboxList[lightboxIndex];
            panel.querySelectorAll('.broll-item.current').forEach((el) => el.classList.remove('current'));
            if (brollShownSrc === block.src) {
                // nochmals tippen: zurueck zum eigentlichen Bild
                brollShownSrc = null;
                showInLightboxSlot(entry.src, entry.title, entry.description);
            } else {
                brollShownSrc = block.src;
                fig.classList.add('current');
                showInLightboxSlot(block.src, block.title, block.description);
            }
        });
        panel.appendChild(stagger(fig));
    });
    panel.scrollTop = 0;
}

function setBrollOpen(open) {
    const set = currentBrollSet();
    if (open && !set) open = false;
    if (open === brollOpen) return;
    brollOpen = open;
    if (open) {
        buildBrollPanel(set);
        void document.getElementById('brollPanel').offsetWidth; // Startzustand rendern, dann animieren
    } else if (brollShownSrc) {
        const entry = lightboxList[lightboxIndex];
        brollShownSrc = null;
        if (entry) showInLightboxSlot(entry.src, entry.title, entry.description);
    }
    currentZoomScale = 1;
    imageOffsetX = 0;
    imageOffsetY = 0;
    updateImageTransform();
    overlayDrawer.classList.remove('expanded', 'show-title');
    lightboxOverlay.classList.toggle('broll-open', open);
    updateBrollButton();
}

function toggleBroll(e) {

function updateLightboxNav() {
    const nav = document.getElementById('overlayNav');
    const prev = document.getElementById('overlayPrevBtn');
    const next = document.getElementById('overlayNextBtn');
    if (!nav) return;
    nav.classList.toggle('single', lightboxList.length <= 1);

function stepLightbox(delta, e) {
    if (e) e.stopPropagation();
    const target = lightboxIndex + delta;
    if (target < 0 || target >= lightboxList.length) return;
    showLightboxAt(target);

// list = array of {src, title, description} to switch between; index = position of the opened picture
function openLightbox(imageSrc, title, description, list, index) {
    if (Array.isArray(list) && list.length > 0 && list[index]) {
        lightboxList = list;
        lightboxIndex = index;
    } else {
        lightboxList = [{ src: imageSrc, title, description }];

    imageOffsetX = 0;

let swipeTracking = false;

let swipeStartY = 0;

let touchPanStartX = 0;
let touchPanStartY = 0;
let touchPanOriginX = 0;

function beginTouchPan(touch) {
    touchPanMoved = 0;

        } else {
            swipeStartY = e.touches[0].clientY;
            swipeStartX = e.touches[0].clientX;
            swipeTracking = true;
        }
        return;
    }

    if (e.touches.length === 2) {
        swipeTracking = false;
        touchPanActive = false;
        e.preventDefault();

        pinchStartDistance = getTouchDistance(e.touches);
        pinchStartScale = currentZoomScale;

        pinchCenterX =
            (e.touches[0].clientX + e.touches[1].clientX) / 2;

        imageOffsetY = touchPanOriginY + e.touches[0].clientY - touchPanStartY;

<script>
  // ==========================================
  // SCHNELLES LADEN
  // 1) Existenz-Pruefung per HEAD-Anfrage: laedt das Bild NICHT herunter (frueher: jedes Bild 2x)
  // 2) Priorisierter Bild-Lader: zuerst Hero / aktives Bild / sichtbarer Bereich, dann der Rest schrittweise
  // 3) Collections und Timeline erscheinen, sobald das erste Bild gefunden ist (kein Warten auf alles)
  // ==========================================

  // Fallback-Pruefung (laedt das Bild), nur noetig falls HEAD nicht moeglich ist (z.B. file://)
  function checkImageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  const probeCache = new Map();
  function probeImage(url) {
    if (probeCache.has(url)) return probeCache.get(url);
    const p = (async () => {
      // Bei Server-Schluckauf (429 = zu viele Anfragen, 5xx) bis zu 3x neu versuchen,
      // statt das Bild als "fehlt" zu werten (sonst bricht die Suche nach dem Hauptbild ab)
      for (let attempt = 0; attempt < 4; attempt++) {
        try {
          const res = await fetch(url, { method: 'HEAD' });
          if (res.status === 405 || res.status === 501) return await checkImageExists(url);
          if (res.status === 429 || res.status >= 500) {
            await new Promise((r) => setTimeout(r, 400 * (attempt + 1)));
            continue;
          }
          // Manche Server liefern fuer fehlende Dateien die Startseite (HTML) mit Status 200 aus
          const type = res.headers.get('content-type') || '';
          return res.ok && !type.includes('text/html');
        } catch (e) {
          return await checkImageExists(url);
        }
      }
      return await checkImageExists(url);
    })();
    probeCache.set(url, p);
    return p;
  }

  // Merkt sich die zuletzt gefundene Endung und probiert sie zuerst (spart Anfragen)
  let preferredImageExt = 'jpg';
  async function findImage(base, exts) {
    const first = exts.includes(preferredImageExt) ? preferredImageExt : exts[0];
    if (await probeImage(`${base}.${first}`)) return `${base}.${first}`;

    const rest = exts.filter((e) => e !== first);
    return new Promise((resolve) => {
      let pending = rest.length;
      if (!pending) return resolve(null);
      rest.forEach((ext) => {
        probeImage(`${base}.${ext}`).then((ok) => {
          if (ok) {
            preferredImageExt = ext;
            resolve(`${base}.${ext}`);
          } else if (--pending === 0) {
            resolve(null);
          }
        });
      });
    });
  }

  // Findet main.*, 1.*, 2.* ... in Reihenfolge und meldet jedes Bild sofort (onFound).
  // Mehrere Nummern werden vorausschauend parallel geprueft; Stopp an der ersten Luecke.
  async function discoverImages(base, exts, onFound, lookAhead = 4) {
    const probes = new Map();
    const probe = (key) => {
      if (!probes.has(key)) probes.set(key, findImage(`${base}/${key}`, exts));
      return probes.get(key);
    };

    probe('main');
    for (let i = 1; i <= lookAhead; i++) probe(String(i));

    let count = 0;
    // "main" auch gross geschrieben ("Main.jpg"): der Server unterscheidet Gross/Klein
    const mainPath = (await probe('main')) || (await probe('Main')) || (await probe('MAIN'));
    if (mainPath) await onFound(mainPath, 'main', count++);

    // Einzelne fehlende Nummern werden uebersprungen (z.B. 1, 2, 3, 5, 6);
    // erst nach MAX_GAP fehlenden Nummern hintereinander ist Schluss.
    const MAX_GAP = 3;
    let missing = 0;
    for (let n = 1; missing < MAX_GAP; n++) {
      probe(String(n + lookAhead));
      const path = await probe(String(n));
      if (!path) { missing++; continue; }
      missing = 0;
      await onFound(path, String(n), count++);
    }
    return count;
  }

  // Abstand eines Elements zum sichtbaren Bereich (0 = sichtbar, 1e6 = Ansicht gerade verborgen)
  function viewportDistance(el) {
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return 1e6;
    if (r.bottom < 0) return -r.bottom;
    if (r.top > window.innerHeight) return r.top - window.innerHeight;
    return 0;
  }

  // Laedt Bilder gestaffelt (max. 4 gleichzeitig). Bei jedem Schritt kommt das Bild mit der
  // kleinsten Prioritaetszahl zuerst; die Prioritaet wird dabei live neu berechnet (Scrollen, Timeline-Wechsel).
  const ImageLoader = {
    queue: [],
    active: 0,
    activeCritical: 0,
    max: 4,
    visibleReady: false, // wird true, sobald das Hero/Spotlight der sichtbaren Ansicht geladen ist (oder nach 3 s)
    // high = kritisches Bild (Hero / aktives Timeline-Bild): bekommt die ganze Bandbreite, bevor andere starten
    // group = wem das Bild gehoert ('gallery' / 'timeline'), damit beim Neuaufbau der Timeline
    // nur deren alte Bilder aus der Warteschlange fliegen (vorher flogen auch Galerie-Bilder raus,
    // die gerade noch nicht im Dokument hingen -> die zwei Spalten blieben manchmal leer)
    add(img, src, priority, high, group = 'gallery') {
      img.decoding = 'async';
      if (high) img.fetchPriority = 'high';
      this.queue.push({ img, src, priority, high: !!high, group });
      this.pump();
    },
    pump() {
      while (this.active < this.max && this.queue.length) {
        let best = -1;
        let bestValue = Infinity;
        for (let i = 0; i < this.queue.length; i++) {
          const t = this.queue[i];
          if (this.activeCritical > 0 && !t.high) continue; // waehrend ein kritisches Bild laedt, warten die anderen
          const value = typeof t.priority === 'function' ? t.priority() : t.priority;
          if (value >= 1e6 && !this.visibleReady) continue;  // Bilder einer gerade verborgenen Ansicht kommen spaeter
          if (value < bestValue) { bestValue = value; best = i; }
        }
        if (best === -1) return;
        const task = this.queue.splice(best, 1)[0];
        this.active++;
        if (task.high) this.activeCritical++;
        const done = (ev) => {
          // Direkt am Bild markieren: der Sammel-Listener am Dokument hoert Bilder nicht,
          // die beim Fertigladen noch nicht in der Seite haengen (Nebenbilder vor dem Spalten-Aufbau,
          // Tab im Hintergrund) -> die Spalten blieben sonst unsichtbar
          if (ev && ev.type === 'load') task.img.classList.add('is-loaded');
          this.active--;
          if (task.high) { this.activeCritical--; this.visibleReady = true; }
          this.pump();
        };
        task.img.addEventListener('load', done, { once: true });
        task.img.addEventListener('error', done, { once: true });
        task.img.src = task.src;
      }
    }
  };
  setTimeout(() => { ImageLoader.visibleReady = true; ImageLoader.pump(); }, 3000);

  // Liest info.txt aus dem Ordner und verarbeitet individuelle Bild-Texte
  async function loadFolderInfo(folderName, basePath = '/collection') {
    const info = {
      title: folderName.toUpperCase(),
      subtitle: '',
      description: '',
      artist: '',
      captions: {}
    };

    try {
      const response = await fetch(`${basePath}/${folderName}/info.txt`);
      // Manche Server liefern fuer fehlende Dateien die Startseite (HTML) mit Status 200 aus
      const contentType = response.headers.get('content-type') || '';
      if (response.ok && !contentType.includes('text/html')) {
        const text = await response.text();
        const lines = text.split('\n');
        let lastPictureKey = 0; // fuer "description: 1/2" -> Kachel nach diesem Bild

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;

          if (trimmed.toLowerCase().startsWith('title:')) {
            info.title = trimmed.replace(/title:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('subtitle:')) {
            info.subtitle = trimmed.replace(/subtitle:/i, '').trim();
          } else if (/^date\s*:/i.test(trimmed)) {
            // Datum fuer "Sort by > By Date", z.B. "date: 27.08.2026" oder "date: august 2026"
            info.date = trimmed.replace(/^date\s*:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('artist:')) {
            // Kuenstler-Code der Collection, z.B. "artist: 1" (fuer den Artists-Filter)
            info.artist = trimmed.replace(/artist:/i, '').trim();
          } else if (/^(desc|description)\s*:\s*[12]\s*$/i.test(trimmed)) {
            // "desc: 1" / "desc: 2" zwischen den Bild-Zeilen = Beschreibung als Textkachel in der Galerie,
            // an genau dieser Stelle (nach dem zuletzt genannten Bild), 1 = eine Spalte, 2 = ueber beide Spalten.
            // Ohne diese Zeile steht die Beschreibung nur in der Bildansicht.
            info.descriptionWidth = parseInt(trimmed.replace(/\D/g, ''), 10);
            info.descriptionAfter = lastPictureKey;
          } else if (/^description\s*[12]?\s*:/i.test(trimmed)) {
            // "description:" = der Text; "description 1:" / "description 2:" = Text + Breite der Kachel
            const m = trimmed.match(/^description\s*([12])?\s*:\s*(.*)$/i);
            info.description = m[2].trim();
            if (m[1]) info.descriptionWidth = parseInt(m[1], 10);
          } else {
            const match = trimmed.match(/^([a-zA-Z0-9]+)\s*:\s*(.+)$/);
            if (match) {
              const key = match[1].toLowerCase();
              let rawValue = match[2].trim();

              // "dc" am Anfang = Bild geht am Desktop ueber beide Spalten, z.B. "1: dc erste oelstudie - ..."
              let wide = false;
              if (/^dc(\s+|$)/i.test(rawValue)) {
                wide = true;
                rawValue = rawValue.replace(/^dc\s*/i, '').trim();
              }

              let title = rawValue;
              let desc = info.description;

              if (rawValue.includes(' — ')) {
                const parts = rawValue.split(' — ');
                title = parts[0].trim();
                desc = parts.slice(1).join(' — ').trim();
              } else if (rawValue.includes(' - ')) {
                // einfacher Bindestrich mit Leerzeichen geht auch als Trenner
                const parts = rawValue.split(' - ');
                title = parts[0].trim();
                desc = parts.slice(1).join(' - ').trim();
              } else if (rawValue.includes('|')) {
                const parts = rawValue.split('|');
                title = parts[0].trim();
                desc = parts[1].trim();
              }

              info.captions[key] = { title, description: desc, wide };
              if (key === 'main') lastPictureKey = 0;
              else if (/^\d+$/.test(key)) lastPictureKey = parseInt(key, 10);
            }
          }
        });
      }
    } catch (e) {
      // Keine info.txt vorhanden - Standardwerte greifen
    }

    return info;
  }

  const COLLECTION_IMAGE_EXTENSIONS = ['jpg', 'png', 'webp', 'jpeg', 'JPG', 'PNG'];

  // Zeigt eine Collection, sobald ihr erstes Bild gefunden ist. Die restlichen Bilder werden
  // im Hintergrund entdeckt und nach und nach angehaengt. Die naechste Collection startet sofort.
  // artist = Kuenstler-Ordner ("1", "2", ...) -> collection/1/collection1/ ...
  // artist = ''  -> alte Struktur collection/collection1/ (Kuenstler dann aus "artist:" in info.txt)
  // folderName gesetzt (aus collection/order.json) -> genau diesen Ordner laden, ohne Kette zum naechsten
  async function loadCollection(colIndex, gallery, artist = '', folderName = null) {
    const folder = folderName || `collection${colIndex}`;
    const basePath = artist ? `/collection/${artist}` : '/collection';
    const infoPromise = loadFolderInfo(folder, basePath);
    const images = [];
    let grid = null;
    let descTile = null;      // Textkachel, die noch auf ihren Platz wartet
    let descTileAfter = 0;    // nach welchem Bild sie kommt

    await discoverImages(`${basePath}/${folder}`, COLLECTION_IMAGE_EXTENSIONS, async (path, key) => {
      const info = await infoPromise;
      const numeric = key === 'main' ? 0 : parseInt(key, 10);
      const meta = key === 'main'
        ? (info.captions['main'] || { title: info.title, description: info.description })
        : (info.captions[key] || { title: `${info.title} — #${key}`, description: info.description });

      const entry = {
        src: path,
        title: meta.title,
        description: meta.description,
        layout: key === 'main' ? 'hero' : (numeric % 3 === 0 ? 'wide' : 'square'),
        wide: !!meta.wide
      };
      const index = images.length;
      images.push(entry);

      if (index === 0) {
        const wrapper = document.createElement('section');
        wrapper.className = 'collection-wrapper';
        wrapper.id = `col-${artist || 'x'}-${folderName || colIndex}`;
        wrapper.dataset.artist = artist || info.artist || '';
        wrapper.dataset.key = `${artist || 'x'}/${folder}`; // Kennung fuer Likes, z.B. "1/collection1"
        // fuer "Sort by": empfohlene Reihenfolge (Gruppe, dann Nummer) und Datum
        wrapper.dataset.order = String((parseInt(gallery.dataset.groupIndex || '0', 10) * 1000) + colIndex);
        // Datum der Collection: 1. "date:", 2. ein Datum in der "main:"-Zeile (z.B. "30x30 / 27.08.26"), 3. Untertitel
        const mainCap = info.captions && info.captions.main;
        const when = parseCollectionDate(info.date)
          ?? (mainCap ? parseCollectionDate(`${mainCap.title || ''} ${mainCap.description || ''}`) : null)
          ?? parseCollectionDate(info.subtitle);
        // Ordnernummer (collection3 -> 3): ohne Datum kommt collection1 zuerst
        wrapper.dataset.num = String(parseInt(String(folder).replace(/\D+/g, ''), 10) || 0);
        wrapper.dataset.date = when === null ? '' : String(when);
        wrapper._images = images;   // fuer die Kuenstler-Seite
        wrapper._info = info;
        applyGalleryFilterTo(wrapper);

        const hero = document.createElement('div');
        hero.className = 'hero-item gallery-hero-item';

        const heroFrame = document.createElement('div');
        heroFrame.className = 'image-wrapper gallery-hero';
        heroFrame.style.cursor = 'pointer';
        const heroImg = document.createElement('img');
        heroImg.alt = entry.title;
        heroFrame.appendChild(heroImg);
        heroFrame.addEventListener('click', () => {
          openLightbox(entry.src, entry.title, entry.description, images, 0);
        });
        const heroStack = document.createElement('div');
        heroStack.className = 'hero-stack';
        heroStack.appendChild(heroFrame);
        hero.appendChild(heroStack);

        // Grosser Kuenstlername auf dem Hauptbild (nur in der Galerie, wenn ein Kuenstler bekannt ist)
        // Ob der grosse Name gezeigt wird, entscheidet updateArtistIntros()
        // (nur wenn der Kuenstler ein anderer ist als bei der Collection davor)
        const heroArtistCode = artist || info.artist;
        if (heroArtistCode) {
          const big = document.createElement('div');
          big.className = 'hero-artist-big';
          big.setAttribute('aria-hidden', 'true');
          const letters = Array.from(artistName(heroArtistCode));
          big.style.setProperty('--n', Math.max(1, letters.length));
          letters.forEach((ch, i) => {
            const span = document.createElement('span');
            span.textContent = ch === ' ' ? '\u00a0' : ch;
            span.style.setProperty('--i', i);                      // von links: wird in dieser Reihenfolge rot
            span.style.setProperty('--r', letters.length - 1 - i); // von rechts: letzter Buchstabe verschwindet zuerst
            big.appendChild(span);
          });
          heroFrame.appendChild(big);
          heroArtistObserver.observe(heroFrame);
        }

        // Zeile unter dem Hauptbild: Titel  Untertitel  ...........  Kuenstlername
        const label = document.createElement('div');
        label.className = 'single-line-label';
        const strong = document.createElement('strong');
        strong.textContent = info.title;
        label.appendChild(strong);
        if (info.subtitle) {
          const sub = document.createElement('span');
          sub.className = 'label-subtitle';
          sub.textContent = info.subtitle;
          label.appendChild(sub);
        }
        if (wrapper.dataset.artist) {
          const art = document.createElement('span');
          art.className = 'label-artist';
          const smallLetters = Array.from(artistName(wrapper.dataset.artist));
          art.style.setProperty('--n', Math.max(1, smallLetters.length));
          smallLetters.forEach((ch, i) => {
            const letter = document.createElement('span');
            letter.textContent = ch === ' ' ? '\u00a0' : ch;
            letter.style.setProperty('--i', i);
            art.appendChild(letter);
          });
          label.appendChild(art);
        }
        label.appendChild(createLikeButton(wrapper));
        heroStack.appendChild(label);
        wrapper.appendChild(hero);

        // Beschreibung so breit wie das Bild, roter Name passt sich der Bildbreite an
        const layoutHero = () => layoutGalleryHero(heroImg, label, heroFrame.querySelector('.hero-artist-big'));
        heroImg.addEventListener('load', layoutHero);
        // Hauptbild da: Texte einblenden und den grossen Namen erst jetzt abspielen
        const markHeroReady = () => {
          wrapper.classList.add('hero-ready');
          requestAnimationFrame(() => playHeroIntroIfVisible(heroFrame));
        };
        heroImg.addEventListener('load', markHeroReady, { once: true });
        heroImg.addEventListener('error', markHeroReady, { once: true });
        heroResizeObserver.observe(heroFrame);
        heroFrame._layoutHero = layoutHero;

        grid = document.createElement('div');
        grid.className = 'grid-right';
        wrapper.appendChild(grid);

        // Beschreibung als Textkachel zwischen den Nebenbildern:
        // - mit "desc: 1" / "desc: 2": immer, an dieser Stelle (oder in einer passenden Luecke)
        // - ohne "desc:": automatisch in eine passende Luecke, sonst ans Ende ueber beide Spalten
        const placed = info.descriptionAfter !== undefined;
        if (info.description) {
          descTile = document.createElement('div');
          descTile.className = 'gallery-desc-tile'
            + (placed && info.descriptionWidth === 2 ? ' wide-span' : '')
            + (placed ? '' : ' gap-only');
          const descInner = document.createElement('div');
          descInner.className = 'gallery-desc-inner';
          descInner.textContent = info.description;
          descTile.appendChild(descInner);
          descTileAfter = placed ? info.descriptionAfter : 0;
          if (descTileAfter === 0) { addGridItem(grid, descTile); descTile = null; }
        }

        applyGallerySort();
        scheduleArtistRender();

        ImageLoader.add(heroImg, path, () => viewportDistance(heroFrame),
          colIndex === 1 && artist === firstGalleryArtist && document.getElementById('galleryView').classList.contains('active-view'));

        if (!folderName) loadCollection(colIndex + 1, gallery, artist);
      } else {
        const card = document.createElement('div');
        card.className = 'gallery-item pending';
        const frame = document.createElement('div');
        frame.className = 'image-wrapper';
        const img = document.createElement('img');
        // "dc" in info.txt -> am Desktop ueber beide Spalten
        if (meta.wide) card.classList.add('wide-span');
        img.addEventListener('load', () => { img.classList.add('is-loaded'); card.classList.remove('pending'); scheduleGridLayout(grid); });
        img.addEventListener('error', () => { card.classList.remove('pending'); scheduleGridLayout(grid); });
        img.alt = entry.title;
        frame.appendChild(img);
        frame.addEventListener('click', () => openLightbox(entry.src, entry.title, entry.description, images, index));
        card.appendChild(frame);
        addGridItem(grid, card);

        // Textkachel direkt nach dem in info.txt genannten Bild einfuegen
        if (descTile && numeric >= descTileAfter) { addGridItem(grid, descTile); descTile = null; }

        ImageLoader.add(img, path, () => viewportDistance(frame));
        scheduleArtistRender();
      }
    });

    // Weniger Bilder als in info.txt angegeben: Textkachel ans Ende
    if (descTile && grid) addGridItem(grid, descTile);
  }

  // ==========================================
  // NEBENBILDER: EIGENES ZWEI-SPALTEN-LAYOUT
  // ==========================================
  // Jedes Bild kommt in die gerade kuerzere Spalte (Reihenfolge: Zeile fuer Zeile, links vor rechts).
  // "dc"-Bilder / "desc: 2" teilen am Desktop die Spalten in Abschnitte.
  // Die Beschreibung ("desc: 1") rutscht automatisch in eine Luecke am Ende einer kuerzeren Spalte,
  // wenn sie dort hineinpasst; sonst bleibt sie an der Stelle aus info.txt.
  const desktopGridQuery = window.matchMedia('(min-width: 901px)');

  const gridResizeObserver = new ResizeObserver((entries) => {
    entries.forEach((e) => {
      const w = Math.round(e.contentRect.width);
      if (w > 0 && w !== e.target._lastWidth) {
        e.target._lastWidth = w;
        scheduleGridLayout(e.target);
      }
    });
  });

  function addGridItem(grid, el) {
    if (!grid._items) {
      grid._items = [];
      gridResizeObserver.observe(grid);
    }
    grid._items.push(el);
    scheduleGridLayout(grid);
  }

  function scheduleGridLayout(grid) {
    if (grid._raf) return;
    grid._raf = requestAnimationFrame(() => {
      grid._raf = 0;
      layoutGrid(grid);
    });
  }

  function layoutGrid(grid) {
    layoutGridInner(grid);
    revealLoadedImages(grid); // Bilder, die vor dem Einsortieren schon fertig waren
  }

  function layoutGridInner(grid) {
    const items = grid._items || [];
    if (!items.length || grid.offsetWidth === 0) return; // unsichtbar: spaeter, sobald sichtbar
    const desktop = desktopGridQuery.matches;
    const isWide = (el) => desktop && el.classList.contains('wide-span');

    // Baut die Abschnitte; gibt sie mit den Positionen ihrer Eintraege zurueck
    const build = (list) => {
      grid.textContent = '';
      const segments = [];
      let seg = null;
      list.forEach((el, idx) => {
        if (isWide(el)) {
          grid.appendChild(el);
          seg = null;
          return;
        }
        if (!seg) {
          const row = document.createElement('div');
          row.className = 'gr-row';
          const a = document.createElement('div');
          const b = document.createElement('div');
          a.className = b.className = 'gr-col';
          row.append(a, b);
          grid.appendChild(row);
          seg = { cols: [a, b], start: idx, end: idx };
          segments.push(seg);
        }
        const [a, b] = seg.cols;
        (a.offsetHeight <= b.offsetHeight ? a : b).appendChild(el);
        seg.end = idx;
      });
      return segments;
    };

    const tile = items.find((el) => el.classList.contains('gallery-desc-tile') && !isWide(el));
    if (!tile) { build(items); return; }
    tile.classList.remove('fallback-end');

    // Erst ohne Beschreibung aufbauen und schauen, wo eine Luecke gross genug ist
    const pos = items.indexOf(tile);           // Stelle der Beschreibung laut info.txt
    const without = items.filter((el) => el !== tile);
    const segments = build(without);
    // zuerst der Abschnitt an ihrer eigenen Stelle und die danach, dann die davor (naechste zuerst)
    const order = segments
      .map((sg, k) => ({ k, rank: sg.end >= pos - 1 ? sg.start : 1e6 + (pos - sg.end) }))
      .sort((x, y) => x.rank - y.rank)
      .map((o) => segments[o.k]);

    for (const sg of order) {
      const [a, b] = sg.cols;
      const gap = Math.abs(a.offsetHeight - b.offsetHeight);
      if (gap <= 0) continue;
      const shorter = a.offsetHeight < b.offsetHeight ? a : b;
      shorter.appendChild(tile);
      if (tile.offsetHeight <= gap + 1) return; // passt in die Luecke
      tile.remove();
    }

    // Passt nirgends hinein: ohne "desc:" ans Ende ueber beide Spalten, sonst an der Stelle aus info.txt
    // ohne "desc:": ans Ende, ueber beide Spalten
    if (tile.classList.contains('gap-only')) {
      build(without);
      tile.classList.add('fallback-end');
      grid.appendChild(tile);
    } else {
      build(items);
    }
  }

  // Leerraum links/rechts eines Buchstabens in Anton bei 100px, pixelgenau gemessen (einmal pro Buchstabe)
  function letterInk(ch) {
    const cache = (letterInk._cache ||= {});
    if (cache[ch]) return cache[ch];
    const SIZE = 400, scale = SIZE / 100;
    const c = document.createElement('canvas');
    c.width = SIZE * 2; c.height = SIZE * 1.5;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.font = `${SIZE}px Anton, Impact, "Arial Narrow", sans-serif`;
    x.textBaseline = 'alphabetic';
    const adv = x.measureText(ch).width;
    x.fillText(ch, SIZE * 0.25, SIZE);
    const d = x.getImageData(0, 0, c.width, c.height).data;
    let minX = c.width, maxX = -1;
    for (let yy = 0; yy < c.height; yy++) {
      for (let xx = 0; xx < c.width; xx++) {
        if (d[(yy * c.width + xx) * 4 + 3] > 40) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; }
      }
    }
    const res = maxX < 0 ? { left: 0, right: 0 }
      : { left: (minX - SIZE * 0.25) / scale, right: (SIZE * 0.25 + adv - 1 - maxX) / scale };
    if (document.fonts && document.fonts.check(`${SIZE}px Anton`)) cache[ch] = res; // erst merken, wenn Anton geladen ist
    return res;
  }

  function layoutGalleryHero(img, label, big) {
    if (!img.naturalWidth || !img.offsetWidth) return;
    const w = img.offsetWidth;
    label.style.width = w + 'px';

    // Abstand, um den der Block beim Scrollen nach unten gleitet, damit er mittig steht
    const stack = img.closest('.hero-stack');
    const hero = img.closest('.hero-item');
    if (stack && hero) {
      // genau in die Mitte des Bildschirms (der Titel ist beim Scrollen ausgeblendet)
      const stickyTop = parseFloat(getComputedStyle(hero).top) || 0;
      const offset = (window.innerHeight - stack.offsetHeight) / 2 - stickyTop;
      stack.style.setProperty('--center-offset', offset + 'px');
    }
    if (big) {
      // Name fuellt die ganze Bildbreite, ganz ohne Rand: gemessen wird die echte Tinte der Buchstaben
      // (ohne den eingebauten Leerraum der Schrift links/rechts und unter der Grundlinie).
      big.style.removeProperty('--name-stretch');
      const stretch = parseFloat(getComputedStyle(big).getPropertyValue('--name-stretch')) || 1;
      const text = (big.textContent || '').replace(/\u00a0/g, ' ').toUpperCase();
      const ctx = (layoutGalleryHero._ctx ||= document.createElement('canvas').getContext('2d'));
      ctx.font = '100px Anton, Impact, "Arial Narrow", sans-serif';
      const m = ctx.measureText(text);
      const t = text.trim();
      const inkStart = letterInk(t.charAt(0)).left;                     // Leerraum vor dem ersten Buchstaben (pixelgenau)
      const inkEndGap = letterInk(t.charAt(t.length - 1)).right;       // Leerraum nach dem letzten Buchstaben
      big.style.fontSize = '100px';
      const advance = big.scrollWidth;                                 // echte Breite, wie der Browser sie setzt
      const inkWidth = advance - inkStart - inkEndGap;
      const cs2 = getComputedStyle(big);
      const overX = parseFloat(cs2.getPropertyValue('--name-overflow-x')) || 0;
      const sink = parseFloat(cs2.getPropertyValue('--name-sink')) || 0;
      const target = w * (1 + overX);                                  // etwas breiter als das Bild
      if (w > 0 && inkWidth > 0) {
        const MIN = 22;                                                // kleiner soll der Name nicht werden
        let s = stretch;
        let size = 100 * target / (inkWidth * s);
        if (size < MIN) {
          // sehr langer Name: weniger dehnen statt winzig machen (nie unter 1 = ungedehnt)
          s = Math.max(1, 100 * target / (inkWidth * MIN));
          size = 100 * target / (inkWidth * s);
        }
        size = Math.min(size, img.offsetHeight * 0.95);                // nie hoeher als fast das ganze Bild
        const k = size / 100;
        big.style.setProperty('--name-stretch', String(s));
        big.style.fontSize = size + 'px';
        // links: Leerraum der Schrift wegschieben; unten: Grundlinie genau auf die Bildkante
        big.style.left = (-inkStart * k * s - (target - w) / 2) + 'px'; // gleich viel links und rechts ueber den Rand
        const lineBox = big.getBoundingClientRect().height;            // Hoehe der Zeile (line-height 1 = size)
        const descent = (m.fontBoundingBoxDescent || 0) * k;
        const ascent = (m.fontBoundingBoxAscent || 0) * k;
        const halfLeading = (lineBox - (ascent + descent)) / 2;
        const baseBottom = -(descent + halfLeading) - sink * size;
        if (big.dataset.place === 'above') {
          // Kuenstler-Seite: Name steht UEBER dem Bild, die Buchstaben sitzen genau auf der Oberkante
          big.style.bottom = `calc(100% + ${baseBottom}px)`;
          const inkAscent = (m.actualBoundingBoxAscent || 72) * k;
          big.parentElement.style.marginTop = Math.ceil(inkAscent) + 'px';
        } else {
          big.style.bottom = baseBottom + 'px'; // unten ueber den Rand hinaus
        }
      }
    }
  }

  // Spielt die Kuenstlernamen-Animation ab, sobald ein Hauptbild zur Haelfte sichtbar ist,

  function playHeroIntroIfVisible(frame) {
    const big = frame.querySelector('.hero-artist-big');
    if (!big || big.classList.contains('play')) return;
    const r = frame.getBoundingClientRect();
    const visible = Math.max(0, Math.min(r.bottom, innerHeight) - Math.max(r.top, 0));
    if (r.height > 0 && visible / r.height >= 0.5) {
      const stack = frame.closest('.hero-stack');
      const small = stack && stack.querySelector('.label-artist');
      void big.offsetWidth;
      big.classList.add('play');
      if (small) small.classList.add('play');

  }

      const small = stack && stack.querySelector('.label-artist');

  async function loadCollectionsAutomatically() {

  // ==========================================
  // TIMELINE HILFSFUNKTIONEN & DATUM-PARSER
  // ==========================================
  const monthNamesGerman = {
    jan: 'Januar', januar: 'Januar', feb: 'Februar', februar: 'Februar',
    mar: 'März', maerz: 'März', apr: 'April', april: 'April',
    may: 'Mai', mai: 'Mai', jun: 'Juni', juni: 'Juni',
    jul: 'Juli', juli: 'Juli', aug: 'August', august: 'August',
    sep: 'September', september: 'September', oct: 'Oktober', okt: 'Oktober', oktober: 'Oktober',
    nov: 'November', november: 'November', dec: 'Dezember', dez: 'Dezember', dezember: 'Dezember'
  };

  const monthIndexMap = {
    januar: 0, jan: 0, februar: 1, feb: 1, märz: 2, maerz: 2, mar: 2,
    april: 3, apr: 3, mai: 4, may: 4, juni: 5, jun: 5, juli: 6, jul: 6,
    august: 7, aug: 7, september: 8, sep: 8, oktober: 9, okt: 9, oct: 9,
    november: 10, nov: 10, dezember: 11, dez: 11, dec: 11,
    january: 0, february: 1, march: 2, june: 5, july: 6, october: 9, december: 11
  };

  // Dateinamen der Timeline (an "_" getrennt, Bindestriche im Titel bleiben erhalten):
  //   DATUM_TITEL_KUENSTLER        z.B. 28102026_wanderweg im herbstwald_1
  //   DATUM_ORT_TITEL_KUENSTLER    z.B. 31102026_Biel_Konzert_1
  //   TITEL_JAHRESZEIT JAHR        z.B. Nidau abstrakt_sommer 26
  // Der letzte Teil ist der Kuenstler, wenn er in artists.json steht oder eine Zahl ist.
  // Liegt die Datei in einem Kuenstler-Ordner ("1/..."), gilt dieser Ordner als Kuenstler, falls im Namen keiner steht.
  const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MONTHS_DE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const SEASON_NAMES = {
    0: { de: 'Frühling', en: 'Spring' }, 1: { de: 'Sommer', en: 'Summer' },
    2: { de: 'Herbst', en: 'Autumn' }, 3: { de: 'Winter', en: 'Winter' }
  };
  const SEASON_WORDS = {
    fruehling: 0, 'frühling': 0, spring: 0, sommer: 1, summer: 1,
    herbst: 2, autumn: 2, fall: 2, winter: 3
  };

  function isArtistCode(part) {
    return Object.prototype.hasOwnProperty.call(artistNames, part) || /^\d{1,3}$/.test(part);
  }

  // Liest einen Teil des Dateinamens als Datum. Rueckgabe { text, date } oder null.
  function parseNameDate(part) {
    const p = part.trim().toLowerCase();
    let m;
    const fullYear = (y) => { y = parseInt(y, 10); return y < 100 ? y + 2000 : y; };

    // 28102026 / 281026
    if ((m = p.match(/^(\d{2})(\d{2})(\d{4}|\d{2})$/))) {
      const day = parseInt(m[1], 10), month = parseInt(m[2], 10) - 1, year = fullYear(m[3]);
      if (month < 0 || month > 11 || day < 1 || day > 31) return null;
      return { day, month, year, date: new Date(year, month, day) };
    }
    // 28.10.2026 / 2026-10-28
    if ((m = p.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/))) {
      const year = fullYear(m[3]);
      return { day: +m[1], month: +m[2] - 1, year, date: new Date(year, +m[2] - 1, +m[1]) };
    }
    if ((m = p.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) {
      return { day: +m[3], month: +m[2] - 1, year: +m[1], date: new Date(+m[1], +m[2] - 1, +m[3]) };
    }
    // 12mai2024 / 12 mai 24
    if ((m = p.match(/^(\d{1,2})\s*([a-zäöü]+)\s*(\d{2,4})$/)) && monthIndexMap[m[2]] !== undefined) {
      const month = monthIndexMap[m[2]], year = fullYear(m[3]);
      return { day: +m[1], month, year, date: new Date(year, month, +m[1]) };
    }
    // mai 2024 / mai 24
    if ((m = p.match(/^([a-zäöü]+)\s*(\d{2}|\d{4})$/)) && monthIndexMap[m[1]] !== undefined) {
      const month = monthIndexMap[m[1]], year = fullYear(m[2]);
      return { month, year, date: new Date(year, month, 1) };
    }
    // sommer 26 / herbst 2026
    if ((m = p.match(/^([a-zäöü]+)\s*(\d{2}|\d{4})$/)) && SEASON_WORDS[m[1]] !== undefined) {
      const season = SEASON_WORDS[m[1]], year = fullYear(m[2]);
      return { season, year, date: new Date(year, [2, 5, 8, 11][season], 1) };
    }
    // nur ein Jahr: 2026
    if ((m = p.match(/^(19|20)\d{2}$/))) {
      return { year: +p, date: new Date(+p, 0, 1) };
    }
    return null;
  }

  function formatNameDate(d) {
    if (d.season !== undefined) return `${SEASON_NAMES[d.season][LANG]} ${d.year}`;
    const monthName = d.month !== undefined ? (LANG === 'de' ? MONTHS_DE : MONTHS_EN)[d.month] : '';
    if (d.day !== undefined) return LANG === 'de' ? `${d.day}. ${monthName} ${d.year}` : `${d.day} ${monthName} ${d.year}`;
    if (monthName) return `${monthName} ${d.year}`;
    return String(d.year);
  }

  function parseFilenameToMetadata(filename) {
    const pathParts = String(filename).split('/').filter(Boolean);
    const fileOnly = pathParts.pop() || '';
    const folderArtist = pathParts.length ? pathParts[0] : '';
    const baseName = fileOnly.replace(/\.(jpg|jpeg|png|webp)$/i, '').trim();
    const splitter = baseName.includes('_') ? /_+/ : /[-_]+/;
    const parts = baseName.split(splitter).map(p => p.trim()).filter(Boolean);

    // 1. Kuenstler: letzter Teil
    let artistCode = '';
    if (parts.length >= 2 && isArtistCode(parts[parts.length - 1])) artistCode = parts.pop();
    if (!artistCode && folderArtist && isArtistCode(folderArtist)) artistCode = folderArtist;

    // 2. Datum: zuerst der erste Teil, sonst irgendein Teil, der wie ein Datum aussieht
    let dateInfo = null;
    let dateIdx = parts.length ? (parseNameDate(parts[0]) ? 0 : -1) : -1;
    if (dateIdx === -1) dateIdx = parts.findIndex((p) => parseNameDate(p));
    if (dateIdx !== -1) {
      dateInfo = parseNameDate(parts[dateIdx]);
      parts.splice(dateIdx, 1);
    }

    // 3. Was uebrig bleibt: ein Teil = Titel, mehrere Teile = Ort + Titel
    let location = '';
    let title = '';
    if (parts.length >= 2) {
      location = parts[0];
      title = parts.slice(1).join(' ');
    } else if (parts.length === 1) {
      title = parts[0];
    }

    const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

    return {
      dateText: dateInfo ? formatNameDate(dateInfo) : '',
      location: capitalize(location),
      title: capitalize(title),
      artistCode,
      description: '',
      dateObj: dateInfo ? dateInfo.date : new Date(0)
    };
  }

  // Kuenstler-Namen: { "1": "Name", "2": "Name" }
  let artistNames = {};
  // Kuenstler-Namen aus artists.json im Hauptordner (Ersatz: timeline/artists.json)

  // ==========================================
  // SORT BY (Galerie): empfohlen = eigene Reihenfolge, Datum = neueste zuerst
  // ==========================================
  let gallerySort = 'recommended';
  try {
    const saved = localStorage.getItem('nena-sort');
    if (saved === 'recommended' || saved === 'date') gallerySort = saved;
  } catch (e) { /* kein Speicher: Empfohlen */ }

  const SEASON_MONTH = { fruehling: 2, 'frühling': 2, spring: 2, sommer: 5, summer: 5, herbst: 8, autumn: 8, fall: 8, winter: 11 };

  // Liest "27.08.2026", "2026-08-27", "27082026", "august 2026", "sommer 2026" oder "2026"
  function parseCollectionDate(text) {
    if (!text) return null;
    const t = String(text).toLowerCase();
    let m;
    if ((m = t.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) {
      let y = parseInt(m[3], 10); if (y < 100) y += 2000;
      return new Date(y, parseInt(m[2], 10) - 1, parseInt(m[1], 10)).getTime();
    }
    if ((m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) {
      return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10)).getTime();
    }
    if ((m = t.match(/\b(\d{2})(\d{2})(\d{4})\b/))) {
      return new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10)).getTime();
    }
    const year = t.match(/\b(19|20)\d{2}\b/);
    if (!year) return null;
    let month = 0;
    const words = t.split(/[^a-zäöü]+/).filter(Boolean);
    for (const w of words) {
      if (monthIndexMap[w] !== undefined) { month = monthIndexMap[w]; break; }
      if (SEASON_MONTH[w] !== undefined) { month = SEASON_MONTH[w]; break; }
    }
    return new Date(parseInt(year[0], 10), month, 1).getTime();
  }

  // EMPFOHLEN = Likes und Aktualitaet zusammen:
  //   Punkte = (Likes + 1) / (Alter in Wochen + 2) ^ 1.2
  // Ein Like zaehlt bei einer neuen Collection viel, bei einer alten weniger; neue Collections ohne Likes
  // stehen trotzdem weit oben. Ohne Likes (oder ohne Datenbank) ergibt das genau die Datums-Reihenfolge.
  // Collections ohne Datum gelten als ein halbes Jahr alt.
  const RECOMMEND_GRAVITY = 1.2;
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  function recommendScore(w) {
    const likes = parseInt(w.dataset.likes || '0', 10) || 0;
    const date = w.dataset.date === '' || w.dataset.date === undefined ? null : parseFloat(w.dataset.date);
    const ageWeeks = date === null ? 26 : Math.max(0, (Date.now() - date) / WEEK_MS);
    return (likes + 1) / Math.pow(ageWeeks + 2, RECOMMEND_GRAVITY);
  }

  // Nach Datum: neuestes zuerst, ohne Datum danach nach Name (collection1 zuerst)
  function compareByDate(a, b) {
    const da = a.dataset.date === '' ? null : parseFloat(a.dataset.date);
    const db = b.dataset.date === '' ? null : parseFloat(b.dataset.date);
    if (da !== null && db !== null && da !== db) return db - da;
    if (da === null && db !== null) return 1;
    if (db === null && da !== null) return -1;
    const na = parseInt(a.dataset.num || '0', 10), nb = parseInt(b.dataset.num || '0', 10);
    if (na !== nb) return na - nb;
    return parseInt(a.dataset.order || '0', 10) - parseInt(b.dataset.order || '0', 10);
  }

  function applyGallerySort() {
    const gallery = document.getElementById('dynamicGallery');
    if (!gallery) return;
    const wrappers = Array.from(gallery.querySelectorAll('.collection-wrapper'));
    const before = wrappers.map((w) => w.dataset.key).join(',');
    wrappers.sort((a, b) => {
      if (gallerySort === 'recommended') {
        const diff = recommendScore(b) - recommendScore(a);
        if (Math.abs(diff) > 1e-9) return diff;
      }
      return compareByDate(a, b);
    });
    if (wrappers.map((w) => w.dataset.key).join(',') === before) return; // nichts veraendert: nichts verschieben
    wrappers.forEach((w) => gallery.appendChild(w));
    updateArtistIntros();
    if (typeof scheduleArtistRender === 'function') scheduleArtistRender(); // Kuenstler-Seite folgt der Reihenfolge
  }

  // ==========================================
  // LIKES (pro Collection, eins pro IP; gespeichert ueber /api, siehe Ordner api/)
  // Ohne eingerichtete Datenbank bleiben die Herzen einfach versteckt.
  // ==========================================
  const likeState = {};          // key -> { count, liked }
  let likesAvailable = false;
  let likeFetchTimer = null;
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg>';

  function createLikeButton(wrapper) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'like-btn';
    btn.hidden = true;
    btn.innerHTML = HEART + '<span class="like-count"></span>';
    btn.setAttribute('aria-label', 'Like');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(wrapper.dataset.key, btn);
    });
    scheduleLikeFetch();
    return btn;
  }

  function renderLikes() {
    document.querySelectorAll('#dynamicGallery .collection-wrapper').forEach((w) => {
      const st = likeState[w.dataset.key];
      const btn = w.querySelector('.like-btn');
      w.dataset.likes = String(st ? st.count : 0);
      if (!btn) return;
      btn.hidden = !likesAvailable;
      btn.classList.toggle('liked', !!(st && st.liked));
      btn.setAttribute('aria-pressed', String(!!(st && st.liked)));
      btn.querySelector('.like-count').textContent = st ? String(st.count) : '';
    });
  }

  function scheduleLikeFetch() {
    clearTimeout(likeFetchTimer);
    likeFetchTimer = setTimeout(fetchLikes, 400);
  }

  async function fetchLikes() {
    const keys = Array.from(document.querySelectorAll('#dynamicGallery .collection-wrapper'))
      .map((w) => w.dataset.key).filter(Boolean);
    if (!keys.length) return;
    try {
      const res = await fetch('/api/likes?ids=' + encodeURIComponent(keys.join(',')), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      keys.forEach((k) => { likeState[k] = { count: data.counts[k] || 0, liked: !!data.liked[k] }; });
      likesAvailable = true;
    } catch (e) {
      likesAvailable = false;
    }
    renderLikes();
    // Neue Like-Zahlen vom Server: Empfohlen neu ordnen. (Eigene Klicks ordnen bewusst nicht sofort um,
    // sonst springt die Collection unter dem Finger weg; das passiert erst beim naechsten Laden/Sortieren.)
    if (gallerySort === 'recommended') applyGallerySort();
  }

  async function toggleLike(key, btn) {
    const before = likeState[key] || { count: 0, liked: false };
    likeState[key] = { liked: !before.liked, count: Math.max(0, before.count + (before.liked ? -1 : 1)) };
    renderLikes();
    btn.classList.add('pop');
    setTimeout(() => btn.classList.remove('pop'), 200);
    try {
      const res = await fetch('/api/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: key })
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      likeState[key] = { count: data.count, liked: data.liked };
    } catch (e) {
      likeState[key] = before;
    }
    renderLikes();
  }

  // Besucher heute: einmal pro Seitenaufruf melden; der Server zaehlt jeden Besucher (IP) nur einmal pro Tag
  (async function countVisit() {
    try {
      const res = await fetch('/api/visit', { method: 'POST', cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      document.getElementById('visitCount').textContent = String(data.count);
      document.getElementById('visitCounter').hidden = false;
    } catch (e) {
      // keine Datenbank: Zaehler bleibt versteckt
    }
  })();

  function setGallerySort(mode) {
    gallerySort = mode;
    try { localStorage.setItem('nena-sort', mode); } catch (e) { /* privates Fenster: egal */ }
    document.querySelectorAll('.sort-option').forEach((o) => o.classList.toggle('active', o.dataset.sort === mode));
    applyGallerySort();
    document.getElementById('navWrapper').classList.remove('mobile-menu-active');
    closeNavSubmenus();
    if (!document.getElementById('galleryView').classList.contains('active-view')) switchView('gallery');
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('.sort-option').forEach((o) => {
    o.classList.toggle('active', o.dataset.sort === gallerySort);
    o.addEventListener('click', (e) => {

  // ==========================================
  // EINZELNE KUENSTLER-SEITE (/kuenstler/<name>)
  // Links: Hauptbild der obersten Collection des Kuenstlers, der grosse Name steht darueber.
  // Rechts: Zeitstrahl nur dieses Kuenstlers, dazwischen eine feine, kurze Linie.
  // ==========================================
  function artistSlug(code) {
    return String(artistNames[code] || code)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || String(code);
  }

  function artistCodeFromSlug(slug) {
    const want = String(slug || '').toLowerCase();
    return Object.keys(artistNames).find((c) => artistSlug(c) === want || c === want) || null;
  }

  let artistRenderRaf = 0;
  function scheduleArtistRender() {
    if (artistRenderRaf) return;
    artistRenderRaf = requestAnimationFrame(() => {
      artistRenderRaf = 0;
      if (document.getElementById('artistView').classList.contains('active-view')) renderArtistPage();
    });
  }

  function buildBigName(code) {
    const big = document.createElement('div');
    big.className = 'hero-artist-big artist-big';
    big.dataset.place = 'above';
    big.setAttribute('aria-hidden', 'true');
    const letters = Array.from(artistName(code));
    big.style.setProperty('--n', Math.max(1, letters.length));
    letters.forEach((ch) => {
      const span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00a0' : ch;
      big.appendChild(span);
    });
    return big;
  }

  function timelineLightboxEntry(it) {
    const details = [artistName(it.artistCode), it.dateText, it.location].filter(Boolean).join(' · ');
    return {
      src: it.src,
      title: it.title || it.location || it.dateText,
      description: it.description || details,
      broll: it.broll || null
    };
  }

  function buildArtistSideCard(images, index) {
    const entry = images[index];
    const card = document.createElement('div');
    card.className = 'gallery-item pending' + (entry.wide ? ' wide-span' : '');
    const frame = document.createElement('div');
    frame.className = 'image-wrapper';
    const img = document.createElement('img');
    img.alt = entry.title || '';
    const done = () => { card.classList.remove('pending'); if (card._grid) scheduleGridLayout(card._grid); };
    img.addEventListener('load', () => img.classList.add('is-loaded'));
    img.addEventListener('load', done);
    img.addEventListener('error', done);
    img.decoding = 'async';
    img.src = entry.src;
    frame.appendChild(img);
    frame.addEventListener('click', () => openLightbox(entry.src, entry.title, entry.description, images, index));
    card.appendChild(frame);
    return card;
  }

  function renderArtistPage() {
    const layoutEl = document.querySelector('#artistView .artist-layout');
    const main = document.getElementById('artistMain');
    const list = document.getElementById('artistTimelineList');
    if (!main || !list || !layoutEl) return;

    const code = artistCodeFromSlug(currentArtistSlug);
    if (!code) {
      // Namen noch nicht geladen oder unbekannter Kuenstler
      main.innerHTML = '';
      list.innerHTML = '';
      main.dataset.renderKey = '';
      return;
    }
    document.title = artistName(code) + ' – NENA NETWORK';

    // --- Links: ALLE Collections des Kuenstlers (gleiche Reihenfolge wie in der Galerie), untereinander scrollbar.
    //     Jede: Hauptbild (bleibt beim Scrollen stehen) + zwei Spalten; der grosse Name nur ueber der obersten.
    const wrappers = Array.from(document.querySelectorAll('#dynamicGallery .collection-wrapper'))
      .filter((w) => w.dataset.artist === code && w._images && w._images.length);
    const renderKey = code + '|' + wrappers.map((w) => w.dataset.key).join(',');
    if (main.dataset.renderKey !== renderKey) {
      main.dataset.renderKey = renderKey;
      main.innerHTML = '';
      main._sections = [];

      const back = document.createElement('a');
      back.className = 'artist-back';
      back.href = VIEW_PATHS.artists;
      back.textContent = '← ' + t('backToArtists');
      back.addEventListener('click', (e) => { e.preventDefault(); switchView('artists'); });
      main.appendChild(back);

      if (!wrappers.length) {
        // noch keine Collection geladen (oder keine vorhanden): nur der Name
        const name = document.createElement('h1');
        name.className = 'artist-name-plain';
        name.textContent = artistName(code);
        main.appendChild(name);
      }

      wrappers.forEach((w, wi) => {
        const images = w._images;
        const info = w._info || {};
        const collection = document.createElement('section');
        collection.className = 'artist-collection';

        const heroCol = document.createElement('div');
        heroCol.className = 'artist-hero-col';
        const stack = document.createElement('div');
        stack.className = 'artist-hero-stack';

        const frame = document.createElement('div');
        frame.className = 'artist-hero-frame';
        const big = wi === 0 ? buildBigName(code) : null;
        const img = document.createElement('img');
        img.alt = images[0].title || '';
        img.src = images[0].src;
        img.addEventListener('click', () => openLightbox(images[0].src, images[0].title, images[0].description, images, 0));
        if (big) frame.appendChild(big);
        frame.appendChild(img);
        stack.appendChild(frame);

        const label = document.createElement('div');
        label.className = 'single-line-label';
        const strong = document.createElement('strong');
        strong.textContent = info.title || '';
        label.appendChild(strong);
        if (info.subtitle) {
          const sub = document.createElement('span');
          sub.className = 'label-subtitle';
          sub.textContent = info.subtitle;
          label.appendChild(sub);
        }
        stack.appendChild(label);
        heroCol.appendChild(stack);

        const layout = () => layoutGalleryHero(img, label, big);
        img.addEventListener('load', layout);
        if (img.complete && img.naturalWidth) requestAnimationFrame(layout);
        frame._layoutHero = layout;
        heroResizeObserver.observe(frame);

        const grid = document.createElement('div');
        grid.className = 'grid-right';
        if (info.description) {
          const tile = document.createElement('div');
          tile.className = 'gallery-desc-tile gap-only';
          const inner = document.createElement('div');
          inner.className = 'gallery-desc-inner';
          inner.textContent = info.description;
          tile.appendChild(inner);
          addGridItem(grid, tile);
        }

        collection.append(heroCol, grid);
        main.appendChild(collection);
        main._sections.push({ grid, images, shown: 1 });
      });
    }

    // weitere Bilder, die seit dem letzten Aufruf gefunden wurden
    (main._sections || []).forEach((sec) => {
      for (let i = Math.max(1, sec.shown); i < sec.images.length; i++) {
        const card = buildArtistSideCard(sec.images, i);
        card._grid = sec.grid;
        addGridItem(sec.grid, card);
      }
      sec.shown = Math.max(1, sec.images.length);
    });

    requestAnimationFrame(updateArtistDivider);

    // --- Rechts: Zeitstrahl dieses Kuenstlers (ohne Eintraege: Spalte und Linie ausgeblendet) ---
    const items = timelineAllItems.filter((it) => it.artistCode === code);
    layoutEl.classList.toggle('no-timeline', items.length === 0);
    const listKey = items.map((it) => it.src).join('|');
    if (list.dataset.renderKey === listKey) return;
    list.dataset.renderKey = listKey;
    list.innerHTML = '';
    if (!items.length) return;

    const singles = items.filter((it) => !it.isCollection);
    items.forEach((it) => {
      const row = document.createElement('a');
      row.className = 'artist-tl-item';
      row.setAttribute('role', 'button');
      const thumb = document.createElement('img');
      thumb.alt = '';
      thumb.src = it.src;
      const text = document.createElement('span');
      text.className = 'artist-tl-text';
      const date = document.createElement('span');
      date.className = 'artist-tl-date';
      date.textContent = it.dateText || '';
      const title = document.createElement('span');
      title.className = 'artist-tl-title';
      title.textContent = it.title || it.location || '';
      text.append(date, title);
      if (it.broll && it.broll.images && it.broll.images.length) {
        text.appendChild(createBrollBadge(it.broll.images.length, () => openTimelineItemWithBroll(it, items)));
      }
      row.append(thumb, text);
      row.addEventListener('click', (e) => {
        e.preventDefault();
        if (it.isCollection) { openEventOverlay(it); return; }
        const entries = singles.map(timelineLightboxEntry);
        const idx = singles.indexOf(it);
        openLightbox(entries[idx].src, entries[idx].title, entries[idx].description, entries, idx);
      });
      list.appendChild(row);
    });
  }

  // Trennlinie folgt der Zeitstrahl-Liste: oben = tief (auf Hoehe des Titels), mit dem Scrollen hoch
  function updateArtistDivider() {
    const aside = document.querySelector('#artistView .artist-timeline');
    const divider = document.querySelector('#artistView .artist-divider');
    if (!aside || !divider) return;
    if (!desktopGridQuery.matches) { divider.style.removeProperty('--divider-drop'); return; }
    const titleTop = parseFloat(getComputedStyle(aside).paddingTop) || 0; // Titel beginnt hier (Liste startet mittig)
    const maxDrop = Math.max(0, titleTop - window.innerHeight * 0.225);  // 22.5vh = obere Ruheposition der Linie
    const drop = Math.max(0, maxDrop - aside.scrollTop);
    divider.style.setProperty('--divider-drop', drop + 'px');
  }
  (function () {
    const aside = document.querySelector('#artistView .artist-timeline');
    if (aside) aside.addEventListener('scroll', updateArtistDivider, { passive: true });
    window.addEventListener('resize', updateArtistDivider);
  })();

  artistsReady.then(() => scheduleArtistRender());

  // ==========================================
  // ARTISTS-SEITE (/artists): Liste der Namen, Klick oeffnet die Seite des Kuenstlers
  // ==========================================
  artistsReady.then(() => {
    const list = document.getElementById('artistsList');
    if (!list) return;
    list.innerHTML = '';
    Object.keys(artistNames).forEach((code) => {
      const a = document.createElement('a');
      a.textContent = artistNames[code];
      a.href = artistPagePath(artistSlug(code));
      a.addEventListener('click', (e) => {
        e.preventDefault();
        switchView('artist', true, artistSlug(code));
      });
      list.appendChild(a);
    });
  });

  (function () {
    const indicator = document.getElementById('artistFilterIndicator');
    if (indicator) indicator.addEventListener('click', (e) => { e.stopPropagation(); setArtistFilter(null); });
  })();

  // ==========================================
  // UHREN-MECHANIK & ZENTRIERTE TIMELINE
  // ==========================================
  let currentTimelineIndex = 0;
  let targetTimelineIndex = 0;
  let timelineItemsGlobal = [];

  function updateTimelineWheel(index) {
    if (timelineItemsGlobal.length === 0) return;

    const previousIndex = currentTimelineIndex;
    currentTimelineIndex = Math.max(0, Math.min(index, timelineItemsGlobal.length - 1));
    targetTimelineIndex = currentTimelineIndex;

    // Datums-Anzeige einblenden, sobald tatsaechlich zu einem anderen Bild gewechselt wurde (Timer 2 s)
    if (currentTimelineIndex !== previousIndex) pokeTimelineDates();

    // Mobile Datums-Walze: aktives Datum in die Mitte des 60px-Fensters (Zeilen je 20px)
    const wheelTrack = document.getElementById('mobileDateTrack');
    if (wheelTrack) {
      wheelTrack.style.transform = `translateY(${30 - 10 - currentTimelineIndex * 20}px)`;
      Array.from(wheelTrack.children).forEach((el, i) => el.classList.toggle('active', i === currentTimelineIndex));
    }

    setHeaderScrolledState(currentTimelineIndex > 0);

    const stack = document.getElementById('timelineStack');
    const rows = document.querySelectorAll('.timeline-row');
    const ticks = document.querySelectorAll('.zeitstrahl-tick');
    const thumbs = document.querySelectorAll('.mini-thumb');
    const zeitstrahlDot = document.getElementById('zeitstrahlDot');

    if (rows.length === 0) return;

    // Center image stack
    const offsetY = -(currentTimelineIndex * window.innerHeight);
    stack.style.transform = `translateX(-50%) translateY(${offsetY}px)`;

    // Center mini-slider thumbnails
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const thumbHeight = 54; // 48px + 6px gap
    const thumbOffsetY = -(currentTimelineIndex * thumbHeight);
    if (miniSliderTrack) {
      miniSliderTrack.style.transform = `translateY(calc(50% - 27px + ${thumbOffsetY}px))`;
    }
      
    // Center date ticks perfectly in the 250px viewport
    const ticksTrack = document.getElementById('zeitstrahlTicks');
    const itemHeight = 18; // Height of each tick item
    const gap = 38;        // Must match the CSS gap above
    const tickHeight = itemHeight + gap; 
    const viewportCenter = 125; // Half of the 250px viewport height
    
    // Calculates exact offset to keep active tick dead-center
    const tickOffsetY = viewportCenter - (itemHeight / 2) - (currentTimelineIndex * tickHeight);
    
    if (ticksTrack) {
      ticksTrack.style.transform = `translateY(${tickOffsetY}px)`;
    }

    rows.forEach((r, idx) => r.classList.toggle('active-center', idx === currentTimelineIndex));
    ticks.forEach((t, idx) => t.classList.toggle('active', idx === currentTimelineIndex));
    thumbs.forEach((m, idx) => m.classList.toggle('active', idx === currentTimelineIndex));

    if (zeitstrahlDot && rows.length > 1) {
      const percent = (currentTimelineIndex / (rows.length - 1)) * 100;
      zeitstrahlDot.style.top = `${percent}%`;
    }
}

  let isScrollingTimeline = false;

  window.addEventListener('wheel', (e) => {
    const timelineView = document.getElementById('timelineView');
    if (!timelineView || !timelineView.classList.contains('active-view')) return;

    // Event-Ansicht und Lightbox scrollen/zoomen selbst - die Timeline dahinter darf nicht mitlaufen
    if (isTimelineOverlayOpen()) return;

    e.preventDefault();

    if (Math.abs(e.deltaY) > 5) {
      const direction = e.deltaY > 0 ? 1 : -1;
      
      // Accumulate target index immediately for fast consecutive scrolls
      targetTimelineIndex = Math.max(0, Math.min(targetTimelineIndex + direction, timelineItemsGlobal.length - 1));
      
      updateTimelineWheel(targetTimelineIndex);
    }
  }, { passive: false });

  // Kleines B-Roll-Symbol (gleich wie in der Bildansicht) fuer Timeline und Kuenstler-Seite
  function createBrollBadge(count, onOpen) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'broll-badge';
    btn.title = t('broll');
    btn.setAttribute('aria-label', t('broll'));
    btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="14"></rect><polyline points="3,7 3,21 17,21"></polyline></svg>'
      + (count > 1 ? `<span>${count}</span>` : '');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      onOpen();
    });
    return btn;
  }

  // Oeffnet ein Timeline-Bild in der Bildansicht und klappt gleich die B-Roll-Liste auf
  function openTimelineItemWithBroll(item, pool) {
    if (item.isCollection) {
      openLightbox(item.images[0].src, item.images[0].title, item.images[0].description, item.images, 0);
    } else {
      const singles = (pool || timelineItemsGlobal).filter((it) => !it.isCollection);
      const list = singles.map(timelineLightboxEntry);
      const idx = singles.indexOf(item);
      if (idx === -1) return;
      openLightbox(list[idx].src, list[idx].title, list[idx].description, list, idx);
    }
    requestAnimationFrame(() => setBrollOpen(true));
  }

  // Zentraler Klick-Handler für das aktive Timeline-Bild
  function openCurrentTimelineLightbox() {
    if (timelineItemsGlobal.length === 0) return;
    const item = timelineItemsGlobal[currentTimelineIndex];
    if (!item) return;

    // Ordner-Event: Event-Ansicht mit allen Bildern oeffnen
    if (item.isCollection) {
      openEventOverlay(item);
      return;
    }

    const toLightboxEntry = (it) => {
      const details = [artistName(it.artistCode), it.dateText, it.location].filter(Boolean).join(' · ');
      return {
        src: it.src,
        title: it.title || it.location || it.dateText,
        description: it.description || details,
        broll: it.broll || null
      };
    };

    // Alle einzelnen Timeline-Bilder (ohne Ordner) als Wechselliste
    const singles = timelineItemsGlobal.filter((it) => !it.isCollection);
    const list = singles.map(toLightboxEntry);
    const idx = singles.indexOf(item);
    const entry = toLightboxEntry(item);

    openLightbox(entry.src, entry.title, entry.description, list, idx);
  }
  // ==========================================
  // TIMELINE-EVENTS AUS ORDNERN (mehrere Bilder pro Event)
  // timeline.json darf Dateien UND Ordner enthalten:
  //   "12mai2024-Berlin-Konzert.jpg"       -> einzelnes Bild, Beschreibung kommt aus dem Dateinamen
  //   "12mai2024-Berlin-Konzert"           -> Ordner ./timeline/12mai2024-Berlin-Konzert/
  //   "12mai2024-Berlin-Konzert/main.jpg"  -> ebenfalls dieser Ordner
  // Im Ordner: main.jpg = Titelbild, 1.jpg, 2.jpg, ... = weitere Bilder (wie bei den Collections),
  // optional info.txt (title:, description:, main: Titel | Text, 1: Titel | Text, ...).
  // Der Ordnername wird wie ein Dateiname gelesen (Datum-Ort-Beschreibung).
  // ==========================================
  const TIMELINE_IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'PNG'];
  let timelineSuppressClickUntil = 0; // verhindert den "Geister-Klick" direkt nach einer Wischgeste

  function isTimelineOverlayOpen() {
    const ev = document.getElementById('eventOverlay');
    const lb = document.getElementById('lightboxOverlay');
    return !!((ev && ev.classList.contains('active')) || (lb && lb.classList.contains('active')));
  }

  function resolveTimelineEntry(entry) {
    const clean = String(entry || '').trim().replace(/^\.?\/+/, '').replace(/\/+$/, '');
    if (!clean) return null;
    const isImage = /\.(jpg|jpeg|png|webp)$/i.test(clean);
    if (isImage) {
      const fileName = clean.split('/').pop();
      // ".../ORDNER/main.jpg" oder ".../ORDNER/3.jpg" zeigt auf ein Ordner-Event
      if (clean.includes('/') && /^(main|\d+)\.(jpg|jpeg|png|webp)$/i.test(fileName)) {
        return { type: 'folder', name: clean.slice(0, clean.lastIndexOf('/')) };
      }
      // einzelnes Bild, auch mit Kuenstler-Ordner davor: "1/31102026_Biel_Konzert_1.jpg"
      return { type: 'file', name: clean };
    }
    // Ordner-Event, z.B. "1/15082026_Bern_Serie_1"
    return { type: 'folder', name: clean };
  }

  // Baut ein Ordner-Event. Wartet nur auf das ERSTE Bild (+ info.txt); weitere Bilder
  // werden im Hintergrund gefunden und an item.images angehaengt.
  async function buildTimelineEvent(folder) {
    const infoPromise = loadFolderInfo(folder, '/timeline');
    const meta = parseFilenameToMetadata(folder);
    const images = [];
    let item = null;
    let eventTitle = '';
    let description = '';
    let hasExplicitTitle = false;

    const found = await new Promise((resolve) => {
      discoverImages(`/timeline/${folder}`, TIMELINE_IMAGE_EXTENSIONS, async (path, key) => {
        const info = await infoPromise;
        hasExplicitTitle = info.title !== folder.toUpperCase();
        eventTitle = hasExplicitTitle ? info.title : (meta.title || meta.location || meta.dateText);
        description = info.description || meta.description || '';

        const caption = info.captions[key];
        const idx = images.length;
        const fallbackTitle = idx === 0 ? eventTitle : `${eventTitle} — #${key}`;
        images.push({
          src: path,
          title: caption ? caption.title : fallbackTitle,
          description: (caption && caption.description) || description
        });

        if (idx === 0) resolve(true);
        else if (item && item.onImagesChanged) item.onImagesChanged();
      }).then(() => resolve(false));
    });

    if (!found) {
      console.warn(`Timeline-Ordner "${folder}" enthaelt keine Bilder (main.jpg, 1.jpg, ...)`);
      return null;
    }

    const info = await infoPromise;
    item = {
      src: images[0].src,
      dateText: meta.dateText,
      location: meta.location,
      title: eventTitle,
      artistCode: meta.artistCode,
      description,
      dateObj: meta.dateObj,
      isCollection: true,
      folder,
      eventTitle,
      images
    };
    return item;
  }

    heroImg.alt = heroData.title;

    hero.appendChild(heroFrame);

    const label = document.createElement('div');

    const strong = document.createElement('strong');

    if (item.artistCode) label.appendChild(document.createTextNode(' — ' + artistName(item.artistCode)));

    host.appendChild(hero);

    // Rechte Spalte: Beschreibung als Block ueber zwei Zeilen, danach die weiteren Bilder
    const grid = document.createElement('div');

      img.loading = 'lazy';
      frame.appendChild(img);
      frame.addEventListener('click', () => openLightbox(imgData.src, imgData.title, imgData.description, item.images, imgIdx + 1));
      card.appendChild(frame);
      grid.appendChild(card);

    host.appendChild(grid);

    scroller.scrollTop = 0;
