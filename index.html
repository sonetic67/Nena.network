<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NENA NETWORK – Gallery & Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0f0f0f;
            --text-color: #f0f0f0;
            --accent-red: #b80f0a; /* Rich Blood Red */
            --banner-bg: #0f0f0f;
            --banner-text: #ffffff;
            --divider-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 1. TOP BANNER (Visible on all views) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--banner-bg);
            color: var(--banner-text);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            border-bottom: 1.5px solid var(--divider-color);
        }

        header.scrolled-away {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .title-text {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--banner-text);
        }

        .title-text span {
            color: var(--accent-red);
        }

        /* 2. NAVIGATION CONTAINER */
        .nav-wrapper {
            position: fixed;
            top: 15px;
            right: 2rem;
            z-index: 1002;
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        .menu-hitbox {
            padding: 15px;
            margin: -15px;
            cursor: pointer;
        }

        .menu-toggle-btn {
            position: relative;
            width: 28px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-toggle-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--accent-red);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center;
        }

        body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn,
        body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn {
            width: 4px;
            height: 18px;
        }

        body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(1),
        body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(1),
        body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(3),
        body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(3) {
            opacity: 0;
            transform: scale(0);
        }

        body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
        body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
            width: 4px;
            height: 100%;
            border-radius: 0;
        }

        body.is-scrolled .menu-toggle-btn {
            width: 8px;
            height: 8px;
        }

        body.is-scrolled .menu-toggle-btn span {
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        body.is-scrolled .menu-toggle-btn span:nth-child(1),
        body.is-scrolled .menu-toggle-btn span:nth-child(3) {
            opacity: 0;
            transform: scale(0);
        }

        body.is-scrolled .menu-toggle-btn span:nth-child(2) {
            width: 8px;
            height: 8px;
        }

        body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
        body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
            height: 180px !important;
            width: 4px !important;
        }

        body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
        body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
            width: 4px !important;
            height: 100% !important;
            border-radius: 0 !important;
            background-color: var(--accent-red) !important;
        }

        /* 3. MENU POPUP */
        .banner-menu-popup {
            position: absolute;
            top: 0px;
            right: 0;
            background-color: var(--bg-color);
            padding: 1.5rem 2rem;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            z-index: 1003;
            box-shadow: none;
            border: 1px solid var(--accent-red);
        }

        body:not(.is-scrolled) .nav-wrapper:hover .banner-menu-popup,
        body:not(.is-scrolled) .nav-wrapper.near-mouse .banner-menu-popup {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .banner-menu-popup a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.2s, transform 0.2s;
            cursor: pointer;
        }

        .banner-menu-popup a:hover {
            color: var(--accent-red);
            transform: translateX(5px);
        }

        /* 4. FLYOUT MENU */
        .flyout-menu {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: right;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
            padding-right: 15px;
        }

        .flyout-menu a {
            color: #ffffff;
            mix-blend-mode: difference;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            cursor: pointer;
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu,
        body.is-scrolled .nav-wrapper.near-mouse .flyout-menu {
            pointer-events: auto;
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu a,
        body.is-scrolled .nav-wrapper.near-mouse .flyout-menu a {
            opacity: 1;
            transform: translateX(0);
        }

        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(1) { transition-delay: 0.05s; }
        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(2) { transition-delay: 0.10s; }
        body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(3) { transition-delay: 0.15s; }

        .flyout-menu a:hover {
            transform: translateX(-8px) !important;
        }

        /* VIEWS MANAGEMENT */
        .view-section {
            display: none;
            width: 100vw;
            min-height: 100vh;
        }

        .view-section.active-view {
            display: block;
        }

        /* --- GALLERY VIEW --- */
        .collection-wrapper {
            width: 100vw;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 2rem;
            padding: 80px 2rem 4rem 2rem;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .hero-item {
            position: sticky;
            top: 80px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .hero-item .image-wrapper {
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }

        /* Single row description below image with no line breaks */
        .single-line-label {
            margin-top: 6px;
            font-size: 0.65rem;
            color: #888;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .single-line-label strong {
            color: #ddd;
            font-weight: 600;
            text-transform: uppercase;
        }

        .grid-right {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-content: start;
        }

        .ratio-16-9 { aspect-ratio: 16 / 9; }
        .ratio-1-1  { aspect-ratio: 1 / 1; }

        .gallery-item {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .gallery-item.span-2 {
            grid-column: span 2;
        }

        .image-wrapper {
            width: 100%;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-wrapper:hover img {
            transform: scale(1.02);
        }

        /* --- TIMELINE VIEW --- */
        .timeline-view {
            display: none;
            padding: 80px 2rem 2rem 2rem;
            position: relative;
            width: 100vw;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        @media (min-width: 901px) {
            html:has(#timelineView.active-view) {
                scroll-snap-type: y mandatory;
            }
        }

        .timeline-mini-slider {
            position: fixed;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #111;
            padding: 4px;
            border: 1px solid var(--divider-color);
            z-index: 10;
        }

        .mini-thumb {
            width: 36px;
            height: 48px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.4;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .mini-thumb:hover {
            opacity: 0.8;
        }

        .mini-thumb.active {
            opacity: 1;
            border-color: var(--accent-red);
        }

        .timeline-stack {
            display: flex;
            flex-direction: column;
            gap: 2vh;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .timeline-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: calc(100vh - 100px);
            scroll-snap-align: center;
            position: relative;
        }

        .timeline-date-badge {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #666;
        }

        .timeline-item-container {
            display: flex;
            flex-direction: column;
            height: 82vh;
            max-height: 750px;
            aspect-ratio: 4 / 5;
            flex-shrink: 0;
            z-index: 2;
        }

        .timeline-item-wrapper {
            width: 100%;
            flex: 1;
            background: #1a1a1a;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .timeline-item-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- FULLSCREEN ZOOM OVERLAY LIGHTBOX --- */
        .overlay-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.98);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow: hidden;
        }

        .overlay-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .overlay-image-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .overlay-image-container img {
            max-height: 92vh;
            max-width: 90vw;
            object-fit: contain;
            cursor: grab;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        .overlay-close-btn {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 2002;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .overlay-close-btn .red-dot-btn {
            width: 18px;
            height: 18px;
            background-color: var(--accent-red);
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .overlay-close-btn:hover .red-dot-btn {
            transform: scale(1.3);
        }

        .lightbox-red-line-trigger {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 24px;
            height: 3px;
            background-color: var(--accent-red);
            cursor: pointer;
            z-index: 2005;
            transition: width 0.3s ease;
        }

        .lightbox-red-line-trigger:hover {
            width: 36px;
        }

        .overlay-description-drawer {
            position: absolute;
            bottom: 20px;
            right: 55px;
            background-color: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--accent-red);
            padding: 0.8rem 1.2rem;
            color: #ddd;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2004;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .overlay-description-drawer.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* BACK TO TOP BUTTON */
        .back-to-top-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 42px;
            height: 42px;
            background-color: rgba(15, 15, 15, 0.85);
            border: 1px solid var(--divider-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        .back-to-top-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--banner-text);
            transition: stroke 0.2s, transform 0.2s;
        }

        .back-to-top-btn:hover {
            border-color: var(--accent-red);
            background-color: var(--bg-color);
            transform: translateY(-2px);
        }

        .back-to-top-btn:hover svg {
            stroke: var(--accent-red);
            transform: translateY(-2px);
        }

        .back-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 900px) {
            .collection-wrapper {
                grid-template-columns: 1fr;
            }
            .hero-item {
                position: relative;
                top: 0;
                height: 70vh;
            }
            .timeline-view {
                padding-left: 1rem;
            }
            .timeline-mini-slider {
                display: none;
            }
            .timeline-stack {
                gap: 5vh;
            }
            .timeline-row {
                flex-direction: column;
                height: auto;
                min-height: auto;
                scroll-snap-align: none;
            }
            .timeline-item-container {
                width: 100%;
                height: auto;
                aspect-ratio: 9 / 16;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header Banner (Visible on all views) -->
    <header id="mainHeader">
        <span class="title-text" onclick="switchView('gallery')"><span>NENA</span>NETWORK</span>
    </header>

    <!-- Navigation Area -->
    <div class="nav-wrapper" id="navWrapper">
        <div class="menu-hitbox">
            <div class="menu-toggle-btn" id="menuToggleBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Popup Menu -->
        <nav class="banner-menu-popup">
            <a onclick="switchView('gallery')">Spotlight</a>
            <a onclick="switchView('timeline')">Timeline</a>
            <a href="#">Info</a>
        </nav>

        <!-- Scrolled Flyout Menu -->
        <nav class="flyout-menu">
            <a onclick="switchView('gallery')">Spotlight</a>
            <a onclick="switchView('timeline')">Timeline</a>
            <a href="#">Info</a>
        </nav>
    </div>

    <!-- MAIN VIEW 1: GALLERY / SPOTLIGHT -->
    <main id="galleryView" class="view-section active-view">
        
        <!-- COLLECTION 1 -->
        <div class="collection-wrapper" id="col-1">
            <div class="hero-item">
                <div class="image-wrapper" onclick="openLightbox('https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1600&q=80', 'september studies', 'dara 2026 zurich')">
                    <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1000&q=80" alt="Collection 1 Hero">
                </div>
                <div class="single-line-label">
                    <strong>september studies</strong> — dara 2026 zurich
                </div>
            </div>

            <div class="grid-right">
                <div class="gallery-item span-2">
                    <div class="image-wrapper ratio-16-9" onclick="openLightbox('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80', 'horizon study', 'greece 2026')">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="Horizon Study">
                    </div>
                </div>
                <div class="gallery-item">
                    <div class="image-wrapper ratio-1-1" onclick="openLightbox('https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=1600&q=80', 'fragment a', 'paris 2026')">
                        <img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=800&q=80" alt="Fragment A">
                    </div>
                </div>
                <div class="gallery-item">
                    <div class="image-wrapper ratio-1-1" onclick="openLightbox('https://images.unsplash.com/photo-1582561304007-0f089fc14d84?auto=format&fit=crop&w=1600&q=80', 'structure ii', 'berlin 2026')">
                        <img src="https://images.unsplash.com/photo-1582561304007-0f089fc14d84?auto=format&fit=crop&w=800&q=80" alt="Structure II">
                    </div>
                </div>
                <div class="gallery-item span-2">
                    <div class="image-wrapper ratio-16-9" onclick="openLightbox('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1600&q=80', 'minimal space', 'vienna 2026')">
                        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80" alt="Extra View A">
                    </div>
                </div>
                <div class="gallery-item">
                    <div class="image-wrapper ratio-1-1" onclick="openLightbox('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80', 'nature study', 'munich 2026')">
                        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="Extra View B">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- MAIN VIEW 2: TIMELINE TAB -->
    <main id="timelineView" class="view-section timeline-view">
        
        <!-- Mini stuck-together thumbnail slider track -->
        <div class="timeline-mini-slider" id="miniSlider">
            <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=200&q=80" class="mini-thumb active" onclick="scrollToRow(0)" alt="thumb 1">
            <img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=200&q=80" class="mini-thumb" onclick="scrollToRow(1)" alt="thumb 2">
            <img src="https://images.unsplash.com/photo-1582561304007-0f089fc14d84?auto=format&fit=crop&w=200&q=80" class="mini-thumb" onclick="scrollToRow(2)" alt="thumb 3">
        </div>

        <div class="timeline-stack" id="timelineStack">
            
            <div class="timeline-row" id="t-row-0">
                <div class="timeline-date-badge">September 2026</div>
                <div class="timeline-item-container">
                    <div class="timeline-item-wrapper" onclick="openLightbox('https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1600&q=80', 'vertical monolith i', 'september 22, 2026 — zurich studio b')">
                        <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1000&q=80" alt="Timeline 1">
                    </div>
                </div>
            </div>

            <div class="timeline-row" id="t-row-1">
                <div class="timeline-date-badge">October 2026</div>
                <div class="timeline-item-container">
                    <div class="timeline-item-wrapper" onclick="openLightbox('https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=1600&q=80', 'square geometry', 'october 04, 2026 — basel gallery 4')">
                        <img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=1000&q=80" alt="Timeline 2">
                    </div>
                </div>
            </div>

            <div class="timeline-row" id="t-row-2">
                <div class="timeline-date-badge">November 2025</div>
                <div class="timeline-item-container">
                    <div class="timeline-item-wrapper" onclick="openLightbox('https://images.unsplash.com/photo-1582561304007-0f089fc14d84?auto=format&fit=crop&w=1600&q=80', 'concrete echo', 'november 12, 2025 — geneva sector 9')">
                        <img src="https://images.unsplash.com/photo-1582561304007-0f089fc14d84?auto=format&fit=crop&w=1000&q=80" alt="Timeline 3">
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FULLSCREEN ZOOM OVERLAY LIGHTBOX -->
    <div class="overlay-backdrop" id="lightboxOverlay">
        <div class="overlay-close-btn" onclick="closeLightbox()" title="Close">
            <div class="red-dot-btn"></div>
        </div>

        <div class="overlay-image-container" id="overlayContainer">
            <img id="overlayImage" src="" alt="Zoomable Picture">
            <div class="lightbox-red-line-trigger" onclick="toggleOverlayDrawer()" title="View Info"></div>
            
            <div class="overlay-description-drawer" id="overlayDrawer">
                <span id="drawerSingleLine"></span>
            </div>
        </div>
    </div>

    <!-- BACK TO TOP BUTTON -->
    <button class="back-to-top-btn" id="backToTopBtn" onclick="scrollToTop()" aria-label="Scroll to top">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script>
        const mainHeader = document.getElementById('mainHeader');
        const navWrapper = document.getElementById('navWrapper');
        const backToTopBtn = document.getElementById('backToTopBtn');
        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const overlayImage = document.getElementById('overlayImage');
        const overlayContainer = document.getElementById('overlayContainer');
        const overlayDrawer = document.getElementById('overlayDrawer');
        const drawerSingleLine = document.getElementById('drawerSingleLine');

        let lastScrollY = window.scrollY;

        const updateHeaderAndNavState = (scrollTop) => {
            if (scrollTop > 20) {
                document.body.classList.add('is-scrolled');
                mainHeader.classList.add('scrolled-away');
            } else {
                mainHeader.classList.remove('scrolled-away');
                document.body.classList.remove('is-scrolled');
            }

            const isScrollingUp = scrollTop < lastScrollY;
            const scrollThreshold = 250;

            if (isScrollingUp && scrollTop > scrollThreshold) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }

            lastScrollY = scrollTop;
        };

        window.addEventListener('scroll', () => updateHeaderAndNavState(window.scrollY));

        document.addEventListener('mousemove', (e) => {
            const rect = navWrapper.getBoundingClientRect();
            const distance = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
            
            if (distance < 90) {
                navWrapper.classList.add('near-mouse');
            } else {
                navWrapper.classList.remove('near-mouse');
            }
        });

        function switchView(viewName) {
            document.getElementById('galleryView').classList.remove('active-view');
            document.getElementById('timelineView').classList.remove('active-view');

            if (viewName === 'gallery') {
                document.getElementById('galleryView').classList.add('active-view');
            } else if (viewName === 'timeline') {
                document.getElementById('timelineView').classList.add('active-view');
            }
            scrollToTop();
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* --- SMOOTH SCROLL-INTO-PICTURE ZOOM --- */
        let currentZoomScale = 1;

        function openLightbox(imageSrc, title, description) {
            overlayImage.src = imageSrc;
            currentZoomScale = 1;
            overlayImage.style.transform = `scale(1)`;
            drawerSingleLine.innerHTML = `<strong>${title}</strong> — ${description}`;
            overlayDrawer.classList.remove('open');
            lightboxOverlay.classList.add('active');
        }

        function closeLightbox() {
            lightboxOverlay.classList.remove('active');
        }

        /* Mouse Wheel Scroll-Zoom Handler */
        overlayContainer.addEventListener('wheel', (e) => {
            if (!lightboxOverlay.classList.contains('active')) return;
            e.preventDefault();

            const zoomSpeed = 0.1;
            if (e.deltaY < 0) {
                currentZoomScale = Math.min(currentZoomScale + zoomSpeed, 4); // Zoom In
            } else {
                currentZoomScale = Math.max(currentZoomScale - zoomSpeed, 1); // Zoom Out
            }

            overlayImage.style.transform = `scale(${currentZoomScale})`;
        }, { passive: false });

        function toggleOverlayDrawer() {
            overlayDrawer.classList.toggle('open');
        }

        const rows = document.querySelectorAll('.timeline-row');
        const miniThumbs = document.querySelectorAll('.mini-thumb');

        function scrollToRow(index) {
            rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        window.addEventListener('scroll', () => {
            if (!document.getElementById('timelineView').classList.contains('active-view')) return;

            let closestIndex = 0;
            let minDistance = Infinity;

            rows.forEach((row, index) => {
                const rect = row.getBoundingClientRect();
                const distance = Math.abs(rect.top - window.innerHeight / 2);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });

            miniThumbs.forEach((thumb, idx) => {
                thumb.classList.toggle('active', idx === closestIndex);
            });
        });
    </script>
</body>
</html>
