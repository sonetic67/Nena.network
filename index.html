  function closeEventOverlay() {
    const overlay = document.getElementById('eventOverlay');
    if (!overlay) return;
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
  }

  // Esc schliesst zuerst die Lightbox, danach die Event-Ansicht
  document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightboxOverlay');
    const lbOpen = lb && lb.classList.contains('active');

    if (lbOpen && (e.key === 'ArrowUp' || e.key === 'ArrowLeft')) { e.preventDefault(); stepLightbox(-1); return; }
    if (lbOpen && (e.key === 'ArrowDown' || e.key === 'ArrowRight')) { e.preventDefault(); stepLightbox(1); return; }

    if (e.key !== 'Escape') return;
    if (lbOpen) {
      closeLightbox();
    } else {
      closeEventOverlay();
    }
  });

  let timelineAllItems = [];

  // timeline/broll.json: { "28102026_wanderweg im herbstwald_1.jpg": ["28102026_wanderweg im herbstwald_1/b1_28102026_skizze.jpg", ...] }
  async function loadBrollMap() {
    try {
      const res = await fetch('/timeline/broll.json', { cache: 'no-cache' });
      const type = res.headers.get('content-type') || '';
      if (!res.ok || type.includes('text/html')) return {};
      const data = await res.json();
      return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
    } catch (e) {
      return {};
    }
  }

  // "b1_28102026_skizze.jpg" -> Titel "Skizze", Datum "28. Oktober 2026"; sortiert nach der Nummer hinter "b"
  function brollEntries(paths) {
    if (!Array.isArray(paths)) return [];
    const num = (p) => parseInt((String(p).split('/').pop().match(/^b(\d+)/i) || [0, 0])[1], 10);
    return paths.slice().sort((a, b) => num(a) - num(b)).map((p) => {
      const file = String(p).split('/').pop().replace(/^b\d+[_-]?/i, '');
      const meta = parseFilenameToMetadata(file);
      return {
        num: num(p),
        path: String(p).replace(/^\.?\/+/, '').replace(/^timeline\//, ''),
        src: '/timeline/' + String(p).replace(/^\.?\/+/, '').replace(/^timeline\//, ''),
        title: meta.title || meta.location || meta.dateText || 'B-Roll',
        description: [meta.location && meta.title ? meta.location : '', meta.dateText].filter(Boolean).join(' · ')
      };
    });
  }

  // B-Roll-Ordner mit optionaler info.txt (wie bei den Collections, aber ohne Haupt-Beschreibung):
  //   title: Skizzen im Café                  -> grosser Titel ganz oben (nicht rot)
  //   1: dc erste skizze — kugelschreiber      -> Text zu b1 ("dc" = Bild ueber die ganze Breite)
  //   desc: an diesem tag ...                  -> Textblock an genau dieser Stelle (nach dem zuletzt genannten Bild)
  //   2: zweite skizze
  async function loadBrollSet(paths) {
    const images = brollEntries(paths);
    if (!images.length) return null;
    const set = { title: '', images, blocks: [] };
    const texts = []; // { after, text }

    const folder = images[0].path.slice(0, images[0].path.lastIndexOf('/'));
    try {
      const res = await fetch(`/timeline/${folder}/info.txt`);
      const type = res.headers.get('content-type') || '';
      if (res.ok && !type.includes('text/html')) {
        let last = 0;
        let lastText = null;
        (await res.text()).split('\n').forEach((line) => {
          const tl = line.trim();
          if (!tl) { lastText = null; return; }
          let m;
          if ((m = tl.match(/^title\s*:\s*(.*)$/i))) {
            set.title = m[1].trim();
            lastText = null;
          } else if ((m = tl.match(/^(?:desc|description|text)\s*:\s*(.*)$/i))) {
            lastText = { after: last, text: m[1].trim() };
            texts.push(lastText);
          } else if ((m = tl.match(/^b?(\d+)\s*:\s*(.*)$/i))) {
            const n = parseInt(m[1], 10);
            last = n;
            lastText = null;
            const img = images.find((im) => im.num === n);
            if (!img) return;
            let raw = m[2].trim();
            if (/^dc(\s+|$)/i.test(raw)) { img.wide = true; raw = raw.replace(/^dc\s*/i, '').trim(); }
            if (!raw) return;
            const sep = [' — ', ' - ', '|'].find((sp) => raw.includes(sp));
            if (sep) {
              const parts = raw.split(sep);
              img.title = parts[0].trim();
              img.description = parts.slice(1).join(sep).trim();
            } else {
              img.title = raw;
            }
          } else if (lastText) {
            lastText.text += '\n' + tl; // weitere Zeilen gehoeren zum Text darueber
          }
        });
      }
    } catch (e) {
      // keine info.txt: Titel/Datum kommen aus den Dateinamen
    }

    texts.filter((tx) => tx.after === 0).forEach((tx) => set.blocks.push({ type: 'text', text: tx.text }));
    images.forEach((img) => {
      set.blocks.push({ type: 'img', ...img });
      texts.filter((tx) => tx.after === img.num).forEach((tx) => set.blocks.push({ type: 'text', text: tx.text }));
    });
    // Texte nach einer Nummer, die es als Bild nicht gibt: ans Ende
    const placed = new Set([0, ...images.map((im) => im.num)]);
    texts.filter((tx) => !placed.has(tx.after)).forEach((tx) => set.blocks.push({ type: 'text', text: tx.text }));
    return set;
  }

  async function loadTimelineAutomatically() {
    try {
      const response = await fetch('/timeline/timeline.json');
      if (!response.ok) return;
      const candidateFiles = await response.json();
      await artistsReady;
      const brollMap = await loadBrollMap();

      // B-Roll-Dateien ("ORDNER/b1_....jpg") sind nie eigene Timeline-Eintraege. Steht so eine Datei
      // in timeline.json (z.B. vom alten Workflow) und fehlt broll.json, wird sie hier dem Bild
      // mit gleichem Namen zugeordnet - der B-Roll-Knopf funktioniert dann trotzdem.
      const isBrollPath = (e) => /(^|\/)b\d+[_-][^\/]*\.(jpg|jpeg|png|webp)$/i.test(String(e).trim());
      candidateFiles.filter(isBrollPath).forEach((e) => {
        const path = String(e).trim().replace(/^\.?\/+/, '');
        const folder = path.slice(0, path.lastIndexOf('/'));
        const owner = candidateFiles.map((c) => String(c).trim())
          .find((c) => !isBrollPath(c) && (c === folder || c.replace(/\.(jpg|jpeg|png|webp)$/i, '') === folder));
        if (!owner) return;
        if (!brollMap[owner]) brollMap[owner] = [];
        if (!brollMap[owner].includes(path)) brollMap[owner].push(path);
      });
      const timelineEntries = candidateFiles.filter((e) => !isBrollPath(e));

      // Eintraege sind Bilddateien ODER Ordner (siehe Kommentar oben); doppelte Eintraege werden ignoriert.
      // Einzelne Dateien sind sofort bereit, Ordner warten nur auf ihr erstes Bild.
      const seen = new Set();
      const built = await Promise.all(timelineEntries.map(async (entry) => {
        const resolved = resolveTimelineEntry(entry);
        if (!resolved) return null;
        const key = resolved.type + ':' + resolved.name;
        if (seen.has(key)) return null;
        seen.add(key);

        // B-Roll: gleichnamiger Ordner ohne Endung (steht in timeline/broll.json, erzeugt vom GitHub-Workflow)
        const broll = await loadBrollSet(brollMap[String(entry).trim()] || brollMap[resolved.name] || []);

        if (resolved.type === 'file') {
          const meta = parseFilenameToMetadata(resolved.name);
          return { src: `/timeline/${resolved.name}`, ...meta, broll };
        }
        const ev = await buildTimelineEvent(resolved.name);
        if (ev && broll) { ev.broll = broll; ev.images[0].broll = broll; }
        return ev;
      }));

      timelineAllItems = built.filter(Boolean);
      timelineAllItems.sort((a, b) => b.dateObj - a.dateObj);
      renderTimeline();
      scheduleArtistRender();
    } catch (error) {
      console.error("Fehler beim Laden der Timeline:", error);
    }
  }

  // Baut die Timeline aus timelineAllItems neu auf (auch beim Wechsel des Kuenstler-Filters)
  function renderTimeline() {
    const timelineStack = document.getElementById('timelineStack');
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const zeitstrahlTicks = document.getElementById('zeitstrahlTicks');
    const wheelTrack = document.getElementById('mobileDateTrack');

    if (!timelineStack) return;

    timelineStack.innerHTML = '';
    if (miniSliderTrack) miniSliderTrack.innerHTML = '';
    zeitstrahlTicks.innerHTML = '';
    if (wheelTrack) wheelTrack.innerHTML = '';

    // Bilder der alten (entfernten) Zeilen nicht mehr laden
    ImageLoader.queue = ImageLoader.queue.filter((t) => t.group !== 'timeline' || t.img.isConnected);

    timelineItemsGlobal = timelineAllItems.filter((it) => artistFilter === null || it.artistCode === artistFilter);
    currentTimelineIndex = 0;
    targetTimelineIndex = 0;

    if (timelineItemsGlobal.length === 0) {
      if (timelineAllItems.length > 0) {
        const empty = document.createElement('div');
        empty.className = 'timeline-empty';
        empty.textContent = t('noEntries');
        timelineStack.appendChild(empty);
      }
      timelineStack.style.transform = 'translateX(-50%) translateY(0px)';
      return;
    }

    const timelineIsActive = () => document.getElementById('timelineView').classList.contains('active-view');
    // Prioritaet: aktives Bild zuerst, dann die Nachbarn (naechstes vor vorherigem), dann der Rest
    const timelinePriority = (idx) => () => {
      const d = idx >= currentTimelineIndex ? idx - currentTimelineIndex : (currentTimelineIndex - idx) + 0.5;
      return (timelineIsActive() ? 0 : 1e6) + d;
    };

    {
      timelineItemsGlobal.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'timeline-row' + (idx === 0 ? ' active-center' : '');
        row.id = `t-row-${idx}`;
        // Klick auf die gesamte aktive Zeile öffnet direkt die Lightbox des aktuellen Eintrags
        row.onclick = () => {
          if (performance.now() < timelineSuppressClickUntil) return; // Klick direkt nach einer Wischgeste ignorieren
          if (idx === currentTimelineIndex) {
            openCurrentTimelineLightbox();
          } else {
            scrollToRow(idx);
          }
        };

        // Ueberschrift ueber dem Bild: Werktitel links (fett), Kuenstler rechts
        const caption = document.createElement('div');
        caption.className = 'timeline-caption';

        const left = document.createElement('div');
        left.className = 'tl-left';
        const titleEl = document.createElement('span');
        titleEl.className = 'tl-title';
        titleEl.textContent = item.title || item.location || item.dateText;
        left.appendChild(titleEl);
        caption.appendChild(left);

        const artistEl = document.createElement('span');
        artistEl.className = 'tl-artist';
        artistEl.textContent = artistName(item.artistCode);
        caption.appendChild(artistEl);

        // Ordner-Event mit weiteren Bildern: kleiner Hinweis "+N" (waechst mit, waehrend weitere Bilder gefunden werden)
        const refreshTag = () => {
          if (!item.isCollection || item.images.length <= 1) return;
          let tag = left.querySelector('.timeline-multi-tag');
          if (!tag) {
            tag = document.createElement('span');
            tag.className = 'timeline-multi-tag';
            left.appendChild(tag);
          }
          tag.textContent = `+${item.images.length - 1}`;
        };
        refreshTag();
        item.onImagesChanged = refreshTag;

        // B-Roll-Symbol auch in der normalen Timeline-Ansicht (etwas blasser); Klick oeffnet Bild + B-Roll-Liste
        if (item.broll && item.broll.images && item.broll.images.length) {
          caption.insertBefore(createBrollBadge(item.broll.images.length, () => {
            if (idx !== currentTimelineIndex) { scrollToRow(idx); return; }
            openTimelineItemWithBroll(item);
          }), artistEl);
        }

        const container = document.createElement('div');
        container.className = 'timeline-item-container';

        const wrapper = document.createElement('div');
        wrapper.className = 'timeline-item-wrapper';

        const figure = document.createElement('div');
        figure.className = 'timeline-figure';
        figure.appendChild(caption);

        const img = document.createElement('img');
        img.alt = item.title || item.location || item.dateText;
        figure.appendChild(img);
        wrapper.appendChild(figure);

        container.appendChild(wrapper);
        row.appendChild(container);
        timelineStack.appendChild(row);

        const thumb = document.createElement('img');
        thumb.className = 'mini-thumb' + (idx === 0 ? ' active' : '');
        thumb.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        if (miniSliderTrack) miniSliderTrack.appendChild(thumb);

        // Die kleine Vorschau nutzt dasselbe Bild erst, wenn es geladen ist (kommt aus dem Cache, kein Extra-Download)
        img.addEventListener('load', () => { thumb.src = item.src; }, { once: true });

        // Das Spotlight-Bild (aktuell aktiv) laedt zuerst, die anderen schrittweise danach
        ImageLoader.add(img, item.src, timelinePriority(idx), idx === 0 && timelineIsActive(), 'timeline');

        const tick = document.createElement('span');
        tick.className = 'zeitstrahl-tick' + (idx === 0 ? ' active' : '');
        tick.textContent = item.dateText;
        tick.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        zeitstrahlTicks.appendChild(tick);

        if (wheelTrack) {
          const wheelItem = document.createElement('div');
          wheelItem.className = 'date-wheel-item' + (idx === 0 ? ' active' : '');
          wheelItem.textContent = item.dateText;
          wheelTrack.appendChild(wheelItem);
        }
      });

      updateTimelineWheel(0);
      pokeTimelineDates();
    }
  }

  // Initialer Aufruf beider Lade-Funktionen
  loadCollectionsAutomatically();
  loadTimelineAutomatically();
  // Saubere Touch-Swipe-Steuerung für die Timeline auf Mobilgeräten
let touchStartY = 0;
let touchEndY = 0;
let touchMoved = false;
const timelineViewEl = document.getElementById('timelineView');

if (timelineViewEl) {
    timelineViewEl.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        // FIX: Endwert zuruecksetzen. Vorher blieb der Wert der letzten Geste stehen (anfangs 0),
        // dadurch wurde ein einfaches Antippen manchmal als Wischen gewertet und oeffnete nichts.
        touchEndY = touchStartY;
        touchMoved = false;
    }, { passive: true });

    timelineViewEl.addEventListener('touchmove', (e) => {
        touchEndY = e.touches[0].clientY;
        touchMoved = true;
    }, { passive: true });

    timelineViewEl.addEventListener('touchend', () => {
        if (!timelineViewEl.classList.contains('active-view')) return;
        
        let diffY = touchStartY - touchEndY;

        // Nur wenn der Finger wirklich bewegt wurde und die Wischbewegung größer als 30 Pixel ist
        if (touchMoved && Math.abs(diffY) > 30) {
            timelineSuppressClickUntil = performance.now() + 400; // der folgende Klick gehoert zur Geste
            if (diffY > 0) {
                // Nach oben wischen -> Nächstes Bild
                targetTimelineIndex = Math.min(targetTimelineIndex + 1, timelineItemsGlobal.length - 1);
            } else {
                // Nach unten wischen -> Vorheriges Bild
                targetTimelineIndex = Math.max(targetTimelineIndex - 1, 0);
            }
            updateTimelineWheel(targetTimelineIndex);
        }
    }, { passive: true });
}
