    /* --- CUSTOM TRANSPARENT AUTO-HIDING SCROLLBAR --- */
    ::-webkit-scrollbar {
        width: 6px;
    }

    /* Fully transparent track background */
    ::-webkit-scrollbar-track {
        background: transparent;
    }

    /* Removes top and bottom arrow/triangle buttons */
    ::-webkit-scrollbar-button {
        display: none;
        height: 0;
        width: 0;
    }

    /* The draggable scrollbar thumb */
    ::-webkit-scrollbar-thumb {
        background-color: var(--divider-color);
        border-radius: 3px;
        opacity: 0; /* Hidden by default */
        transition: opacity 0.4s ease;
    }

    /* When scrolling, make the scrollbar thumb visible */
    body.is-user-scrolling::-webkit-scrollbar-thumb {
        opacity: 1;
    }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* No blue tap flash / selection highlight on touch devices */
        html, body, * {
            -webkit-tap-highlight-color: transparent;
        }

        img,
        .image-wrapper,
        .timeline-item-wrapper,
        .mini-thumb,
        .overlay-backdrop,
        .overlay-backdrop *,
        .event-overlay,
        .event-overlay .event-close-btn {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        img::selection,
        .overlay-backdrop *::selection {
            background: transparent;
        }

        img {
            -webkit-user-drag: none;

/* Default Light Theme */
:root {
    --bg-color: #f8f9fa;
    --text-color: #121212;
    --accent-red: #990f02;
    --banner-bg: #f8f9fa;
    --banner-text: #121212;
    --divider-color: #e0e0e0;
    --subtext-color: #888888; /* Softer, lighter grey for light mode */
}

/* Automatic Dark Theme based on OS / Browser Preference */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #0f0f0f;
        --text-color: #f0f0f0;
        --accent-red: #990f02;
        --banner-bg: #0f0f0f;
        --banner-text: #ffffff;
        --divider-color: #333333;
        --subtext-color: #888888; /* Balanced soft grey for dark mode */
    }
}

/* Timeline Ticks Styling */
.zeitstrahl-tick {
    font-size: 0.65rem;
    color: var(--subtext-color); /* Uses the soft grey */
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s, transform 0.3s, opacity 0.3s;
    opacity: 0.5; /* Slightly increased visibility for the soft grey */
    white-space: nowrap;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    transform-origin: right center;
}

/* Active and Hovered Ticks turn RED */
.zeitstrahl-tick.active, 
.zeitstrahl-tick:hover {
    color: var(--accent-red) !important; /* Forces active & hovered state to red */
    font-weight: 700;
    opacity: 1;
    transform: scale(1.15);
}
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    /* 1. TOP BANNER */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: transparent;
        color: var(--banner-text);
        display: flex;
        align-items: center;
        padding: 0 2rem;
        z-index: 1000;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    header.scrolled-away {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
    }

    .title-text {
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--banner-text);
    }

    .title-text span {
        color: var(--accent-red);
    }

    /* 2. NAVIGATION CONTAINER */
    /* One source of truth for the menu point so it sits in the exact same spot in every state
       (closed, scrolled, fullscreen menu open). */
    :root {
        --nav-dot: 18px;
        --nav-dot-right: 2rem;
    }

    .nav-wrapper {
        position: fixed;
        top: 0;
        right: var(--nav-dot-right); /* Matches your header padding */
        height: 60px; /* Matches the header height */
        z-index: 1002;
        display: flex;
        align-items: center; /* Centers the point vertically with the header contents */
        pointer-events: auto;
    }

    .menu-hitbox {
        padding: 15px;
        margin: -15px;
        cursor: pointer;
        touch-action: manipulation;
    }

    .menu-toggle-btn {
        position: relative;
        width: 28px;
        height: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-toggle-btn span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: var(--accent-red);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: center;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px;
        height: 18px;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(3),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 4px;
        height: 100%;
        border-radius: 0;
    }

    body.is-scrolled .menu-toggle-btn {
        width: 18px;
        height: 18px;
    }

    body.is-scrolled .menu-toggle-btn span {
        background-color: var(--accent-red);
        border-radius: 50%;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(1),
    body.is-scrolled .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
        display: none;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(2) {
        width: 18px !important; /* Matched to 18px */
        height: 18px !important; /* Matched to 18px */
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* REMOVE OR REPLACE THESE TWO BLOCKS WHICH CAUSED THE LINE MORPH ON SCROLL */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        height: 8px !important;
        width: 8px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* 3. MENU POPUP (Top State - Single-line horizontal flyout) */
    .banner-menu-popup {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        background-color: transparent;
        padding: 0;
        min-width: auto;
        display: flex;
        flex-direction: row; /* Arranges items in a single line */
        gap: 1.5rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        z-index: 1003;
        box-shadow: none;
        border: none; /* Removes background box & red border */
        white-space: nowrap;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .banner-menu-popup,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .banner-menu-popup {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(-10px); /* Slides horizontally into position */
    }

    .banner-menu-popup a {
        color: var(--banner-text);
        text-decoration: none;
        font-size: 0.95rem; /* Matches .title-text font size */
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: color 0.2s, transform 0.2s;
        cursor: pointer;
    }

    .banner-menu-popup a:hover {
        color: var(--accent-red);
        transform: translateY(-2px); /* Subtle hover lift */
    }

    /* 4. FLYOUT MENU */
    .flyout-menu {
        position: absolute;
        right: 0rem;
        font-size: 1.9rem;
        line-height: 1.2;
        top: 100%;
        transform: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        text-align: right;
        pointer-events: none;
        z-index: 1000;
        overflow: visible;
        padding-right: 15px;
    }

    .flyout-menu a {
        /* Text is painted by a two-color gradient: red on the right half, menu color on the left.
           Sliding the gradient (background-position) wipes the text from red to the menu color. */
        color: transparent;
        /* 300% wide: the visible window is the left third (pure menu color) at the end and the
           right third (pure red) at the start, so no red tint is left at the end of the wipe */
        background-image: linear-gradient(90deg, var(--banner-text) 0%, var(--banner-text) 46%, var(--accent-red) 54%, var(--accent-red) 100%);
        background-size: 300% 100%;
        background-position: 100% 0; /* fully red */
        -webkit-background-clip: text;
        background-clip: text;
        text-decoration: none;
        font-size: 1em; /* sized by .flyout-menu */
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, background-position 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    /* Hide the red dot on hover/near-mouse when scrolled, making space for the text */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px !important;
        height: 18px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0 !important;
        transform: scale(0) !important;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu {
        pointer-events: auto;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu a {
        opacity: 1;
        transform: translateX(0);
        background-position: 0 0; /* wipes from red to the menu color, left to right */
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(1) { transition-delay: 0.05s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(2) { transition-delay: 0.10s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(3) { transition-delay: 0.15s; }

    .flyout-menu a:hover {
        transform: translateX(-8px) !important;
    }

    /* VIEWS MANAGEMENT */
    .view-section {
        display: none;
        width: 100vw;
        min-height: 100vh;
    }

    .view-section.active-view {
        display: block;
    }

    /* --- GALLERY / Galerie VIEW --- */
    #galleryView {
        padding-bottom: 2rem;
    }

    .collection-wrapper {
        width: 100vw;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 2rem;
        padding: 60px 2rem 2rem 2rem;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .hero-item {
        position: sticky;
        top: 80px;
        height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
    }

    .hero-item .image-wrapper {
        flex: 1;
        width: 100%;
        overflow: hidden;
        background: transparent; /* Removes the grey/dark background box */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .single-line-label {
        margin-top: 6px;
        font-size: 0.65rem;
        color: #888;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .single-line-label strong {
        color: #ddd;
        font-weight: 600;
        text-transform: uppercase;
    }

    .grid-right {
        columns: 2;
        column-gap: 20px;
    }

    .gallery-item {
        break-inside: avoid;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .image-wrapper {
        width: 100%;
        overflow: hidden;
        background: #1a1a1a;
        cursor: pointer;
        position: relative;
    }

    .image-wrapper img {
        width: 100%;
        height: auto; /* Crucial: maintains original aspect ratio perfectly without cropping */
        display: block;
        object-fit: unset;
    }

    /* --- TIMELINE VIEW (Uhren-Mechanik / Walze) --- */
    .timeline-view {
        display: none;
        height: 100vh;
        overflow: hidden;
        position: relative;
        width: 100vw;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .timeline-view.active-view {
        display: block;
    }

    /* Mini-Thumbnail-Leiste als synchrone Walze */
    .timeline-mini-slider {
        position: fixed;
        left: 2rem;
        top: 50%;
        transform: translateY(-50%);
        max-height: 80vh; /* Allows it to grow based on content */
        overflow: hidden;  /* Hides scrollbars while staying functional */
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: transparent;
        padding: 4px;
        border: none;
        z-index: 20;
        pointer-events: auto;
    }

    /* Der innere Container, der sich analog mitbewegt */
    .mini-slider-track {
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mini-thumb {
        width: 36px;
        height: 48px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.6;
        border: none;
        transition: all 0.3s ease;
    }

    .mini-thumb:hover {
        opacity: 0.7;
    }

    .mini-thumb.active {
        opacity: 1;
        border: 1px solid var(--accent-red); /* Dezenter roter Rahmen für das aktive Mini-Bild */
    }

    /* Zeitstrahl-Track */
    .zeitstrahl-track {
        position: relative;
        width: 1px;
        height: 100%;
        background-color: #333;
    }
    /* .zeitstrahl-dot wurde entfernt, damit ist der Punkt weg */

    /* Rechter Zeitstrahl-Navigationsbereich */
.zeitstrahl-nav {
    position: fixed;
    right: 2.5rem; /* Etwas mehr Abstand zum rechten Bildschirmrand */
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.zeitstrahl-ticks-viewport {
    height: 250px;

}

/* Wichtig: Klasse heißt .zeitstrahl-ticks-track wie im HTML */
.zeitstrahl-ticks-track {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 38px; /* Größerer Abstand zwischen den Daten */
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);

}

    /* Der Walzen-Stapel in der Bildschirmmitte */
    .timeline-stack {
        position: relative;
        top: 0%;
        left: 50%;
        transform: translate(-50%);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none; /* Verhindert Fehlklicks auf unsichtbare Bereiche */
    }

    .timeline-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh; /* Forces each row to take up full screen height */
        flex-shrink: 0;
        pointer-events: auto; /* Re-enables clicking on the rows and cards */
    }

    .timeline-item-container {
        display: flex;
        flex-direction: column;
        height: auto;
        max-height: 880px;
        aspect-ratio: 4 / 5;
        background: transparent;
        box-shadow: none;
    }

    .timeline-item-wrapper {
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .timeline-item-wrapper img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 85vh;
        object-fit: contain; /* Crucial: ensures the entire original image fits without cropping */
        display: block;
    }

        border: transparent;
        max-width: 760px;
    }

    .contact-box h3 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-color);

    }

        background-color: var(--bg-color);

        outline: none;

    }

    .styled-contact-form input:focus,
    .styled-contact-form textarea:focus {
        border-color: var(--accent-red);
    }

    .contact-submit-btn {
        align-self: flex-start;
        padding: 0.8rem 2rem;
        background-color: var(--accent-red);
        color: #ffffff;
        border: none;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .contact-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    /* --- FULLSCREEN ZOOM OVERLAY LIGHTBOX --- */
    .overlay-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        overflow: hidden;
        cursor: pointer;
    }

    .overlay-backdrop.active {
        opacity: 1;
        visibility: visible;
    }

    .overlay-image-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: default;
        padding: 4rem 2rem;
    }

    /* Mobile: symmetrical padding so the picture sits exactly in the middle */
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
        .overlay-image-container {
            padding: 4.5rem 0.75rem;
        }
    }

    .overlay-image-container img {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
    flex: 0 1 auto;
    object-fit: contain;
    cursor: grab;
    transform-origin: center center;
    transition: none;
    touch-action: none;
    user-select: none;

    let scrollTimeout;

    window.addEventListener('scroll', () => {
        // Add class to show the scrollbar
        document.body.classList.add('is-user-scrolling');

        // Clear previous timer
        clearTimeout(scrollTimeout);

        // Set a timer to hide it after 1 second (1000ms) of inactivity
        scrollTimeout = setTimeout(() => {
            document.body.classList.remove('is-user-scrolling');
        }, 1000);
    }, { passive: true });

<script>
  // ==========================================
  // SCHNELLES LADEN
  // 1) Existenz-Pruefung per HEAD-Anfrage: laedt das Bild NICHT herunter (frueher: jedes Bild 2x)
  // 2) Priorisierter Bild-Lader: zuerst Hero / aktives Bild / sichtbarer Bereich, dann der Rest schrittweise
  // 3) Collections und Timeline erscheinen, sobald das erste Bild gefunden ist (kein Warten auf alles)
  // ==========================================

  // Fallback-Pruefung (laedt das Bild), nur noetig falls HEAD nicht moeglich ist (z.B. file://)
  function checkImageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  const probeCache = new Map();
  function probeImage(url) {
    if (probeCache.has(url)) return probeCache.get(url);
    const p = (async () => {
      try {
        const res = await fetch(url, { method: 'HEAD' });
        if (res.status === 405 || res.status === 501) return await checkImageExists(url);
        // Manche Server liefern fuer fehlende Dateien die Startseite (HTML) mit Status 200 aus
        const type = res.headers.get('content-type') || '';
        return res.ok && !type.includes('text/html');
      } catch (e) {
        return await checkImageExists(url);
      }
    })();
    probeCache.set(url, p);
    return p;
  }

  // Merkt sich die zuletzt gefundene Endung und probiert sie zuerst (spart Anfragen)
  let preferredImageExt = 'jpg';
  async function findImage(base, exts) {
    const first = exts.includes(preferredImageExt) ? preferredImageExt : exts[0];
    if (await probeImage(`${base}.${first}`)) return `${base}.${first}`;

    const rest = exts.filter((e) => e !== first);
    return new Promise((resolve) => {
      let pending = rest.length;
      if (!pending) return resolve(null);
      rest.forEach((ext) => {
        probeImage(`${base}.${ext}`).then((ok) => {
          if (ok) {
            preferredImageExt = ext;
            resolve(`${base}.${ext}`);
          } else if (--pending === 0) {
            resolve(null);
          }
        });
      });
    });
  }

  // Findet main.*, 1.*, 2.* ... in Reihenfolge und meldet jedes Bild sofort (onFound).
  // Mehrere Nummern werden vorausschauend parallel geprueft; Stopp an der ersten Luecke.
  async function discoverImages(base, exts, onFound, lookAhead = 4) {
    const probes = new Map();
    const probe = (key) => {
      if (!probes.has(key)) probes.set(key, findImage(`${base}/${key}`, exts));
      return probes.get(key);
    };

    probe('main');
    for (let i = 1; i <= lookAhead; i++) probe(String(i));

    let count = 0;
    const mainPath = await probe('main');
    if (mainPath) await onFound(mainPath, 'main', count++);

    for (let n = 1; ; n++) {
      probe(String(n + lookAhead));
      const path = await probe(String(n));
      if (!path) break;
      await onFound(path, String(n), count++);
    }
    return count;
  }

  // Abstand eines Elements zum sichtbaren Bereich (0 = sichtbar, 1e6 = Ansicht gerade verborgen)
  function viewportDistance(el) {
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return 1e6;
    if (r.bottom < 0) return -r.bottom;
    if (r.top > window.innerHeight) return r.top - window.innerHeight;
    return 0;
  }

  // Laedt Bilder gestaffelt (max. 4 gleichzeitig). Bei jedem Schritt kommt das Bild mit der
  // kleinsten Prioritaetszahl zuerst; die Prioritaet wird dabei live neu berechnet (Scrollen, Timeline-Wechsel).
  const ImageLoader = {
    queue: [],
    active: 0,
    activeCritical: 0,
    max: 4,
    visibleReady: false, // wird true, sobald das Hero/Spotlight der sichtbaren Ansicht geladen ist (oder nach 3 s)
    // high = kritisches Bild (Hero / aktives Timeline-Bild): bekommt die ganze Bandbreite, bevor andere starten
    add(img, src, priority, high) {
      img.decoding = 'async';
      if (high) img.fetchPriority = 'high';
      this.queue.push({ img, src, priority, high: !!high });
      this.pump();
    },
    pump() {
      while (this.active < this.max && this.queue.length) {
        let best = -1;
        let bestValue = Infinity;
        for (let i = 0; i < this.queue.length; i++) {
          const t = this.queue[i];
          if (this.activeCritical > 0 && !t.high) continue; // waehrend ein kritisches Bild laedt, warten die anderen
          const value = typeof t.priority === 'function' ? t.priority() : t.priority;
          if (value >= 1e6 && !this.visibleReady) continue;  // Bilder einer gerade verborgenen Ansicht kommen spaeter
          if (value < bestValue) { bestValue = value; best = i; }
        }
        if (best === -1) return;
        const task = this.queue.splice(best, 1)[0];
        this.active++;
        if (task.high) this.activeCritical++;
        const done = () => {
          this.active--;
          if (task.high) { this.activeCritical--; this.visibleReady = true; }
          this.pump();
        };
        task.img.addEventListener('load', done, { once: true });
        task.img.addEventListener('error', done, { once: true });
        task.img.src = task.src;
      }
    }
  };
  setTimeout(() => { ImageLoader.visibleReady = true; ImageLoader.pump(); }, 3000);

  // Liest info.txt aus dem Ordner und verarbeitet individuelle Bild-Texte
  async function loadFolderInfo(folderName, basePath = '/collection') {
    const info = {
      title: folderName.toUpperCase(),
      subtitle: '',
      description: '',
      captions: {}
    };

    try {
      const response = await fetch(`${basePath}/${folderName}/info.txt`);
      // Manche Server liefern fuer fehlende Dateien die Startseite (HTML) mit Status 200 aus
      const contentType = response.headers.get('content-type') || '';
      if (response.ok && !contentType.includes('text/html')) {
        const text = await response.text();
        const lines = text.split('\n');

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;

          if (trimmed.toLowerCase().startsWith('title:')) {
            info.title = trimmed.replace(/title:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('subtitle:')) {
            info.subtitle = trimmed.replace(/subtitle:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('description:')) {
            info.description = trimmed.replace(/description:/i, '').trim();
          } else {
            const match = trimmed.match(/^([a-zA-Z0-9]+)\s*:\s*(.+)$/);
            if (match) {
              const key = match[1].toLowerCase();
              const rawValue = match[2].trim();
              
              let title = rawValue;
              let desc = info.description;

              if (rawValue.includes(' — ')) {
                const parts = rawValue.split(' — ');
                title = parts[0].trim();
                desc = parts.slice(1).join(' — ').trim();
              } else if (rawValue.includes('|')) {
                const parts = rawValue.split('|');
                title = parts[0].trim();
                desc = parts[1].trim();
              }

              info.captions[key] = { title, description: desc };
            }
          }
        });
      }
    } catch (e) {
      // Keine info.txt vorhanden - Standardwerte greifen
    }

    return info;
  }

  const COLLECTION_IMAGE_EXTENSIONS = ['jpg', 'png', 'webp'];

  // Zeigt eine Collection, sobald ihr erstes Bild gefunden ist. Die restlichen Bilder werden
  // im Hintergrund entdeckt und nach und nach angehaengt. Die naechste Collection startet sofort.
  async function loadCollection(colIndex, gallery) {
    const folder = `collection${colIndex}`;
    const infoPromise = loadFolderInfo(folder);
    const images = [];
    let grid = null;

    await discoverImages(`./collection/${folder}`, COLLECTION_IMAGE_EXTENSIONS, async (path, key) => {
      const info = await infoPromise;
      const numeric = key === 'main' ? 0 : parseInt(key, 10);
      const meta = key === 'main'
        ? (info.captions['main'] || { title: info.title, description: info.description })
        : (info.captions[key] || { title: `${info.title} — #${key}`, description: info.description });

      const entry = {
        src: path,
        title: meta.title,
        description: meta.description,
        layout: key === 'main' ? 'hero' : (numeric % 3 === 0 ? 'wide' : 'square')
      };
      const index = images.length;
      images.push(entry);

      if (index === 0) {
        const wrapper = document.createElement('section');
        wrapper.className = 'collection-wrapper';
        wrapper.id = `col-${colIndex}`;

        const hero = document.createElement('div');
        hero.className = 'hero-item';

        const heroFrame = document.createElement('div');
        heroFrame.className = 'image-wrapper';
        heroFrame.style.cursor = 'pointer';
        const heroImg = document.createElement('img');
        heroImg.alt = entry.title;
        heroFrame.appendChild(heroImg);
        heroFrame.addEventListener('click', () => {
          openLightbox(entry.src, entry.title, entry.description, images, 0);
        });
        hero.appendChild(heroFrame);

        const label = document.createElement('div');
        label.className = 'single-line-label';
        const strong = document.createElement('strong');
        strong.textContent = info.title;
        label.appendChild(strong);
        if (info.subtitle) {
          label.appendChild(document.createTextNode(' — ' + info.subtitle));
        }
        hero.appendChild(label);
        wrapper.appendChild(hero);

        grid = document.createElement('div');
        grid.className = 'grid-right';
        wrapper.appendChild(grid);
        gallery.appendChild(wrapper);

        // Hero sofort laden (die erste Collection mit hoechster Prioritaet)
        ImageLoader.add(heroImg, path, () => viewportDistance(heroFrame),
          colIndex === 1 && document.getElementById('galleryView').classList.contains('active-view'));

        // Naechste Collection schon jetzt suchen, ohne auf die Bilder dieser zu warten
        loadCollection(colIndex + 1, gallery);
      } else {
        const card = document.createElement('div');
        card.className = 'gallery-item' + (entry.layout === 'wide' ? ' span-2' : '');
        const frame = document.createElement('div');
        frame.className = 'image-wrapper ' + (entry.layout === 'wide' ? 'ratio-16-9' : 'ratio-1-1');
        const img = document.createElement('img');
        img.alt = entry.title;
        frame.appendChild(img);
        frame.addEventListener('click', () => openLightbox(entry.src, entry.title, entry.description, images, index));
        card.appendChild(frame);
        grid.appendChild(card);

        ImageLoader.add(img, path, () => viewportDistance(frame));
      }
    });
  }

  async function loadCollectionsAutomatically() {
    const gallery = document.getElementById('dynamicGallery');
    if (!gallery) return;
    await loadCollection(1, gallery);
  }

  // ==========================================
  // TIMELINE HILFSFUNKTIONEN & DATUM-PARSER
  // ==========================================
  const monthNamesGerman = {
    jan: 'Januar', januar: 'Januar', feb: 'Februar', februar: 'Februar',
    mar: 'März', maerz: 'März', apr: 'April', april: 'April',
    may: 'Mai', mai: 'Mai', jun: 'Juni', juni: 'Juni',
    jul: 'Juli', juli: 'Juli', aug: 'August', august: 'August',
    sep: 'September', september: 'September', oct: 'Oktober', okt: 'Oktober', oktober: 'Oktober',
    nov: 'November', november: 'November', dec: 'Dezember', dez: 'Dezember', dezember: 'Dezember'
  };

  const monthIndexMap = {
    januar: 0, jan: 0, februar: 1, feb: 1, märz: 2, maerz: 2, mar: 2,
    april: 3, apr: 3, mai: 4, may: 4, juni: 5, jun: 5, juli: 6, jul: 6,
    august: 7, aug: 7, september: 8, sep: 8, oktober: 9, okt: 9, oct: 9,
    november: 10, nov: 10, dezember: 11, dez: 11, dec: 11
  };

  function parseFilenameToMetadata(filename) {
    const baseName = filename.replace(/\.(jpg|jpeg|png|webp)$/i, '').trim();
    const parts = baseName.split(/[-_]+/).map(p => p.trim()).filter(Boolean);

    let parsedDateObj = new Date(0);
    let formattedDate = '';
    let location = '';
    let description = '';

    if (parts.length > 0) {
      const rawDateStr = parts[0];
      const dateMatch = rawDateStr.match(/^(\d{1,2})([a-zA-ZäöüÄÖÜ]+)(\d{2,4})$/) || rawDateStr.match(/^(\d{2})(\d{2})(\d{4})$/);

      if (dateMatch) {
        let day, rawMonth, year;
        if (dateMatch[2].match(/^\d+$/)) {
          day = parseInt(dateMatch[1], 10);
          const monthNum = parseInt(dateMatch[2], 10);
          const monthNamesArr = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
          rawMonth = monthNamesArr[monthNum - 1] || 'januar';
          year = parseInt(dateMatch[3], 10);
        } else {
          day = parseInt(dateMatch[1], 10);
          rawMonth = dateMatch[2].toLowerCase();
          year = parseInt(dateMatch[3], 10);
          if (year < 100) year += 2000;
        }

        const monthName = monthNamesGerman[rawMonth] || rawMonth;
        const monthIndex = monthIndexMap[rawMonth] !== undefined ? monthIndexMap[rawMonth] : 0;

        formattedDate = `${day}. ${monthName} ${year}`;
        parsedDateObj = new Date(year, monthIndex, day);
      } else {
        formattedDate = rawDateStr;
      }
    }

    if (parts.length === 2) {
      location = parts[1];
    } else if (parts.length >= 3) {
      location = parts[1];
      description = parts.slice(2).join(' ');
    }

    const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

    return {
      dateText: formattedDate,
      location: capitalize(location),
      description: capitalize(description),
      dateObj: parsedDateObj
    };
  }

  // ==========================================
  // UHREN-MECHANIK & ZENTRIERTE TIMELINE
  // ==========================================
  let currentTimelineIndex = 0;
  let targetTimelineIndex = 0;
  let timelineItemsGlobal = [];

  function updateTimelineWheel(index) {
    if (timelineItemsGlobal.length === 0) return;

    currentTimelineIndex = Math.max(0, Math.min(index, timelineItemsGlobal.length - 1));
    targetTimelineIndex = currentTimelineIndex;

    setHeaderScrolledState(currentTimelineIndex > 0);

    const stack = document.getElementById('timelineStack');
    const rows = document.querySelectorAll('.timeline-row');
    const ticks = document.querySelectorAll('.zeitstrahl-tick');
    const thumbs = document.querySelectorAll('.mini-thumb');
    const zeitstrahlDot = document.getElementById('zeitstrahlDot');

    if (rows.length === 0) return;

    // Center image stack
    const offsetY = -(currentTimelineIndex * window.innerHeight);
    stack.style.transform = `translateX(-50%) translateY(${offsetY}px)`;

    // Center mini-slider thumbnails
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const thumbHeight = 54; // 48px + 6px gap
    const thumbOffsetY = -(currentTimelineIndex * thumbHeight);
    if (miniSliderTrack) {
      miniSliderTrack.style.transform = `translateY(calc(50% - 27px + ${thumbOffsetY}px))`;
    }
      
    // Center date ticks perfectly in the 250px viewport
    const ticksTrack = document.getElementById('zeitstrahlTicks');
    const itemHeight = 18; // Height of each tick item
    const gap = 38;        // Must match the CSS gap above
    const tickHeight = itemHeight + gap; 
    const viewportCenter = 125; // Half of the 250px viewport height
    
    // Calculates exact offset to keep active tick dead-center
    const tickOffsetY = viewportCenter - (itemHeight / 2) - (currentTimelineIndex * tickHeight);
    
    if (ticksTrack) {
      ticksTrack.style.transform = `translateY(${tickOffsetY}px)`;
    }

    rows.forEach((r, idx) => r.classList.toggle('active-center', idx === currentTimelineIndex));
    ticks.forEach((t, idx) => t.classList.toggle('active', idx === currentTimelineIndex));
    thumbs.forEach((m, idx) => m.classList.toggle('active', idx === currentTimelineIndex));

    if (zeitstrahlDot && rows.length > 1) {
      const percent = (currentTimelineIndex / (rows.length - 1)) * 100;
      zeitstrahlDot.style.top = `${percent}%`;
    }
}

  let isScrollingTimeline = false;

  window.addEventListener('wheel', (e) => {
    const timelineView = document.getElementById('timelineView');
    if (!timelineView || !timelineView.classList.contains('active-view')) return;

    // Event-Ansicht und Lightbox scrollen/zoomen selbst - die Timeline dahinter darf nicht mitlaufen
    if (isTimelineOverlayOpen()) return;

    e.preventDefault();

    if (Math.abs(e.deltaY) > 5) {
      const direction = e.deltaY > 0 ? 1 : -1;
      
      // Accumulate target index immediately for fast consecutive scrolls
      targetTimelineIndex = Math.max(0, Math.min(targetTimelineIndex + direction, timelineItemsGlobal.length - 1));
      
      updateTimelineWheel(targetTimelineIndex);
    }
  }, { passive: false });

  // Zentraler Klick-Handler für das aktive Timeline-Bild
  function openCurrentTimelineLightbox() {
    if (timelineItemsGlobal.length === 0) return;
    const item = timelineItemsGlobal[currentTimelineIndex];
    if (!item) return;

    // Ordner-Event: Event-Ansicht mit allen Bildern oeffnen
    if (item.isCollection) {
      openEventOverlay(item);
      return;
    }

    const toLightboxEntry = (it) => ({
      src: it.src,
      title: it.location ? `${it.location} (${it.dateText})` : it.dateText,
      description: it.description || (it.location ? it.dateText : '')
    });

    // Alle einzelnen Timeline-Bilder (ohne Ordner) als Wechselliste
    const singles = timelineItemsGlobal.filter((it) => !it.isCollection);
    const list = singles.map(toLightboxEntry);
    const idx = singles.indexOf(item);
    const entry = toLightboxEntry(item);

    openLightbox(entry.src, entry.title, entry.description, list, idx);
  }
  // ==========================================
  // TIMELINE-EVENTS AUS ORDNERN (mehrere Bilder pro Event)
  // timeline.json darf Dateien UND Ordner enthalten:
  //   "12mai2024-Berlin-Konzert.jpg"       -> einzelnes Bild, Beschreibung kommt aus dem Dateinamen
  //   "12mai2024-Berlin-Konzert"           -> Ordner ./timeline/12mai2024-Berlin-Konzert/
  //   "12mai2024-Berlin-Konzert/main.jpg"  -> ebenfalls dieser Ordner
  // Im Ordner: main.jpg = Titelbild, 1.jpg, 2.jpg, ... = weitere Bilder (wie bei den Collections),
  // optional info.txt (title:, description:, main: Titel | Text, 1: Titel | Text, ...).
  // Der Ordnername wird wie ein Dateiname gelesen (Datum-Ort-Beschreibung).
  // ==========================================
  const TIMELINE_IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp'];
  let timelineSuppressClickUntil = 0; // verhindert den "Geister-Klick" direkt nach einer Wischgeste

  function isTimelineOverlayOpen() {
    const ev = document.getElementById('eventOverlay');
    const lb = document.getElementById('lightboxOverlay');
    return !!((ev && ev.classList.contains('active')) || (lb && lb.classList.contains('active')));
  }

  function resolveTimelineEntry(entry) {
    const clean = String(entry || '').trim().replace(/^\.?\/+/, '').replace(/\/+$/, '');
    if (!clean) return null;
    const isImage = /\.(jpg|jpeg|png|webp)$/i.test(clean);
    if (isImage && !clean.includes('/')) return { type: 'file', name: clean };
    return { type: 'folder', name: clean.split('/')[0] };
  }

  // Baut ein Ordner-Event. Wartet nur auf das ERSTE Bild (+ info.txt); weitere Bilder
  // werden im Hintergrund gefunden und an item.images angehaengt.
  async function buildTimelineEvent(folder) {
    const infoPromise = loadFolderInfo(folder, './timeline');
    const meta = parseFilenameToMetadata(folder);
    const images = [];
    let item = null;
    let eventTitle = '';
    let description = '';
    let hasExplicitTitle = false;

    const found = await new Promise((resolve) => {
      discoverImages(`./timeline/${folder}`, TIMELINE_IMAGE_EXTENSIONS, async (path, key) => {
        const info = await infoPromise;
        hasExplicitTitle = info.title !== folder.toUpperCase();
        eventTitle = hasExplicitTitle ? info.title : (meta.location || meta.dateText);
        description = info.description || meta.description || '';

        const caption = info.captions[key];
        const idx = images.length;
        const fallbackTitle = idx === 0 ? eventTitle : `${eventTitle} — #${key}`;
        images.push({
          src: path,
          title: caption ? caption.title : fallbackTitle,
          description: (caption && caption.description) || description
        });

        if (idx === 0) resolve(true);
        else if (item && item.onImagesChanged) item.onImagesChanged();
      }).then(() => resolve(false));
    });

    if (!found) {
      console.warn(`Timeline-Ordner "${folder}" enthaelt keine Bilder (main.jpg, 1.jpg, ...)`);
      return null;
    }

    const info = await infoPromise;
    item = {
      src: images[0].src,
      dateText: meta.dateText,
      location: meta.location || (hasExplicitTitle ? info.title : ''),
      description,
      dateObj: meta.dateObj,
      isCollection: true,
      folder,
      eventTitle,
      images
    };
    return item;
  }

  function openEventOverlay(item) {
    const overlay = document.getElementById('eventOverlay');
    const host = document.getElementById('eventWrapper');
    const scroller = document.getElementById('eventScroll');
    if (!overlay || !host || !scroller || !item || !item.images || item.images.length === 0) return;

    host.innerHTML = '';
    const heroData = item.images[0];
    const others = item.images.slice(1);

    // Linke Spalte: Hauptbild (genau wie bei den Collections)
    const hero = document.createElement('div');
    hero.className = 'hero-item';
    const heroFrame = document.createElement('div');
    heroFrame.className = 'image-wrapper';
    heroFrame.style.cursor = 'pointer';
    const heroImg = document.createElement('img');
    heroImg.src = heroData.src;
    heroImg.alt = heroData.title;
    heroFrame.appendChild(heroImg);
    heroFrame.addEventListener('click', () => openLightbox(heroData.src, heroData.title, heroData.description, item.images, 0));
    hero.appendChild(heroFrame);

    const label = document.createElement('div');
    label.className = 'single-line-label';
    const strong = document.createElement('strong');
    strong.textContent = item.eventTitle;
    label.appendChild(strong);
    if (item.dateText) label.appendChild(document.createTextNode(' — ' + item.dateText));
    hero.appendChild(label);
    host.appendChild(hero);

    // Rechte Spalte: Beschreibung als Block ueber zwei Zeilen, danach die weiteren Bilder
    const grid = document.createElement('div');
    grid.className = 'event-grid';

    if (item.description) {
      const block = document.createElement('div');
      block.className = 'event-desc-block';

      if (item.dateText) {
        const date = document.createElement('div');
        date.className = 'event-desc-date';
        date.textContent = item.dateText;
        block.appendChild(date);
      }

      const title = document.createElement('div');
      title.className = 'event-desc-title';
      title.textContent = item.eventTitle;
      block.appendChild(title);

      const text = document.createElement('div');
      text.className = 'event-desc-text';
      text.textContent = item.description;
      block.appendChild(text);

      grid.appendChild(block);
    }

    others.forEach((imgData, imgIdx) => {
      const card = document.createElement('div');
      card.className = 'gallery-item';
      const frame = document.createElement('div');
      frame.className = 'image-wrapper';
      const img = document.createElement('img');
      img.src = imgData.src;
      img.alt = imgData.title;
      img.loading = 'lazy';
      frame.appendChild(img);
      frame.addEventListener('click', () => openLightbox(imgData.src, imgData.title, imgData.description, item.images, imgIdx + 1));
      card.appendChild(frame);
      grid.appendChild(card);
    });

    host.appendChild(grid);

    scroller.scrollTop = 0;
    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
  }

  function closeEventOverlay() {
    const overlay = document.getElementById('eventOverlay');
    if (!overlay) return;
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
  }

  // Esc schliesst zuerst die Lightbox, danach die Event-Ansicht
  document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightboxOverlay');
    const lbOpen = lb && lb.classList.contains('active');

    if (lbOpen && (e.key === 'ArrowUp' || e.key === 'ArrowLeft')) { e.preventDefault(); stepLightbox(-1); return; }
    if (lbOpen && (e.key === 'ArrowDown' || e.key === 'ArrowRight')) { e.preventDefault(); stepLightbox(1); return; }

    if (e.key !== 'Escape') return;
    if (lbOpen) {
      closeLightbox();
    } else {
      closeEventOverlay();
    }
  });

  async function loadTimelineAutomatically() {
    const timelineStack = document.getElementById('timelineStack');
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const zeitstrahlTicks = document.getElementById('zeitstrahlTicks');
    
    if (!timelineStack) return;

    timelineStack.innerHTML = '';
    if (miniSliderTrack) miniSliderTrack.innerHTML = '';
    zeitstrahlTicks.innerHTML = '';

    timelineItemsGlobal = [];

    const timelineIsActive = () => document.getElementById('timelineView').classList.contains('active-view');
    // Prioritaet: aktives Bild zuerst, dann die Nachbarn (naechstes vor vorherigem), dann der Rest
    const timelinePriority = (idx) => () => {
      const d = idx >= currentTimelineIndex ? idx - currentTimelineIndex : (currentTimelineIndex - idx) + 0.5;
      return (timelineIsActive() ? 0 : 1e6) + d;
    };

    try {
      const response = await fetch('./timeline/timeline.json');
      if (!response.ok) return;
      const candidateFiles = await response.json();

      // Eintraege sind Bilddateien ODER Ordner (siehe Kommentar oben); doppelte Eintraege werden ignoriert.
      // Einzelne Dateien sind sofort bereit, Ordner warten nur auf ihr erstes Bild.
      const seen = new Set();
      const built = await Promise.all(candidateFiles.map(async (entry) => {
        const resolved = resolveTimelineEntry(entry);
        if (!resolved) return null;
        const key = resolved.type + ':' + resolved.name;
        if (seen.has(key)) return null;
        seen.add(key);

        if (resolved.type === 'file') {
          const meta = parseFilenameToMetadata(resolved.name);
          return { src: `./timeline/${resolved.name}`, ...meta };
        }
        return await buildTimelineEvent(resolved.name);
      }));
      built.filter(Boolean).forEach((item) => timelineItemsGlobal.push(item));

      timelineItemsGlobal.sort((a, b) => b.dateObj - a.dateObj);
      if (timelineItemsGlobal.length === 0) return;

      timelineItemsGlobal.forEach((item, idx) => {
        let badgeText = item.dateText;
        if (item.location) badgeText += ` — ${item.location}`;

        const row = document.createElement('div');
        row.className = 'timeline-row' + (idx === 0 ? ' active-center' : '');
        row.id = `t-row-${idx}`;
        // Klick auf die gesamte aktive Zeile öffnet direkt die Lightbox des aktuellen Eintrags
        row.onclick = () => {
          if (performance.now() < timelineSuppressClickUntil) return; // Klick direkt nach einer Wischgeste ignorieren
          if (idx === currentTimelineIndex) {
            openCurrentTimelineLightbox();
          } else {
            scrollToRow(idx);
          }
        };

        const badge = document.createElement('div');
        badge.className = 'timeline-date-badge';
        badge.textContent = badgeText;
        row.appendChild(badge);

        // Ordner-Event mit weiteren Bildern: kleiner Hinweis "+N" (waechst mit, waehrend weitere Bilder gefunden werden)
        const refreshTag = () => {
          if (!item.isCollection || item.images.length <= 1) return;
          let tag = badge.querySelector('.timeline-multi-tag');
          if (!tag) {
            tag = document.createElement('span');
            tag.className = 'timeline-multi-tag';
            badge.appendChild(tag);
          }
          tag.textContent = `+${item.images.length - 1}`;
        };
        refreshTag();
        item.onImagesChanged = refreshTag;

        const container = document.createElement('div');
        container.className = 'timeline-item-container';

        const wrapper = document.createElement('div');
        wrapper.className = 'timeline-item-wrapper';

        const img = document.createElement('img');
        img.alt = item.location || item.dateText;
        wrapper.appendChild(img);

        container.appendChild(wrapper);
        row.appendChild(container);
        timelineStack.appendChild(row);

        const thumb = document.createElement('img');
        thumb.className = 'mini-thumb' + (idx === 0 ? ' active' : '');
        thumb.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        if (miniSliderTrack) miniSliderTrack.appendChild(thumb);

        // Die kleine Vorschau nutzt dasselbe Bild erst, wenn es geladen ist (kommt aus dem Cache, kein Extra-Download)
        img.addEventListener('load', () => { thumb.src = item.src; }, { once: true });

        // Das Spotlight-Bild (aktuell aktiv) laedt zuerst, die anderen schrittweise danach
        ImageLoader.add(img, item.src, timelinePriority(idx), idx === 0 && timelineIsActive());

        const tick = document.createElement('span');
        tick.className = 'zeitstrahl-tick' + (idx === 0 ? ' active' : '');
        tick.textContent = item.dateText;
        tick.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        zeitstrahlTicks.appendChild(tick);
      });

      updateTimelineWheel(0);

    } catch (error) {
      console.error("Fehler beim Laden der Timeline:", error);
    }
  }

  // Initialer Aufruf beider Lade-Funktionen
  loadCollectionsAutomatically();
  loadTimelineAutomatically();
  // Saubere Touch-Swipe-Steuerung für die Timeline auf Mobilgeräten
let touchStartY = 0;
let touchEndY = 0;
let touchMoved = false;
const timelineViewEl = document.getElementById('timelineView');

if (timelineViewEl) {
    timelineViewEl.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        // FIX: Endwert zuruecksetzen. Vorher blieb der Wert der letzten Geste stehen (anfangs 0),
        // dadurch wurde ein einfaches Antippen manchmal als Wischen gewertet und oeffnete nichts.
        touchEndY = touchStartY;
        touchMoved = false;
    }, { passive: true });

    timelineViewEl.addEventListener('touchmove', (e) => {
        touchEndY = e.touches[0].clientY;
        touchMoved = true;
    }, { passive: true });

    timelineViewEl.addEventListener('touchend', () => {
        if (!timelineViewEl.classList.contains('active-view')) return;
        
        let diffY = touchStartY - touchEndY;

        // Nur wenn der Finger wirklich bewegt wurde und die Wischbewegung größer als 30 Pixel ist
        if (touchMoved && Math.abs(diffY) > 30) {
            timelineSuppressClickUntil = performance.now() + 400; // der folgende Klick gehoert zur Geste
            if (diffY > 0) {
                // Nach oben wischen -> Nächstes Bild
                targetTimelineIndex = Math.min(targetTimelineIndex + 1, timelineItemsGlobal.length - 1);
            } else {
                // Nach unten wischen -> Vorheriges Bild
                targetTimelineIndex = Math.max(targetTimelineIndex - 1, 0);
            }
            updateTimelineWheel(targetTimelineIndex);
        }
    }, { passive: true });
}

menuToggleBtnElement.addEventListener('click', (e) => {
    if (isMobileNav()) {

});

if (mobileMenuCloseBtn) {

        e.stopPropagation();
        navWrapperElement.classList.remove('mobile-menu-active');
    });
}

        if (isMobileNav()) {
