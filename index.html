<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NENA NETWORK – Gallery & Timeline</title>
    <link rel="icon" type="image/png" href="./assets/icon.png">
    <style>

    /* --- CUSTOM TRANSPARENT AUTO-HIDING SCROLLBAR --- */
    ::-webkit-scrollbar {
        width: 6px;
    }

    /* Fully transparent track background */
    ::-webkit-scrollbar-track {
        background: transparent;
    }

    /* Removes top and bottom arrow/triangle buttons */
    ::-webkit-scrollbar-button {
        display: none;
        height: 0;
        width: 0;
    }

    /* The draggable scrollbar thumb */
    ::-webkit-scrollbar-thumb {
        background-color: var(--divider-color);
        border-radius: 3px;
        opacity: 0; /* Hidden by default */
        transition: opacity 0.4s ease;
    }

    /* When scrolling, make the scrollbar thumb visible */
    body.is-user-scrolling::-webkit-scrollbar-thumb {
        opacity: 1;
    }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
/* Default Light Theme */
:root {
    --bg-color: #f8f9fa;
    --text-color: #121212;
    --accent-red: #990f02;
    --banner-bg: #f8f9fa;
    --banner-text: #121212;
    --divider-color: #e0e0e0;
    --subtext-color: #888888; /* Softer, lighter grey for light mode */
}

/* Automatic Dark Theme based on OS / Browser Preference */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #0f0f0f;
        --text-color: #f0f0f0;
        --accent-red: #990f02;
        --banner-bg: #0f0f0f;
        --banner-text: #ffffff;
        --divider-color: #333333;
        --subtext-color: #888888; /* Balanced soft grey for dark mode */
    }
}

/* Timeline Ticks Styling */
.zeitstrahl-tick {
    font-size: 0.65rem;
    color: var(--subtext-color); /* Uses the soft grey */
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s, transform 0.3s, opacity 0.3s;
    opacity: 0.5; /* Slightly increased visibility for the soft grey */
    white-space: nowrap;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    transform-origin: right center;
}

/* Active and Hovered Ticks turn RED */
.zeitstrahl-tick.active, 
.zeitstrahl-tick:hover {
    color: var(--accent-red) !important; /* Forces active & hovered state to red */
    font-weight: 700;
    opacity: 1;
    transform: scale(1.15);
}
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    /* 1. TOP BANNER */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: transparent;
        color: var(--banner-text);
        display: flex;
        align-items: center;
        padding: 0 2rem;
        z-index: 1000;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    header.scrolled-away {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
    }

    .title-text {
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--banner-text);
    }

    .title-text span {
        color: var(--accent-red);
    }

    /* 2. NAVIGATION CONTAINER */
    /* One source of truth for the menu point so it sits in the exact same spot in every state
       (closed, scrolled, fullscreen menu open). */
    :root {
        --nav-dot: 18px;
        --nav-dot-right: 2rem;
    }

    .nav-wrapper {
        position: fixed;
        top: 0;
        right: var(--nav-dot-right); /* Matches your header padding */
        height: 60px; /* Matches the header height */
        z-index: 1002;
        display: flex;
        align-items: center; /* Centers the point vertically with the header contents */
        pointer-events: auto;
    }

    .menu-hitbox {
        padding: 15px;
        margin: -15px;
        cursor: pointer;
        touch-action: manipulation;
    }

    .menu-toggle-btn {
        position: relative;
        width: 28px;
        height: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-toggle-btn span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: var(--accent-red);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: center;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px;
        height: 18px;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(3),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 4px;
        height: 100%;
        border-radius: 0;
    }

    body.is-scrolled .menu-toggle-btn {
        width: 18px;
        height: 18px;
    }

    body.is-scrolled .menu-toggle-btn span {
        background-color: var(--accent-red);
        border-radius: 50%;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(1),
    body.is-scrolled .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
        display: none;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(2) {
        width: 18px !important; /* Matched to 18px */
        height: 18px !important; /* Matched to 18px */
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* REMOVE OR REPLACE THESE TWO BLOCKS WHICH CAUSED THE LINE MORPH ON SCROLL */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        height: 8px !important;
        width: 8px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* 3. MENU POPUP (Top State - Single-line horizontal flyout) */
    .banner-menu-popup {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        background-color: transparent;
        padding: 0;
        min-width: auto;
        display: flex;
        flex-direction: row; /* Arranges items in a single line */
        gap: 1.5rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        z-index: 1003;
        box-shadow: none;
        border: none; /* Removes background box & red border */
        white-space: nowrap;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .banner-menu-popup,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .banner-menu-popup {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(-10px); /* Slides horizontally into position */
    }

    .banner-menu-popup a {
        color: var(--banner-text);
        text-decoration: none;
        font-size: 0.95rem; /* Matches .title-text font size */
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: color 0.2s, transform 0.2s;
        cursor: pointer;
    }

    .banner-menu-popup a:hover {
        color: var(--accent-red);
        transform: translateY(-2px); /* Subtle hover lift */
    }

    /* 4. FLYOUT MENU */
    .flyout-menu {
        position: absolute;
        right: 0rem;
        font-size: 1.9rem;
        line-height: 1.2;
        top: 100%;
        transform: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        text-align: right;
        pointer-events: none;
        z-index: 1000;
        overflow: visible;
        padding-right: 15px;
    }

    .flyout-menu a {
        /* Text is painted by a two-color gradient: red on the right half, menu color on the left.
           Sliding the gradient (background-position) wipes the text from red to the menu color. */
        color: transparent;
        /* 300% wide: the visible window is the left third (pure menu color) at the end and the
           right third (pure red) at the start, so no red tint is left at the end of the wipe */
        background-image: linear-gradient(90deg, var(--banner-text) 0%, var(--banner-text) 46%, var(--accent-red) 54%, var(--accent-red) 100%);
        background-size: 300% 100%;
        background-position: 100% 0; /* fully red */
        -webkit-background-clip: text;
        background-clip: text;
        text-decoration: none;
        font-size: 1em; /* sized by .flyout-menu */
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, background-position 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    /* Hide the red dot on hover/near-mouse when scrolled, making space for the text */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px !important;
        height: 18px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0 !important;
        transform: scale(0) !important;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu {
        pointer-events: auto;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu a {
        opacity: 1;
        transform: translateX(0);
        background-position: 0 0; /* wipes from red to the menu color, left to right */
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(1) { transition-delay: 0.05s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(2) { transition-delay: 0.10s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(3) { transition-delay: 0.15s; }

    .flyout-menu a:hover {
        transform: translateX(-8px) !important;
    }

    /* VIEWS MANAGEMENT */
    .view-section {
        display: none;
        width: 100vw;
        min-height: 100vh;
    }

    .view-section.active-view {
        display: block;
    }

    /* --- GALLERY / Galerie VIEW --- */
    #galleryView {
        padding-bottom: 2rem;
    }

    .collection-wrapper {
        width: 100vw;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 2rem;
        padding: 60px 2rem 2rem 2rem;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .hero-item {
        position: sticky;
        top: 80px;
        height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
    }

    .hero-item .image-wrapper {
        flex: 1;
        width: 100%;
        overflow: hidden;
        background: transparent; /* Removes the grey/dark background box */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .single-line-label {
        margin-top: 6px;
        font-size: 0.65rem;
        color: #888;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .single-line-label strong {
        color: #ddd;
        font-weight: 600;
        text-transform: uppercase;
    }

    .grid-right {
        columns: 2;
        column-gap: 20px;
    }

    .gallery-item {
        break-inside: avoid;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .image-wrapper {
        width: 100%;
        overflow: hidden;
        background: #1a1a1a;
        cursor: pointer;
        position: relative;
    }

    .image-wrapper img {
        width: 100%;
        height: auto; /* Crucial: maintains original aspect ratio perfectly without cropping */
        display: block;
        object-fit: unset;
    }

    /* --- TIMELINE VIEW (Uhren-Mechanik / Walze) --- */
    .timeline-view {
        display: none;
        height: 100vh;
        overflow: hidden;
        position: relative;
        width: 100vw;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .timeline-view.active-view {
        display: block;
    }

    /* Mini-Thumbnail-Leiste als synchrone Walze */
    .timeline-mini-slider {
        position: fixed;
        left: 2rem;
        top: 50%;
        transform: translateY(-50%);
        max-height: 80vh; /* Allows it to grow based on content */
        overflow: hidden;  /* Hides scrollbars while staying functional */
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: transparent;
        padding: 4px;
        border: none;
        z-index: 20;
        pointer-events: auto;
    }

    /* Der innere Container, der sich analog mitbewegt */
    .mini-slider-track {
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mini-thumb {
        width: 36px;
        height: 48px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.6;
        border: none;
        transition: all 0.3s ease;
    }

    .mini-thumb:hover {
        opacity: 0.7;
    }

    .mini-thumb.active {
        opacity: 1;
        border: 1px solid var(--accent-red); /* Dezenter roter Rahmen für das aktive Mini-Bild */
    }

    /* Zeitstrahl-Track */
    .zeitstrahl-track {
        position: relative;
        width: 1px;
        height: 100%;
        background-color: #333;
    }
    /* .zeitstrahl-dot wurde entfernt, damit ist der Punkt weg */

    /* Rechter Zeitstrahl-Navigationsbereich */
.zeitstrahl-nav {
    position: fixed;
    right: 2.5rem; /* Etwas mehr Abstand zum rechten Bildschirmrand */
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.zeitstrahl-ticks-viewport {
    height: 250px;
    overflow: visible; /* Verhindert das Abschneiden beim Skalieren */
    position: relative;
    width: 140px; /* Feste Breite sorgt für exakte Ausrichtung */
}

/* Wichtig: Klasse heißt .zeitstrahl-ticks-track wie im HTML */
.zeitstrahl-ticks-track {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 38px; /* Größerer Abstand zwischen den Daten */
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: right;
}

:root {
    --bg-color: #f8f9fa;
    --text-color: #121212;

}

/* Automatic Dark Theme based on OS / Browser Preference */

    :root {

}
    /* Der Walzen-Stapel in der Bildschirmmitte */
    .timeline-stack {
        position: relative;
        top: 0%;
        left: 50%;
        transform: translate(-50%);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none; /* Verhindert Fehlklicks auf unsichtbare Bereiche */
    }

    .timeline-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh; /* Forces each row to take up full screen height */
        flex-shrink: 0;
        pointer-events: auto; /* Re-enables clicking on the rows and cards */
    }

    .timeline-item-container {
        display: flex;
        flex-direction: column;
        height: auto;
        max-height: 880px;
        aspect-ratio: 4 / 5;
        background: transparent;
        box-shadow: none;
    }

    .timeline-item-wrapper {
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .timeline-item-wrapper img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 85vh;
        object-fit: contain; /* Crucial: ensures the entire original image fits without cropping */
        display: block;
    }

    /* --- INFO VIEW --- */
    .info-view {
        min-height: 100vh;
        padding: 110px 2rem 4rem;
        background-color: var(--bg-color);
    }

    .info-content {
        width: 100%;
        max-width: 760px;
        margin: 10vh auto 0;
    }

    .info-eyebrow {
        margin-bottom: 1.25rem;
        color: var(--accent-red);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
    }

    .info-content h1 {

        font-weight: 700;
        letter-spacing: -0.04em;
    }

    .info-content p:not(.info-eyebrow) {
        max-width: 65ch;
        margin-bottom: 1.25rem;

    }

        .info-view {
            padding: 100px 1.25rem 3rem;

            margin-top: 6vh;
        }
    }

    /* --- CONTACT FORM STYLING --- */
    .contact-box {
        margin-top: 3rem;
        padding: 2rem;
        background-color: var(--card-bg);
        border: transparent;
        max-width: 760px;
    }

    .contact-box h3 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-color);
        margin-bottom: 1.5rem;
    }

    .styled-contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    }

    .styled-contact-form input,
    .styled-contact-form textarea {
        width: 100%;
        padding: 0.9rem 1rem;
        background-color: var(--bg-color);
        border: 1px solid var(--divider-color);

        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.3s ease;
    }

    .styled-contact-form input:focus,
    .styled-contact-form textarea:focus {
        border-color: var(--accent-red);
    }

    .contact-submit-btn {
        align-self: flex-start;
        padding: 0.8rem 2rem;
        background-color: var(--accent-red);
        color: #ffffff;
        border: none;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .contact-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    /* --- FULLSCREEN ZOOM OVERLAY LIGHTBOX --- */
    .overlay-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0a0a0a;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        overflow: hidden;
        cursor: pointer;
    }

    .overlay-backdrop.active {
        opacity: 1;
        visibility: visible;
    }

    .overlay-image-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: default;
        padding: 4rem 2rem;
    }

    .overlay-image-container img {
    max-height: 92vh;
    max-width: 90vw;
    object-fit: contain;
    cursor: grab;
    transform-origin: center center;
    transition: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

    .overlay-close-btn {
        position: fixed;
        top: 2rem;
        right: 2rem;
        z-index: 2006;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
    }

    .lightbox-info-group {
        position: fixed;
        bottom: 2.5rem;
        right: 2rem;
        display: flex;
        align-items: flex-end;
        gap: 1rem;
        z-index: 2005;
    }

    .overlay-close-btn .red-dot-btn {
        width: 18px;
        height: 18px;
        background-color: var(--accent-red);
        border-radius: 50%;
        transition: transform 0.3s ease;
    }

    .overlay-close-btn:hover .red-dot-btn {
        transform: scale(1.3);
    }

    /* LIGHTBOX RED LINE & EXPANDABLE DRAWER WRAPPER */
    .lightbox-info-group {

<script>
    const mainHeader = document.getElementById('mainHeader');

    // Mobile navigation applies to narrow screens AND to any touch-only device, regardless of
    // width (phones in "desktop site" mode, landscape, tablets). Touch devices have no real
    // hover, so the desktop hover/near-mouse menu must never run there.
    const mobileNavQuery = window.matchMedia('(max-width: 900px), (hover: none) and (pointer: coarse)');
    const isMobileNav = () => mobileNavQuery.matches;
    const navWrapper = document.getElementById('navWrapper');
    const backToTopBtn = document.getElementById('backToTopBtn');
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const overlayImage = document.getElementById('overlayImage');
    const overlayContainer = document.getElementById('overlayContainer');
    const overlayDrawer = document.getElementById('overlayDrawer');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerDesc = document.getElementById('drawerDesc');
    const zeitstrahlDot = document.getElementById('zeitstrahlDot');

    let lastScrollY = window.scrollY;

    const updateHeaderAndNavState = (scrollTop) => {
        const isTimelineView = document.getElementById('timelineView').classList.contains('active-view');

        // Keep the main header visible throughout the Timeline, as it is on the start page.
        // Other views retain the original scroll-away behavior.
        if (isTimelineView) {
            mainHeader.classList.remove('scrolled-away');
            document.body.classList.toggle('is-scrolled', scrollTop > 20);
        } else if (scrollTop > 20) {
            document.body.classList.add('is-scrolled');
            mainHeader.classList.add('scrolled-away');
        } else {
            mainHeader.classList.remove('scrolled-away');
            document.body.classList.remove('is-scrolled');
        }

        const isScrollingUp = scrollTop < lastScrollY;
        const scrollThreshold = 250;

        if (isScrollingUp && scrollTop > scrollThreshold) {
            backToTopBtn.classList.add('visible');
        } else {
            backToTopBtn.classList.remove('visible');
        }

        lastScrollY = scrollTop;
    };

    function setHeaderScrolledState(isScrolled) {
        if (isScrolled) {
            document.body.classList.add('is-scrolled');
            mainHeader.classList.add('scrolled-away');
        } else {
            mainHeader.classList.remove('scrolled-away');
            document.body.classList.remove('is-scrolled');
        }
    }
    window.addEventListener('scroll', () => updateHeaderAndNavState(window.scrollY));

    document.addEventListener('mousemove', (e) => {
        if (isMobileNav()) return;

        const rect = navWrapper.getBoundingClientRect();
        const distance = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
        
        if (distance < 90) {
            navWrapper.classList.add('near-mouse');
        } else {
            navWrapper.classList.remove('near-mouse');
        }
    });

    
function switchView(viewName, updateUrl = true) {
    const views = {
        gallery: "/gallery",
        timeline: "/timeline",
        info: "/info"
    };

    if (!views[viewName]) return;
    document.getElementById('navWrapper')
    .classList.remove('mobile-menu-active');
    if (typeof closeEventOverlay === 'function') closeEventOverlay();

<script>
  // Prüft leise, ob ein Bild existiert
  function checkImageExists(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  // Liest info.txt aus dem Ordner und verarbeitet individuelle Bild-Texte
  async function loadFolderInfo(folderName, basePath = '/collection') {
    const info = {
      title: folderName.toUpperCase(),
      subtitle: '',
      description: '',
      captions: {}
    };

    try {
      const response = await fetch(`${basePath}/${folderName}/info.txt`);
      // Manche Server liefern fuer fehlende Dateien die Startseite (HTML) mit Status 200 aus
      const contentType = response.headers.get('content-type') || '';
      if (response.ok && !contentType.includes('text/html')) {
        const text = await response.text();
        const lines = text.split('\n');

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;

          if (trimmed.toLowerCase().startsWith('title:')) {
            info.title = trimmed.replace(/title:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('subtitle:')) {
            info.subtitle = trimmed.replace(/subtitle:/i, '').trim();
          } else if (trimmed.toLowerCase().startsWith('description:')) {
            info.description = trimmed.replace(/description:/i, '').trim();
          } else {
            const match = trimmed.match(/^([a-zA-Z0-9]+)\s*:\s*(.+)$/);
            if (match) {
              const key = match[1].toLowerCase();
              const rawValue = match[2].trim();
              
              let title = rawValue;
              let desc = info.description;

              if (rawValue.includes(' — ')) {
                const parts = rawValue.split(' — ');
                title = parts[0].trim();
                desc = parts.slice(1).join(' — ').trim();
              } else if (rawValue.includes('|')) {
                const parts = rawValue.split('|');
                title = parts[0].trim();
                desc = parts[1].trim();
              }

              info.captions[key] = { title, description: desc };
            }
          }
        });
      }
    } catch (e) {
      // Keine info.txt vorhanden - Standardwerte greifen
    }

    return info;
  }

  // Scanned den Ordner nach Bildern & liest info.txt
  async function scanCollectionFolder(folderName, extensions = ['jpg', 'png', 'webp']) {
  const validImages = [];
  const info = await loadFolderInfo(folderName);

  async function findValidFile(baseName) {
    for (const ext of extensions) {
      const path = `./collection/${folderName}/${baseName}.${ext}`;
      const exists = await checkImageExists(path);
      if (exists) return path;
    }
    return null;
  }

  // Check for a main image
  const mainPath = await findValidFile('main');
  if (mainPath) {
    const mainMeta = info.captions['main'] || { title: info.title, description: info.description };
    validImages.push({
      src: mainPath,
      title: mainMeta.title,
      description: mainMeta.description,
      layout: 'hero'
    });
  }

  // Check pictures sequentially (1, 2, 3...) and STOP at the first missing one
  let index = 1;
  while (true) {
    const path = await findValidFile(index);
    if (!path) break; // Stops checking further pictures for this collection

    const numKey = index.toString();
    const imgMeta = info.captions[numKey] || { 
      title: `${info.title} — #${numKey}`, 
      description: info.description 
    };

    validImages.push({
      src: path,
      title: imgMeta.title,
      description: imgMeta.description,
      layout: index % 3 === 0 ? 'wide' : 'square'
    });

    index++;
  }

  return { images: validImages, info };
}

  const monthNamesGerman = {
    jan: 'Januar', januar: 'Januar', feb: 'Februar', februar: 'Februar',
    mar: 'März', maerz: 'März', apr: 'April', april: 'April',
    may: 'Mai', mai: 'Mai', jun: 'Juni', juni: 'Juni',
    jul: 'Juli', juli: 'Juli', aug: 'August', august: 'August',
    sep: 'September', september: 'September', oct: 'Oktober', okt: 'Oktober', oktober: 'Oktober',
    nov: 'November', november: 'November', dec: 'Dezember', dez: 'Dezember', dezember: 'Dezember'
  };

  const monthIndexMap = {
    januar: 0, jan: 0, februar: 1, feb: 1, märz: 2, maerz: 2, mar: 2,
    april: 3, apr: 3, mai: 4, may: 4, juni: 5, jun: 5, juli: 6, jul: 6,
    august: 7, aug: 7, september: 8, sep: 8, oktober: 9, okt: 9, oct: 9,
    november: 10, nov: 10, dezember: 11, dez: 11, dec: 11
  };

  function parseFilenameToMetadata(filename) {
    const baseName = filename.replace(/\.(jpg|jpeg|png|webp)$/i, '').trim();
    const parts = baseName.split(/[-_]+/).map(p => p.trim()).filter(Boolean);

    let parsedDateObj = new Date(0);
    let formattedDate = '';
    let location = '';
    let description = '';

    if (parts.length > 0) {
      const rawDateStr = parts[0];
      const dateMatch = rawDateStr.match(/^(\d{1,2})([a-zA-ZäöüÄÖÜ]+)(\d{2,4})$/) || rawDateStr.match(/^(\d{2})(\d{2})(\d{4})$/);

      if (dateMatch) {
        let day, rawMonth, year;
        if (dateMatch[2].match(/^\d+$/)) {
          day = parseInt(dateMatch[1], 10);
          const monthNum = parseInt(dateMatch[2], 10);
          const monthNamesArr = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
          rawMonth = monthNamesArr[monthNum - 1] || 'januar';
          year = parseInt(dateMatch[3], 10);
        } else {
          day = parseInt(dateMatch[1], 10);
          rawMonth = dateMatch[2].toLowerCase();
          year = parseInt(dateMatch[3], 10);
          if (year < 100) year += 2000;
        }

        const monthName = monthNamesGerman[rawMonth] || rawMonth;
        const monthIndex = monthIndexMap[rawMonth] !== undefined ? monthIndexMap[rawMonth] : 0;

        formattedDate = `${day}. ${monthName} ${year}`;
        parsedDateObj = new Date(year, monthIndex, day);
      } else {
        formattedDate = rawDateStr;
      }
    }

    if (parts.length === 2) {
      location = parts[1];
    } else if (parts.length >= 3) {
      location = parts[1];
      description = parts.slice(2).join(' ');
    }

    const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

    return {
      dateText: formattedDate,
      location: capitalize(location),
      description: capitalize(description),
      dateObj: parsedDateObj
    };
  }

  // ==========================================

    const zeitstrahlDot = document.getElementById('zeitstrahlDot');

    if (rows.length === 0) return;

    // Center image stack
    const offsetY = -(currentTimelineIndex * window.innerHeight);
    stack.style.transform = `translateX(-50%) translateY(${offsetY}px)`;

    // Center mini-slider thumbnails
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const thumbHeight = 54; // 48px + 6px gap
    const thumbOffsetY = -(currentTimelineIndex * thumbHeight);
    if (miniSliderTrack) {
      miniSliderTrack.style.transform = `translateY(calc(50% - 27px + ${thumbOffsetY}px))`;
    }
      
    // Center date ticks perfectly in the 250px viewport
    const ticksTrack = document.getElementById('zeitstrahlTicks');
    const itemHeight = 18; // Height of each tick item
    const gap = 38;        // Must match the CSS gap above
    const tickHeight = itemHeight + gap; 
    const viewportCenter = 125; // Half of the 250px viewport height
    
    // Calculates exact offset to keep active tick dead-center
    const tickOffsetY = viewportCenter - (itemHeight / 2) - (currentTimelineIndex * tickHeight);
    
    if (ticksTrack) {
      ticksTrack.style.transform = `translateY(${tickOffsetY}px)`;
    }

    rows.forEach((r, idx) => r.classList.toggle('active-center', idx === currentTimelineIndex));
    ticks.forEach((t, idx) => t.classList.toggle('active', idx === currentTimelineIndex));
    thumbs.forEach((m, idx) => m.classList.toggle('active', idx === currentTimelineIndex));

    if (zeitstrahlDot && rows.length > 1) {

}

  // ==========================================

  // ==========================================
  const TIMELINE_IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp'];
  let timelineSuppressClickUntil = 0; // verhindert den "Geister-Klick" direkt nach einer Wischgeste

  function isTimelineOverlayOpen() {
    const ev = document.getElementById('eventOverlay');

    return !!((ev && ev.classList.contains('active')) || (lb && lb.classList.contains('active')));

  function resolveTimelineEntry(entry) {
    const clean = String(entry || '').trim().replace(/^\.?\/+/, '').replace(/\/+$/, '');
    if (!clean) return null;
    const isImage = /\.(jpg|jpeg|png|webp)$/i.test(clean);
    if (isImage && !clean.includes('/')) return { type: 'file', name: clean };
    return { type: 'folder', name: clean.split('/')[0] };
  }

  async function findTimelineImage(folder, baseName) {
    const results = await Promise.all(TIMELINE_IMAGE_EXTENSIONS.map(async (ext) => {
      const path = `./timeline/${folder}/${baseName}.${ext}`;
      return (await checkImageExists(path)) ? path : null;
    }));
    return results.find(Boolean) || null;
  }

  async function buildTimelineEvent(folder) {
    const info = await loadFolderInfo(folder, './timeline');
    const meta = parseFilenameToMetadata(folder);

    const files = [];
    const mainPath = await findTimelineImage(folder, 'main');
    if (mainPath) files.push({ src: mainPath, key: 'main' });

    // 1, 2, 3 ... bis zum ersten fehlenden Bild (wie bei den Collections)
    for (let n = 1; ; n++) {
      const path = await findTimelineImage(folder, n);
      if (!path) break;
      files.push({ src: path, key: String(n) });
    }

    if (files.length === 0) {
      console.warn(`Timeline-Ordner "${folder}" enthaelt keine Bilder (main.jpg, 1.jpg, ...)`);
      return null;
    }

    const hasExplicitTitle = info.title !== folder.toUpperCase();
    const eventTitle = hasExplicitTitle ? info.title : (meta.location || meta.dateText);

    const images = files.map((file, i) => {
      const caption = info.captions[file.key];
      const fallbackTitle = i === 0 ? eventTitle : `${eventTitle} — #${file.key}`;
      return {
        src: file.src,
        title: caption ? caption.title : fallbackTitle,
        description: (caption && caption.description) || description
      };
    });

    return {
      src: images[0].src,
      dateText: meta.dateText,
      location: meta.location || (hasExplicitTitle ? info.title : ''),
      description,
      dateObj: meta.dateObj,
      isCollection: true,
      folder,
      eventTitle,
      images

      text.className = 'event-desc-text';
      text.textContent = item.description;
      block.appendChild(text);

      grid.appendChild(block);
    }

    others.forEach((imgData) => {
      const card = document.createElement('div');
      card.className = 'gallery-item';
      const frame = document.createElement('div');
      frame.className = 'image-wrapper';
      const img = document.createElement('img');
      img.src = imgData.src;
      img.alt = imgData.title;
      img.loading = 'lazy';
      frame.appendChild(img);
      frame.addEventListener('click', () => openLightbox(imgData.src, imgData.title, imgData.description));
      card.appendChild(frame);
      grid.appendChild(card);
    });

    host.appendChild(grid);

    scroller.scrollTop = 0;
    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
  }

  function closeEventOverlay() {
    const overlay = document.getElementById('eventOverlay');
    if (!overlay) return;
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
  }

  // Esc schliesst zuerst die Lightbox, danach die Event-Ansicht
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const lb = document.getElementById('lightboxOverlay');
    if (lb && lb.classList.contains('active')) {
      closeLightbox();
    } else {
      closeEventOverlay();
    }
  });

  async function loadTimelineAutomatically() {
    const timelineStack = document.getElementById('timelineStack');
    const miniSliderTrack = document.getElementById('miniSliderTrack');
    const zeitstrahlTicks = document.getElementById('zeitstrahlTicks');
    
    if (!timelineStack) return;

    timelineStack.innerHTML = '';
    if (miniSliderTrack) miniSliderTrack.innerHTML = '';
    zeitstrahlTicks.innerHTML = '';

    timelineItemsGlobal = [];

    try {
      const response = await fetch('./timeline/timeline.json');
      if (!response.ok) return;
      const candidateFiles = await response.json();

      // Eintraege sind Bilddateien ODER Ordner (siehe Kommentar oben); doppelte Eintraege werden ignoriert
      const seen = new Set();
      const built = await Promise.all(candidateFiles.map(async (entry) => {
        const resolved = resolveTimelineEntry(entry);
        if (!resolved) return null;
        const key = resolved.type + ':' + resolved.name;
        if (seen.has(key)) return null;
        seen.add(key);

        if (resolved.type === 'file') {
          const meta = parseFilenameToMetadata(resolved.name);
          return { src: `./timeline/${resolved.name}`, ...meta };
        }
        return await buildTimelineEvent(resolved.name);
      }));
      built.filter(Boolean).forEach((item) => timelineItemsGlobal.push(item));

      timelineItemsGlobal.sort((a, b) => b.dateObj - a.dateObj);
      if (timelineItemsGlobal.length === 0) return;

      timelineItemsGlobal.forEach((item, idx) => {
        let badgeText = item.dateText;
        if (item.location) badgeText += ` — ${item.location}`;

        const row = document.createElement('div');
        row.className = 'timeline-row' + (idx === 0 ? ' active-center' : '');
        row.id = `t-row-${idx}`;
        // Klick auf die gesamte aktive Zeile öffnet direkt die Lightbox des aktuellen Eintrags
        row.onclick = () => {
          if (performance.now() < timelineSuppressClickUntil) return; // Klick direkt nach einer Wischgeste ignorieren
          if (idx === currentTimelineIndex) {
            openCurrentTimelineLightbox();
          } else {
            scrollToRow(idx);
          }
        };

        const badge = document.createElement('div');
        badge.className = 'timeline-date-badge';
        badge.textContent = badgeText;
        // Ordner-Event mit weiteren Bildern: kleiner Hinweis "+N"
        if (item.isCollection && item.images.length > 1) {
          const tag = document.createElement('span');
          tag.className = 'timeline-multi-tag';
          tag.textContent = `+${item.images.length - 1}`;
          badge.appendChild(tag);
        }
        row.appendChild(badge);

        const container = document.createElement('div');
        container.className = 'timeline-item-container';

        const wrapper = document.createElement('div');
        wrapper.className = 'timeline-item-wrapper';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.location || item.dateText;
        img.loading = 'lazy';
        wrapper.appendChild(img);

        container.appendChild(wrapper);
        row.appendChild(container);
        timelineStack.appendChild(row);

        const thumb = document.createElement('img');
        thumb.src = item.src;
        thumb.className = 'mini-thumb' + (idx === 0 ? ' active' : '');
        thumb.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        if (miniSliderTrack) miniSliderTrack.appendChild(thumb);

        const tick = document.createElement('span');
        tick.className = 'zeitstrahl-tick' + (idx === 0 ? ' active' : '');
        tick.textContent = item.dateText;
        tick.onclick = (e) => {
          e.stopPropagation();
          scrollToRow(idx);
        };
        zeitstrahlTicks.appendChild(tick);
      });

      updateTimelineWheel(0);

    } catch (error) {
      console.error("Fehler beim Laden der Timeline:", error);
    }
  }

  // Initialer Aufruf beider Lade-Funktionen
  loadCollectionsAutomatically();
  loadTimelineAutomatically();
  // Saubere Touch-Swipe-Steuerung für die Timeline auf Mobilgeräten
let touchStartY = 0;
let touchEndY = 0;
let touchMoved = false;
const timelineViewEl = document.getElementById('timelineView');

if (timelineViewEl) {
    timelineViewEl.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        // FIX: Endwert zuruecksetzen. Vorher blieb der Wert der letzten Geste stehen (anfangs 0),
        // dadurch wurde ein einfaches Antippen manchmal als Wischen gewertet und oeffnete nichts.
        touchEndY = touchStartY;
        touchMoved = false;
    }, { passive: true });

    timelineViewEl.addEventListener('touchmove', (e) => {
        touchEndY = e.touches[0].clientY;
        touchMoved = true;
    }, { passive: true });

    timelineViewEl.addEventListener('touchend', () => {
        if (!timelineViewEl.classList.contains('active-view')) return;
        
        let diffY = touchStartY - touchEndY;

        // Nur wenn der Finger wirklich bewegt wurde und die Wischbewegung größer als 30 Pixel ist
        if (touchMoved && Math.abs(diffY) > 30) {
            timelineSuppressClickUntil = performance.now() + 400; // der folgende Klick gehoert zur Geste
            if (diffY > 0) {
                // Nach oben wischen -> Nächstes Bild
                targetTimelineIndex = Math.min(targetTimelineIndex + 1, timelineItemsGlobal.length - 1);
            } else {
                // Nach unten wischen -> Vorheriges Bild
                targetTimelineIndex = Math.max(targetTimelineIndex - 1, 0);
            }
            updateTimelineWheel(targetTimelineIndex);
        }
    }, { passive: true });
}
// Toggle Fullscreen Mobile Menu on Click
const navWrapperElement = document.getElementById('navWrapper');
const menuToggleBtnElement = document.getElementById('menuToggleBtn');

menuToggleBtnElement.addEventListener('click', (e) => {
    if (isMobileNav()) {
        e.stopPropagation();
        navWrapperElement.classList.toggle('mobile-menu-active');
    }
});

// Close button inside the mobile fullscreen overlay
const mobileMenuCloseBtn = document.getElementById('mobileMenuCloseBtn');
if (mobileMenuCloseBtn) {
    mobileMenuCloseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navWrapperElement.classList.remove('mobile-menu-active');
    });
}

// Close the mobile menu automatically when a navigation link is tapped
document.querySelectorAll('.banner-menu-popup a, .flyout-menu a').forEach(link => {
    link.addEventListener('click', () => {
        if (isMobileNav()) {
            navWrapperElement.classList.remove('mobile-menu-active');
        }
    });
});
</script>
