    <title>NENA NETWORK – Galerie & Zeitstrahl</title>
    <link rel="icon" type="image/png" href="/assets/icon.png">

    <style>

    /* Schrift fuer den grossen Kuenstlernamen: Anton (SIL Open Font License, liegt in assets/fonts/) */
    @font-face {
        font-family: "Anton";
        src: url("/assets/fonts/anton.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block; /* Name erscheint erst, wenn die Schrift da ist (kein Aufblitzen in falscher Schrift) */
    }

    /* --- CUSTOM TRANSPARENT AUTO-HIDING SCROLLBAR --- */
    ::-webkit-scrollbar {
        width: 6px;
    }

    /* Fully transparent track background */
    ::-webkit-scrollbar-track {
        background: transparent;
    }

    /* Removes top and bottom arrow/triangle buttons */
    ::-webkit-scrollbar-button {
        display: none;
        height: 0;
        width: 0;
    }

    /* The draggable scrollbar thumb */
    ::-webkit-scrollbar-thumb {
        background-color: var(--divider-color);
        border-radius: 3px;
        opacity: 0; /* Hidden by default */
        transition: opacity 0.4s ease;
    }

    /* When scrolling, make the scrollbar thumb visible */
    body.is-user-scrolling::-webkit-scrollbar-thumb {
        opacity: 1;
    }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* No blue tap flash / selection highlight on touch devices */
        html, body, * {
            -webkit-tap-highlight-color: transparent;
        }

        img,
        .image-wrapper,
        .timeline-item-wrapper,
        .mini-thumb,
        .overlay-backdrop,
        .overlay-backdrop *,
        .event-overlay,
        .event-overlay .event-close-btn {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        img::selection,
        .overlay-backdrop *::selection {
            background: transparent;
        }

        img {
            -webkit-user-drag: none;
        }
/* Default Light Theme */
:root {
    --bg-color: #f8f9fa;
    --text-color: #121212;
    --accent-red: #990f02;
    --banner-bg: #f8f9fa;
    --banner-text: #121212;
    --divider-color: #e0e0e0;
    --subtext-color: #888888; /* Softer, lighter grey for light mode */
}

/* Automatic Dark Theme based on OS / Browser Preference */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #0f0f0f;
        --text-color: #f0f0f0;
        --accent-red: #990f02;
        --banner-bg: #0f0f0f;
        --banner-text: #ffffff;
        --divider-color: #333333;
        --subtext-color: #888888; /* Balanced soft grey for dark mode */
    }
}

/* Timeline Ticks Styling */
.zeitstrahl-tick {
    font-size: 0.65rem;
    color: var(--subtext-color); /* Uses the soft grey */
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s, transform 0.3s, opacity 0.3s;
    opacity: 0.5; /* Slightly increased visibility for the soft grey */
    white-space: nowrap;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    transform-origin: right center;
}

/* Active and Hovered Ticks turn RED */
.zeitstrahl-tick.active, 
.zeitstrahl-tick:hover {
    color: var(--accent-red) !important; /* Forces active & hovered state to red */
    font-weight: 700;
    opacity: 1;
    transform: scale(1.15);
}
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    /* 1. TOP BANNER */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: transparent;
        color: var(--banner-text);
        display: flex;
        align-items: center;
        padding: 0 2rem;
        z-index: 1000;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    header.scrolled-away {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
    }

    .title-text {
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--banner-text);
    }

    .title-text span {
        color: var(--accent-red);
    }

    /* 2. NAVIGATION CONTAINER */
    /* One source of truth for the menu point so it sits in the exact same spot in every state
       (closed, scrolled, fullscreen menu open). */
    :root {
        --nav-dot: 18px;
        --nav-dot-right: 2rem;
    }

    .nav-wrapper {
        position: fixed;
        top: 0;
        right: var(--nav-dot-right); /* Matches your header padding */
        height: 60px; /* Matches the header height */
        z-index: 1002;
        display: flex;
        align-items: center; /* Centers the point vertically with the header contents */
        pointer-events: auto;
    }

    .menu-hitbox {
        padding: 15px;
        margin: -15px;
        cursor: pointer;
        touch-action: manipulation;
    }

    .menu-toggle-btn {
        position: relative;
        width: 28px;
        height: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-toggle-btn span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: var(--accent-red);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: center;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px;
        height: 18px;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(1),
    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(3),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
    }

    body:not(.is-scrolled) .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body:not(.is-scrolled) .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 4px;
        height: 100%;
        border-radius: 0;
    }

    body.is-scrolled .menu-toggle-btn {
        width: 18px;
        height: 18px;
    }

    body.is-scrolled .menu-toggle-btn span {
        background-color: var(--accent-red);
        border-radius: 50%;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(1),
    body.is-scrolled .menu-toggle-btn span:nth-child(3) {
        opacity: 0;
        transform: scale(0);
        display: none;
    }

    body.is-scrolled .menu-toggle-btn span:nth-child(2) {
        width: 18px !important; /* Matched to 18px */
        height: 18px !important; /* Matched to 18px */
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* REMOVE OR REPLACE THESE TWO BLOCKS WHICH CAUSED THE LINE MORPH ON SCROLL */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        height: 8px !important;
        width: 8px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span:nth-child(2),
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span:nth-child(2) {
        width: 8px !important;
        height: 8px !important;
        border-radius: 50% !important;
        background-color: var(--accent-red) !important;
    }

    /* 3. MENU POPUP (Top State - Single-line horizontal flyout) */
    .banner-menu-popup {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        background-color: transparent;
        padding: 0;
        min-width: auto;
        display: flex;
        flex-direction: row; /* Arranges items in a single line */
        gap: 1.5rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        z-index: 1003;
        box-shadow: none;
        border: none; /* Removes background box & red border */
        white-space: nowrap;
    }

    body:not(.is-scrolled) .nav-wrapper:hover .banner-menu-popup,
    body:not(.is-scrolled) .nav-wrapper.near-mouse .banner-menu-popup {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(-10px); /* Slides horizontally into position */
    }

    .banner-menu-popup a {
        color: var(--banner-text);
        text-decoration: none;
        font-size: 0.95rem; /* Matches .title-text font size */
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: color 0.2s, transform 0.2s;
        cursor: pointer;
    }

    /* gleiche Zeilenhoehe wie die Sortier-Optionen, damit alle Abstaende gleich aussehen */
    .banner-menu-popup > a,
    .banner-menu-popup > div > a {
        line-height: 1.2;
    }

    /* Menuepunkte genau auf der Hoehe des Titels (mittig), nicht oben in der Zeile */
    .banner-menu-popup {
        align-items: center;
    }

    /* "Kuenstler" steckt in einem eigenen Block: als Block darstellen, damit es auf einer Linie mit den anderen steht */
    .banner-menu-popup > .menu-artists > a {
        display: block;
    }

    .banner-menu-popup a:hover {
        color: var(--accent-red);
        transform: translateY(-2px); /* Subtle hover lift */
    }

    /* 4. FLYOUT MENU */
    .flyout-menu {
        position: absolute;
        right: 0rem;
        font-size: 1.9rem;
        line-height: 1.2;
        top: 100%;
        transform: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        text-align: right;
        pointer-events: none;
        z-index: 1000;
        overflow: visible;
        padding-right: 15px;
    }

    .flyout-menu a {
        /* Text is painted by a two-color gradient: red on the right half, menu color on the left.
           Sliding the gradient (background-position) wipes the text from red to the menu color. */
        color: transparent;
        /* 300% wide: the visible window is the left third (pure menu color) at the end and the
           right third (pure red) at the start, so no red tint is left at the end of the wipe */
        background-image: linear-gradient(90deg, var(--banner-text) 0%, var(--banner-text) 46%, var(--accent-red) 54%, var(--accent-red) 100%);
        background-size: 300% 100%;
        background-position: 100% 0; /* fully red */
        -webkit-background-clip: text;
        background-clip: text;
        text-decoration: none;
        font-size: 1em; /* sized by .flyout-menu */
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, background-position 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    /* Schwarze Kopie der Menueschrift, nach links unten versetzt (harter Schatten ohne Unschaerfe).
       --flyout-shadow = wie weit die Kopie versetzt ist. Der rote Pfeil bekommt keinen Schatten. */
    .flyout-menu {
        --flyout-shadow: 0.045em;
    }
    .flyout-menu a:not(.sort-trigger) {
        filter: drop-shadow(calc(var(--flyout-shadow) * -1) var(--flyout-shadow) 0 #000);
    }

    /* Sortier-Dropdown oben: gleicher Look wie das gescrollte Menue (duenne schwarze Kopie links unten) */
    .banner-menu-popup .sort-submenu {
        --flyout-shadow: 0.085em; /* bei der kleineren Schrift oben gleich duenn wie im gescrollten Menue */
    }
    .banner-menu-popup .sort-submenu a {
        filter: drop-shadow(calc(var(--flyout-shadow) * -1) var(--flyout-shadow) 0 #000);
    }

    /* Hide the red dot on hover/near-mouse when scrolled, making space for the text */
    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn {
        width: 0px !important;
        height: 18px !important;
    }

    body.is-scrolled .nav-wrapper:hover .menu-toggle-btn span,
    body.is-scrolled .nav-wrapper.near-mouse .menu-toggle-btn span {
        opacity: 0 !important;
        transform: scale(0) !important;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu {
        pointer-events: auto;
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a,
    body.is-scrolled .nav-wrapper.near-mouse .flyout-menu a {
        opacity: 1;
        transform: translateX(0);
        background-position: 0 0; /* wipes from red to the menu color, left to right */
    }

    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(1) { transition-delay: 0.05s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(2) { transition-delay: 0.10s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu a:nth-child(3) { transition-delay: 0.15s; }

    .flyout-menu a:hover {
        transform: translateX(-8px) !important;
    }

    /* VIEWS MANAGEMENT */
    .view-section {
        display: none;
        width: 100vw;
        min-height: 100vh;
    }

    .view-section.active-view {
        display: block;
    }

    /* --- GALLERY / Galerie VIEW --- */
    #galleryView {
        padding-bottom: 2rem;
    }

    .collection-wrapper {
        width: 100vw;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 2rem;
        padding: 60px 2rem 2rem 2rem;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .hero-item {
        position: sticky;
        top: 80px;
        height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
    }

    .hero-item .image-wrapper {
        flex: 1;
        width: 100%;
        overflow: hidden;
        background: transparent; /* Removes the grey/dark background box */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Texte einer Collection (Zeile unter dem Hauptbild, Beschreibung, grosser Name) erscheinen erst,
       wenn das Hauptbild geladen ist */
    #dynamicGallery .collection-wrapper .single-line-label,
    #dynamicGallery .collection-wrapper .gallery-desc-tile,
    #dynamicGallery .collection-wrapper .hero-artist-big {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.35s ease;
    }
    #dynamicGallery .collection-wrapper.hero-ready .single-line-label,
    #dynamicGallery .collection-wrapper.hero-ready .gallery-desc-tile,
    #dynamicGallery .collection-wrapper.hero-ready .hero-artist-big {
        visibility: visible;
        opacity: 1;
    }

    .single-line-label {
        margin-top: 6px;
        font-size: 0.65rem;
        color: #888;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .single-line-label strong {
        color: #ddd;
        font-weight: 600;
        text-transform: uppercase;
        flex-shrink: 0;
    }

    .single-line-label .label-subtitle {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
    }

    /* Galerie-Hauptbild: Bild unten links im Rahmen, nie abgeschnitten.
       So sitzt die Beschreibung direkt darunter und der rote Name direkt auf dem Bild. */

    /* Langer Beschreibungstext als eigene Kachel zwischen den Nebenbildern */
    .gallery-desc-tile {
        break-inside: avoid;
        padding-bottom: 20px; /* Abstand bleibt auch am Spaltenende erhalten */
    }

    /* Beschreibung: schlichter Text in derselben Farbe wie Untertitel/Datum unter dem Hauptbild,
       ohne Rahmen und ohne rote Linie, alles klein geschrieben */
    .gallery-desc-inner {
        padding: 0;
        border: none;
        color: #888;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        line-height: 1.7;
        text-transform: lowercase;
        white-space: pre-line;
        overflow-wrap: anywhere;
    }


    /* Bild + Beschreibung als ein Block. Vor dem Scrollen direkt unter dem Titel,
       beim Scrollen gleitet der Block in die Bildschirmmitte. */
    .hero-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: center; /* waagrecht mittig in der linken Spalte */
        max-width: 100%;
        flex: none;
        min-height: 0;
        transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.is-scrolled .hero-stack {
        transform: translateY(var(--center-offset, 0px));
    }

    /* Hauptbild beginnt auf derselben Hoehe wie die Bilder rechts (direkt unter dem Titel) */
    @media (min-width: 901px) {
        .hero-item.gallery-hero-item {
            top: 60px;
            height: calc(100vh - 80px);
        }
    }

    .hero-item .image-wrapper.gallery-hero {
        flex: none;
        width: auto;
        max-width: 100%;
        align-items: flex-start;
        justify-content: flex-start;
    }

    .hero-item .image-wrapper.gallery-hero img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100vh - 130px); /* Platz fuer die Beschreibung darunter */
    }

    /* Mobil: Hauptbild-Box nur so hoch wie das Bild (keine Leerflaeche ueber breiten Bildern) */
    @media (max-width: 900px) {
        .hero-item.gallery-hero-item {
            height: auto;
        }
        .hero-item .image-wrapper.gallery-hero img {
            max-height: 70vh;
        }
        body.is-scrolled .hero-stack {
            transform: none; /* mobil scrollt das Hauptbild normal mit */
        }
    }

    /* Grosser Kuenstlername auf dem Hauptbild: leuchtet rot auf,
       dann verschwinden die Buchstaben langsam vom letzten zum ersten */
    .hero-artist-big {
        --name-stretch: 2.6;            /* so stark wird der Name in die Breite gezogen */
        --name-overflow-x: 0.06;        /* so viel breiter als das Bild (wird links und rechts abgeschnitten) */
        --name-sink: 0.012;             /* Buchstaben sitzen genau auf der Unterkante (winzig darueber hinaus, damit nie ein Spalt bleibt) */
        position: absolute;
        left: 0;                        /* genau an den Bildrand; die Feinposition rechnet das Script */
        bottom: 0;
        z-index: 2;
        pointer-events: none;
        font-family: "Anton", Impact, "Arial Narrow", sans-serif;
        font-size: clamp(2.6rem, 6vw, 5.5rem);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1;
        text-transform: uppercase;
        color: var(--accent-red);
        white-space: nowrap;
        transform: scaleX(var(--name-stretch));
        transform-origin: left bottom;
        opacity: 1;
    }

    /* Zeiten der Namens-Animation in drei gleichen Teilen: weiss -> rot -> verschwinden.
       --name-phase = Laenge eines Drittels
       --name-sweep = wie lange das Rotwerden bzw. Verschwinden ueber alle Buchstaben dauert,
                      egal wie viele Buchstaben der Name hat */
    :root {
        --name-phase: 0.75s;
        --name-red: calc(var(--name-phase) * 1.33); /* rote Phase 33 % laenger */
        --name-sweep: 0.4s;
    }

    .hero-artist-big span {
        display: inline-block;
        opacity: 0;
    }

    .hero-artist-big.play span {
        /* sofort da, ganz rot; dann schlagartig weg, Buchstabe fuer Buchstabe von rechts nach links */
        opacity: 1;
        animation: heroLetterOut 1ms linear forwards;
        animation-delay: calc(var(--name-phase) + var(--name-red) + var(--r) * var(--name-sweep) / var(--n));
    }

    @keyframes heroLetterRed {
        to { color: var(--accent-red); }
    }

    /* Gleicher Kuenstler wie die Collection davor: kein grosser Name, keine Animation */
    .repeat-artist .hero-artist-big {
        display: none;
    }
    .repeat-artist .label-artist.play span {
        animation: none;
    }

    /* Kleiner Name unter dem Bild: wird im selben Takt rot, aber von links nach rechts.
       Buchstabe i wird rot, waehrend oben der i-te Buchstabe von rechts verschwindet. */
    .label-artist span {
        transition: none;
    }

    /* Zuerst leuchtet er in der Textfarbe auf (hell: schwarz, dunkel: weiss), dann wird er rot */
    .label-artist.play span {
        animation:
            labelLetterLight 0.45s ease-out forwards,
            labelLetterRed 1ms linear forwards;
        animation-delay: 0s, calc(var(--name-phase) + var(--name-red) + var(--i) * var(--name-sweep) / var(--n));
    }

    @keyframes labelLetterLight {
        to { color: var(--text-color); }
    }

    @keyframes labelLetterRed {
        from { color: var(--text-color); }
        to   { color: var(--accent-red); }
    }

    @keyframes heroLetterIn {
        from { opacity: 0; text-shadow: none; }
        to   { opacity: 1; }
    }

    @keyframes heroLetterOut {
        from { opacity: 1; }
        to   { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .hero-artist-big.play span {
            animation: heroLetterOut 1ms calc(var(--name-phase) + var(--name-red)) forwards;
        }
    }

    /* Kuenstlername ganz rechts unter dem Hauptbild */
    /* ===== LIKE (ganze Collection) neben dem Kuenstlernamen =====
       vor dem eigenen Like: rotes Umriss-Herz, keine Zahl; danach: gefuelltes rotes Herz + Anzahl in Rot */
    .like-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35em;
        margin-left: 0.6em;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent-red);       /* Herz immer rot */
        font: inherit;
        letter-spacing: 0.08em;
        cursor: pointer;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
    }
    .like-btn[hidden] { display: none; }
    .like-btn svg {
        width: 1em;                     /* gleich gross wie die Schrift daneben */
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        transition: transform 0.2s ease;
    }
    .like-btn.liked svg { fill: var(--accent-red); stroke: var(--accent-red); }
    .like-btn .like-count { color: var(--accent-red); }
    .like-btn:not(.liked) .like-count { display: none; }
    .like-btn.pop svg { transform: scale(1.3); }

    /* ===== BESUCHER HEUTE (unten auf der Seite) ===== */
    .visit-counter {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 2.5rem 1rem 2rem;
        color: #888;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
    }
    .visit-counter[hidden] { display: none; }
    .visit-counter svg {
        width: 1.2em;
        height: 1.2em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
    }

    .single-line-label .label-artist {
        margin-left: auto;
        padding-left: 1rem;
        flex-shrink: 0;
    }

    /* Zwei Spalten, die das Script selbst fuellt (jedes Bild in die gerade kuerzere Spalte).
       "dc"-Bilder und "desc: 2" stehen am Desktop dazwischen ueber die volle Breite. */
    .grid-right {
        display: block;
    }

    .gr-row {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }

    .gr-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    /* Platzhalter, solange ein Bild noch laedt (damit die Spalten schon ungefaehr stimmen) */
    .gallery-item.pending .image-wrapper {
        aspect-ratio: 1;
    }

    .gallery-item {
        break-inside: avoid;
        /* Abstand als padding statt margin: bleibt auch am Spaltenende vor einem doppelt breiten Bild erhalten */
        margin-bottom: 0;
        padding-bottom: 20px;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .image-wrapper {
        width: 100%;
        overflow: hidden;
        background: var(--bg-color); /* solange das Bild laedt: einfach Seitenfarbe (schwarz/weiss) */
        cursor: pointer;
        position: relative;
    }

    .image-wrapper img {
        width: 100%;
        height: auto; /* Crucial: maintains original aspect ratio perfectly without cropping */
        display: block;
        object-fit: unset;
    }

    /* --- TIMELINE VIEW (Uhren-Mechanik / Walze) --- */
    .timeline-view {
        display: none;
        height: 100vh;
        overflow: hidden;
        position: relative;
        width: 100vw;
        box-sizing: border-box;
        background-color: var(--bg-color);
    }

    .timeline-view.active-view {
        display: block;
    }

    /* Mini-Thumbnail-Leiste als synchrone Walze */
    .timeline-mini-slider {
        position: fixed;
        left: 2rem;
        top: 50%;
        transform: translateY(-50%);
        max-height: 80vh; /* Allows it to grow based on content */
        overflow: hidden;  /* Hides scrollbars while staying functional */
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: transparent;
        padding: 4px;
        border: none;
        z-index: 20;
        pointer-events: auto;
    }

    /* Der innere Container, der sich analog mitbewegt */
    .mini-slider-track {
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mini-thumb {
        width: 36px;
        height: 48px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.6;
        border: none;
        transition: all 0.3s ease;
    }

    .mini-thumb:hover {
        opacity: 0.7;
    }

    .mini-thumb.active {
        opacity: 1;
        border: 1px solid var(--accent-red); /* Dezenter roter Rahmen für das aktive Mini-Bild */
    }

    /* Zeitstrahl-Track */
    .zeitstrahl-track {
        position: relative;
        width: 1px;
        height: 100%;
        background-color: #333;
    }
    /* .zeitstrahl-dot wurde entfernt, damit ist der Punkt weg */

    /* Rechter Zeitstrahl-Navigationsbereich */
.zeitstrahl-nav {
    position: fixed;
    right: 2.5rem; /* Etwas mehr Abstand zum rechten Bildschirmrand */
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.zeitstrahl-ticks-viewport {
    height: 250px;
    overflow: visible; /* Verhindert das Abschneiden beim Skalieren */
    position: relative;
    width: 140px; /* Feste Breite sorgt für exakte Ausrichtung */
}

/* Wichtig: Klasse heißt .zeitstrahl-ticks-track wie im HTML */
.zeitstrahl-ticks-track {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 38px; /* Größerer Abstand zwischen den Daten */
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: right;
}

/* Default Light Theme */
:root {
    --bg-color: #f8f9fa;
    --text-color: #121212;
    --accent-red: #990f02;
    --banner-bg: #f8f9fa;
    --banner-text: #121212;
    --divider-color: #e0e0e0;
    --subtext-color: #666666;
    --active-text-color: #888888; /* Dark text in light mode */
}

/* Automatic Dark Theme based on OS / Browser Preference */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #0f0f0f;
        --text-color: #f0f0f0;
        --accent-red: #990f02;
        --banner-bg: #0f0f0f;
        --banner-text: #ffffff;
        --divider-color: #333333;
        --subtext-color: #888888;
        --active-text-color: #ffffff; /* White text in dark mode */
    }
}
    /* Der Walzen-Stapel in der Bildschirmmitte */
    .timeline-stack {
        position: relative;
        top: 0%;
        left: 50%;
        transform: translate(-50%);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none; /* Verhindert Fehlklicks auf unsichtbare Bereiche */
    }

    .timeline-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh; /* Forces each row to take up full screen height */
        flex-shrink: 0;
        pointer-events: auto; /* Re-enables clicking on the rows and cards */
    }

    /* Kein festes Seitenverhaeltnis / keine Hoehen-Grenze mehr: vorher wurde die Titelzeile
       oben abgeschnitten, sobald Bild + Titel hoeher als der Rahmen waren */
    .timeline-item-container {
        display: flex;
        flex-direction: column;
        height: auto;
        background: transparent;
        box-shadow: none;
    }

    .timeline-item-wrapper {
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: relative;
        overflow: visible;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .timeline-item-wrapper img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: min(calc(85vh - 4.5rem), 860px); /* Platz fuer die Titel-/Kuenstler-Zeile darueber (bis zu 2 Zeilen) */
        object-fit: contain; /* Crucial: ensures the entire original image fits without cropping */
        display: block;
    }

    /* --- INFO VIEW --- */
    .info-view {
        min-height: 100vh;
        padding: 110px 2rem 4rem;
        background-color: var(--bg-color);
    }

    .info-content {
        width: 100%;
        max-width: 760px;
        margin: 10vh auto 0;
    }

    .info-eyebrow {
        margin-bottom: 1.25rem;
        color: var(--accent-red);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
    }

    .info-content h1 {
        margin-bottom: 2rem;
        color: var(--text-color);
        font-size: clamp(2.5rem, 7vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
    }

    .info-content p:not(.info-eyebrow) {
        max-width: 65ch;
        margin-bottom: 1.25rem;
        color: var(--subtext-color); /* Updated to use theme variable */
        font-size: 1rem;
        line-height: 1.8;
    }

    @media (max-width: 600px) {
        .info-view {
            padding: 100px 1.25rem 3rem;
        }

        .info-content {
            margin-top: 6vh;
        }
    }

    /* --- CONTACT FORM STYLING --- */
    .contact-box {
        margin-top: 3rem;
        padding: 2rem;
        background-color: var(--card-bg);
        border: transparent;
        max-width: 760px;
    }

    .contact-box h3 {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-color);
        margin-bottom: 1.5rem;
    }

    .styled-contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    }

    .styled-contact-form input,
    .styled-contact-form textarea {
        width: 100%;
        padding: 0.9rem 1rem;
        background-color: var(--bg-color);
        border: 1px solid var(--divider-color);
        color: var(--text-color);
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.3s ease;
    }

    .styled-contact-form input:focus,
    .styled-contact-form textarea:focus {
        border-color: var(--accent-red);
    }

    .contact-submit-btn {
        align-self: flex-start;
        padding: 0.8rem 2rem;
        background-color: var(--accent-red);
        color: #ffffff;
        border: none;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .contact-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    /* --- FULLSCREEN ZOOM OVERLAY LIGHTBOX --- */
    .overlay-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        overflow: hidden;
        cursor: pointer;
    }

    .overlay-backdrop.active {
        opacity: 1;
        visibility: visible;
    }

    .overlay-image-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: default;
        padding: 4rem 2rem;
    }

    /* Mobile: symmetrical padding so the picture sits exactly in the middle */
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
        .overlay-image-container {
            padding: 4.5rem 0.75rem;
        }
    }

    .overlay-image-container img {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
    flex: 0 1 auto;
    object-fit: contain;
    cursor: grab;
    transform-origin: center center;
    transition: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

    /* Same box as the menu point / event close point: top 0, 60px bar height, same right offset, same size */
    .overlay-close-btn {
        position: fixed;
        top: 0;
        right: var(--nav-dot-right);
        height: 60px;
        width: var(--nav-dot);
        z-index: 2006;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Larger tap area around the point without moving it */
    .overlay-close-btn::before {
        content: "";
        position: absolute;
        inset: 0 -15px;
    }

    .lightbox-info-group {
        position: fixed;
        bottom: 2.5rem;
        right: 2rem;
        display: flex;
        align-items: flex-end;
        gap: 1rem;
        z-index: 2005;
    }

    /* Chevrons on the left (up = previous, down = next picture). Corners, same size as the red dot,
       semi-transparent and BEHIND the picture (the picture container sits above them). */
    .overlay-nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
    }

    .overlay-nav.single {
        display: none;
    }

    .overlay-nav-btn {
        position: absolute;
        left: var(--nav-dot-right);
        width: var(--nav-dot);
        height: 32px;
        padding: 0;
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
    }

    #overlayPrevBtn { top: 0; height: 60px; } /* same row as the red dot */
    #overlayNextBtn { bottom: calc(2.5rem - 14px); }

    .overlay-nav-btn svg {
        width: 18px;
        height: 18px;
        overflow: visible;
        fill: none;
        stroke: var(--accent-red);
        stroke-width: 3;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
        opacity: 0.65;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
        .overlay-nav-btn:hover svg {
            opacity: 0.9;
            transform: scale(1.25);
        }
    }

    .overlay-nav-btn:focus,
    .overlay-nav-btn:focus-visible {
        outline: none;
    }

    .overlay-nav-btn:disabled {
        cursor: default;
        pointer-events: none;
    }

    .overlay-nav-btn:disabled svg {
        opacity: 0.12;
    }

    /* The container sits above the chevrons but lets clicks fall through to them;
       only the picture and the info box catch pointer events. */
    .overlay-image-container {
        z-index: 1;
        pointer-events: none;
    }

    .overlay-image-container img,
    .lightbox-info-group {
        pointer-events: auto;
    }

    /* Red dot + line fade out while zoomed in on touch devices (tap the picture to bring them back) */
    .overlay-close-btn,
    .lightbox-info-group {
        transition: opacity 0.25s ease;
    }

    .overlay-backdrop.ui-hidden .overlay-close-btn,
    .overlay-backdrop.ui-hidden .lightbox-info-group {
        opacity: 0;
        pointer-events: none;
    }

    .overlay-close-btn .red-dot-btn {
        width: var(--nav-dot);
        height: var(--nav-dot);
        background-color: var(--accent-red);
        border-radius: 50%;
        transition: transform 0.3s ease;
    }

    /* Growth on hover only for real mice: touch keeps :hover stuck */
    @media (hover: hover) and (pointer: fine) {
        .overlay-close-btn:hover .red-dot-btn {
            transform: scale(1.3);
        }
    }

    /* B-ROLL-SYMBOL: sitzt genau ueber der roten Linie, gleiche Breite */
    .broll-btn {
        position: fixed;
        right: 2.5rem;
        bottom: calc(2.5rem + 18px);
        width: 32px;
        height: 26px;
        padding: 0;
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        z-index: 2005;
        pointer-events: auto;
        color: var(--accent-red);
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.25s ease, transform 0.2s ease;
    }
    .broll-btn[hidden] { display: none; }
    .broll-btn::before { content: ""; position: absolute; inset: -8px -10px; } /* groessere Tippflaeche */
    .broll-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linejoin: miter;
        opacity: 0.8;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .broll-btn .broll-count {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
    }
    .broll-btn.active svg rect { fill: var(--accent-red); }
    @media (hover: hover) and (pointer: fine) {
        .broll-btn:hover svg { opacity: 1; transform: scale(1.15); }
    }
    .overlay-backdrop.ui-hidden .broll-btn { opacity: 0; pointer-events: none; }

    /* B-Roll-Symbol in der Timeline und auf der Kuenstler-Seite: wie in der Bildansicht, etwas blasser */
    .broll-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-left: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent-red);
        font: inherit;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        cursor: pointer;
        opacity: 0.55;
        position: relative;
        flex-shrink: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .broll-badge::before { content: ""; position: absolute; inset: -10px -8px; } /* groessere Tippflaeche */
    .broll-badge svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linejoin: miter;
    }
    @media (hover: hover) and (pointer: fine) {
        .broll-badge:hover { opacity: 1; transform: scale(1.12); }
    }
    /* Timeline: zwischen Titel und Kuenstler */
    .timeline-caption .broll-badge { align-self: center; margin-right: -0.5rem; }
    /* Kuenstler-Seite: unter dem Titel */
    .artist-tl-text .broll-badge { margin-left: 0; margin-top: 0.15rem; align-self: flex-start; }

    /* ===== B-ROLL-LISTE IN DER BILDANSICHT =====
       Symbol antippen: der Bildbereich wird schmaler, das Bild gleitet dadurch nach links;
       rechts gleitet die Liste herein und blendet von 0 auf volle Deckkraft auf (Eintraege nacheinander). */
    .overlay-image-container {
        width: 100%;
        margin-right: 0;
        flex-shrink: 0;
        transition: width 0.75s cubic-bezier(0.16, 1, 0.3, 1), margin-right 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay-backdrop.broll-open .overlay-image-container {
        width: 54%;
        margin-right: 46%; /* Bildbereich bleibt links, rechts ist Platz fuer die Liste */
    }

    .broll-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 46%;
        z-index: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: 4.5rem 5rem 7rem 1rem; /* rechts/unten Platz fuer Punkt, Symbol und rote Linie */
        display: flex;
        flex-direction: column;
        gap: 2.2rem;
        cursor: default;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(35%);
        transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, visibility 0.75s;
    }
    .broll-panel::-webkit-scrollbar { display: none; }

    .overlay-backdrop.broll-open .broll-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
    }

    /* jeder Eintrag gleitet mit und blendet einzeln auf */
    .broll-panel > * {
        opacity: 0;
        transform: translateX(60px);
        transition: opacity 0.6s ease, transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: calc(0.08s + var(--i, 0) * 0.07s);
    }
    .overlay-backdrop.broll-open .broll-panel > * {
        opacity: 1;
        transform: none;
    }

    /* Titel aus info.txt: groesser, nicht rot */
    .broll-title {
        color: #f0f0f0;
        font-size: clamp(1.3rem, 2.4vw, 2rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 1.15;
        text-transform: uppercase;
    }

    .broll-text {
        max-width: 46ch;
        color: #aaa;
        font-size: 0.85rem;
        line-height: 1.7;
        white-space: pre-line;
    }

    /* ungefaehr gleich gross, aber nicht ganz gleichfoermig: Breite wechselt leicht, alles linksbuendig */
    .broll-item {
        margin: 0;
        width: var(--w, 86%);
        align-self: flex-start;
        cursor: zoom-in;
    }
    .broll-item.wide { width: 100%; }

    .broll-item img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 70vh;
        object-fit: contain;
        object-position: left center;
        opacity: 0;
        transition: opacity 0.45s ease, outline-color 0.2s;
        outline: 1px solid transparent;
        outline-offset: 4px;
    }
    .broll-item img.is-loaded { opacity: 1; }
    .broll-item.current img { outline-color: rgba(255, 255, 255, 0.45); } /* gerade gross gezeigt */

    .broll-item figcaption {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 0.7rem;
        margin-top: 0.6rem;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        line-height: 1.5;
        color: #888;
        text-transform: lowercase;
    }
    .broll-item figcaption strong {
        color: #ddd;
        font-weight: 600;
        text-transform: uppercase;
    }

    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
        .overlay-backdrop.broll-open .overlay-image-container {
            width: 34%;
            margin-right: 66%;
            padding-left: 0.5rem;
            padding-right: 0.25rem;
        }
        .broll-panel {
            width: 66%;
            padding: 4.5rem 1rem 7rem 0.5rem;
            gap: 1.6rem;
        }
        .broll-item,
        .broll-item.wide { width: calc(var(--w, 86%) + 8%); max-width: 100%; }
        .broll-item.wide { width: 100%; }
    }

    /* LIGHTBOX RED LINE & EXPANDABLE DRAWER WRAPPER */
    .lightbox-info-group {
        position: fixed;
        bottom: 2.5rem;
        right: 2.5rem;
        display: flex;
        align-items: flex-end;
        gap: 1rem;
        z-index: 2005;
    }

    .lightbox-red-line-trigger {
        position: relative;
        width: 32px;
        height: 4px;
        background-color: var(--accent-red);
        cursor: pointer;
        transition: width 0.3s ease, transform 0.2s ease;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        flex-shrink: 0;
    }

    /* Fixed-size hit area around the line (independent of the text length). It also bridges the gap
       to the info box so the box stays open while the pointer moves over to it. */
    .lightbox-red-line-trigger::before {
        content: "";
        position: absolute;
        top: -14px;
        bottom: -14px;
        left: -16px;
        right: -8px;
    }

    .lightbox-info-group:hover .lightbox-red-line-trigger {
        width: 44px;
        transform: scaleY(1.2);
    }

        padding: 0;
    }

    @media (hover: hover) and (pointer: fine) {
        .menu-artists:hover .artist-submenu {
            opacity: 1;
            visibility: visible;
        }
        .banner-menu-popup .menu-artists:hover .artist-submenu {
            transform: translateY(0);
        }
        .flyout-menu .menu-artists:hover .artist-submenu {
            transform: translateX(0);
        }
    }

    .menu-artists.open .artist-submenu {
        opacity: 1;
        visibility: visible;
    }

    .banner-menu-popup .menu-artists.open .artist-submenu { transform: translateY(0); }
    .flyout-menu .menu-artists.open .artist-submenu { transform: translateX(0); }

    /* aktiver Filter = rot */
    .banner-menu-popup .artist-submenu a.active {
        color: var(--accent-red);
    }
    .flyout-menu .artist-submenu a.active {
        background-position: 100% 0 !important;
    }

    /* Verzoegerung fuer die gescrollten Eintraege: Artists ist jetzt Nr. 3, Info Nr. 4 */
    body.is-scrolled .nav-wrapper:hover .flyout-menu > .menu-artists > a.artists-trigger { transition-delay: 0.15s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu > a:nth-child(4) { transition-delay: 0.20s; }

    /* ===== "SORT BY" IM MENUE (nicht klickbar) + UNTERMENUE, "By Artist" mit weiterem Flyout ===== */
    .menu-sort {
        position: relative;
    }

    .sort-artist-trigger {
        cursor: default;
    }

    /* Pfeil statt "Sort by": gleiche Form wie die Pfeile in der Bildansicht. Klick oeffnet/schliesst. */
    .sort-trigger {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
    }

    .sort-trigger svg {
        width: 20px;
        height: 20px;
        overflow: visible;
        fill: none;
        stroke: var(--accent-red);
        stroke-width: 2.6;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
        transition: transform 0.2s ease;
    }

    /* Der Pfeil bewegt sich nie, auch nicht beim Darueberfahren */
    .banner-menu-popup a.sort-trigger:hover {
        transform: none;
    }
    .flyout-menu a.sort-trigger:hover {
        transform: translateX(0) !important;
    }

    /* im gescrollten Menue etwas groesser, passend zur Schrift */
    .flyout-menu .sort-trigger svg {
        width: 0.8em;
        height: 0.8em;
    }

    .sort-submenu {
        position: absolute;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
        z-index: 1004;
    }

    .banner-menu-popup .sort-submenu {
        top: 100%;
        right: 0;
        transform: translateY(-6px);
        /* Abstand Menuezeile -> erste Option = Abstand Seitenrand oben -> Menuezeile
           (gemessen: beide genau 20.9px) */
        padding-top: var(--submenu-first-gap);
        gap: 0.7rem;
        align-items: flex-end;
        text-align: right;
    }

    .flyout-menu .sort-submenu {
        top: 0;
        right: 100%;
        transform: translateX(10px);
        padding-right: 0.7rem;     /* direkt neben dem Pfeil */
        gap: 0.7rem;               /* wie zwischen den Menue-Eintraegen */
        align-items: flex-end;
        font-size: 1em;            /* gleiche Groesse wie die Menue-Eintraege */
        line-height: 1.2;
    }


    /* Alle Optionen gleich (Sortieren und Kuenstler): Blockzeile mit fester Zeilenhoehe -> gleichmaessige Abstaende */
    .sort-submenu > a,
    .sort-submenu > .menu-artists > a,
    .artist-submenu > a {
        display: block;
        line-height: 1.2;
        padding: 0;
    }

    /* ===== WISCH-EFFEKT FUER SORTIER- UND KUENSTLER-OPTIONEN =====
       Umgekehrt zum gescrollten Menue: erst Menuefarbe, beim Oeffnen wischt Rot von links nach rechts darueber.
       Die aktive Option umgekehrt: rot -> Menuefarbe (dunkel: weiss, hell: schwarz).
       Zwei Kopien des Textes (::before = Startfarbe, ::after = Zielfarbe) mit sich ergaenzenden Ausschnitten:
       an jeder Stelle ist genau eine Farbe sichtbar (kein weisser Rand hinter roten Buchstaben),
       und die Schrift bleibt so scharf und gross wie die anderen Menuepunkte. */
    .nav-wrapper .sort-submenu > a.sort-option,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger,
    .nav-wrapper .artist-submenu > a {
        position: relative;
        color: transparent !important;
        background: none !important;
        -webkit-background-clip: border-box;
        background-clip: border-box;
    }

    .nav-wrapper .sort-submenu > a.sort-option::before,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::before,
    .nav-wrapper .artist-submenu > a::before,
    .nav-wrapper .sort-submenu > a.sort-option::after,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::after,
    .nav-wrapper .artist-submenu > a::after {
        content: attr(data-label);
        position: absolute;
        inset: 0;
        text-align: inherit;
        white-space: nowrap;
        pointer-events: none;
        transition: clip-path 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Startfarbe: ganz sichtbar; Zielfarbe: noch ganz versteckt */
    .nav-wrapper .sort-submenu > a.sort-option::before,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::before,
    .nav-wrapper .artist-submenu > a::before {
        color: var(--banner-text);
        clip-path: inset(0 0 0 0);
    }
    .nav-wrapper .sort-submenu > a.sort-option::after,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::after,
    .nav-wrapper .artist-submenu > a::after {
        color: var(--accent-red);
        clip-path: inset(0 100% 0 0);
    }

    /* aktive Option: Farben getauscht */
    .nav-wrapper .sort-submenu > a.sort-option.active::before,
    .nav-wrapper .artist-submenu > a.active::before {
        color: var(--accent-red);
    }
    .nav-wrapper .sort-submenu > a.sort-option.active::after,
    .nav-wrapper .artist-submenu > a.active::after {
        color: var(--banner-text);
    }

    /* Geoeffnet: Zielfarbe wischt von links herein, Startfarbe wird im selben Mass von links weggeschnitten */
    .nav-wrapper .menu-sort.open .sort-submenu > a.sort-option::before,
    .nav-wrapper .menu-sort.open .sort-submenu > .menu-artists > a.sort-artist-trigger::before,
    .nav-wrapper .menu-artists.open > .artist-submenu > a::before {
        clip-path: inset(0 0 0 100%);
    }
    .nav-wrapper .menu-sort.open .sort-submenu > a.sort-option::after,
    .nav-wrapper .menu-sort.open .sort-submenu > .menu-artists > a.sort-artist-trigger::after,
    .nav-wrapper .menu-artists.open > .artist-submenu > a::after {
        clip-path: inset(0 0 0 0);
    }
    @media (hover: hover) and (pointer: fine) {
        .nav-wrapper .menu-artists:hover > .artist-submenu > a::before { clip-path: inset(0 0 0 100%); }
        .nav-wrapper .menu-artists:hover > .artist-submenu > a::after { clip-path: inset(0 0 0 0); }
    }

    /* nacheinander, von oben nach unten */
    .nav-wrapper .sort-submenu > a.sort-option:nth-child(1)::before,
    .nav-wrapper .sort-submenu > a.sort-option:nth-child(1)::after,
    .nav-wrapper .artist-submenu > a:nth-child(1)::before,
    .nav-wrapper .artist-submenu > a:nth-child(1)::after { transition-delay: 0.05s; }
    .nav-wrapper .sort-submenu > a.sort-option:nth-child(2)::before,
    .nav-wrapper .sort-submenu > a.sort-option:nth-child(2)::after,
    .nav-wrapper .artist-submenu > a:nth-child(2)::before,
    .nav-wrapper .artist-submenu > a:nth-child(2)::after { transition-delay: 0.10s; }
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::before,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger::after,
    .nav-wrapper .artist-submenu > a:nth-child(3)::before,
    .nav-wrapper .artist-submenu > a:nth-child(3)::after { transition-delay: 0.15s; }
    .nav-wrapper .artist-submenu > a:nth-child(n+4)::before,
    .nav-wrapper .artist-submenu > a:nth-child(n+4)::after { transition-delay: 0.20s; }

    /* Gescrolltes Menue: Pfeil und "Kuenstler" nur so breit wie ihr Inhalt,
       damit die Untermenues direkt daneben aufgehen (nicht links von der ganzen Spalte) */
    .flyout-menu > .menu-sort,
    .flyout-menu > .menu-artists {
        align-self: flex-end;
    }

    /* "Kuenstler" im Hauptmenue klappt nichts mehr aus, sondern fuehrt zur Kuenstler-Seite.
       (Die Namen gibt es weiterhin unter Sortieren -> Nach Kuenstler.) */
    .banner-menu-popup > .menu-artists > .artist-submenu,
    .flyout-menu > .menu-artists > .artist-submenu {
        display: none !important;
    }

    /* Waehrend "Sortieren" offen ist, klappt das Kuenstler-Menue nicht auf */
    .nav-wrapper .banner-menu-popup:has(.menu-sort.open) > .menu-artists > .artist-submenu,
    .nav-wrapper .flyout-menu:has(.menu-sort.open) > .menu-artists > .artist-submenu {
        display: none !important;
    }

    /* Gescrollt + Sortieren offen: Menuepunkte werden auf 45 % gedimmt, als Wisch vom letzten Buchstaben
       des letzten Eintrags (Info) bis zum ersten Buchstaben des ersten Eintrags (Galerie) */
    /* Maske mit drei Stufen: voll -> 45 % -> 20 % (Position 0 / 50 % / 100 %) */
    .flyout-menu > a,
    .flyout-menu > .menu-artists > a.artists-trigger {
        -webkit-mask-image: linear-gradient(90deg, #000 0 33.34%, rgba(0, 0, 0, 0.45) 33.34% 66.67%, rgba(0, 0, 0, 0.2) 66.67% 100%);
        mask-image: linear-gradient(90deg, #000 0 33.34%, rgba(0, 0, 0, 0.45) 33.34% 66.67%, rgba(0, 0, 0, 0.2) 66.67% 100%);
        -webkit-mask-size: 300% 100%;
        mask-size: 300% 100%;
        -webkit-mask-position: 0 0;
        mask-position: 0 0;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
    }

    .flyout-menu:has(.menu-sort.open) > a,
    .flyout-menu:has(.menu-sort.open) > .menu-artists > a.artists-trigger,
    .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > a,
    .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > .menu-artists > a.artists-trigger {
        -webkit-mask-position: 50% 0;
        mask-position: 50% 0;
    }

    /* Maus auf den Namen unter "Nach Kuenstler": Hauptmenue noch dunkler (20 %) */
    .flyout-menu:has(.menu-artists.nested > .artist-submenu:hover) > a,
    .flyout-menu:has(.menu-artists.nested > .artist-submenu:hover) > .menu-artists > a.artists-trigger {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
    }

    .flyout-menu > a,
    .flyout-menu > .menu-artists > a.artists-trigger {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease,
                    background-position 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                    -webkit-mask-position 0.15s linear, mask-position 0.15s linear;
    }

    /* Gedimmt: kein Rot und keine Bewegung beim Darueberfahren */
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > a:hover,
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > .menu-artists > a.artists-trigger:hover {
        background-position: 0 0 !important;
        transform: translateX(0) !important;
    }

    /* Reihenfolge des Dimmens: Info, Kuenstler, Zeitstrahl, Galerie (je 0.15 s, direkt hintereinander).
       Nur waehrend Sortieren offen ist; sonst gelten die normalen Einblend-Verzoegerungen des Menues. */
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > a:nth-child(4),
    body.is-scrolled .nav-wrapper .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > a:nth-child(4) { transition-delay: 0s, 0s, 0s, 0s, 0s; }
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > .menu-artists > a.artists-trigger,
    body.is-scrolled .nav-wrapper .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > .menu-artists > a.artists-trigger { transition-delay: 0s, 0s, 0s, 0.15s, 0.15s; }
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > a:nth-child(2),
    body.is-scrolled .nav-wrapper .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > a:nth-child(2) { transition-delay: 0s, 0s, 0s, 0.30s, 0.30s; }
    body.is-scrolled .nav-wrapper .flyout-menu:has(.menu-sort.open) > a:nth-child(1),
    body.is-scrolled .nav-wrapper .flyout-menu:has(> .menu-artists > .artist-submenu:hover) > a:nth-child(1) { transition-delay: 0s, 0s, 0s, 0.45s, 0.45s; }

    /* ===== GESCROLLT: "NACH KUENSTLER" IM SORTIER-MENUE, GLEICHES PRINZIP =====
       1. "Nach Kuenstler" anfahren: Namen fliegen raus, schlicht weiss in 45 %.
       2. Maus auf die Namen: Sortier-Optionen dimmen auf 45 % (Wisch vom letzten zum ersten Buchstaben),
          das Hauptmenue noch weiter auf 20 %, die Namen bekommen Buchstabe fuer Buchstabe ihre Farbe. */
    .flyout-menu .sort-submenu > a.sort-option,
    .flyout-menu .sort-submenu > .menu-artists > a.sort-artist-trigger {
        -webkit-mask-image: linear-gradient(90deg, #000 0 50%, rgba(0, 0, 0, 0.45) 50% 100%);
        mask-image: linear-gradient(90deg, #000 0 50%, rgba(0, 0, 0, 0.45) 50% 100%);
        -webkit-mask-size: 200% 100%;
        mask-size: 200% 100%;
        -webkit-mask-position: 0 0;
        mask-position: 0 0;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease,
                    background-position 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                    -webkit-mask-position 0.15s linear, mask-position 0.15s linear;
    }

    .flyout-menu .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option,
    .flyout-menu .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > .menu-artists > a.sort-artist-trigger {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
    }

    /* Reihenfolge: Nach Kuenstler, Nach Datum, Empfohlen */
    body.is-scrolled .nav-wrapper .flyout-menu .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > .menu-artists > a.sort-artist-trigger { transition-delay: 0s, 0s, 0s, 0s, 0s; }
    body.is-scrolled .nav-wrapper .flyout-menu .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option:nth-child(2) { transition-delay: 0s, 0s, 0s, 0.15s, 0.15s; }
    body.is-scrolled .nav-wrapper .flyout-menu .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option:nth-child(1) { transition-delay: 0s, 0s, 0s, 0.30s, 0.30s; }

    /* Unsichtbare Bruecke rechts neben den Namen (unter "Nach Kuenstler"), damit die Maus schraeg
       hinueberfahren kann, ohne dass das Menue zuklappt */
    .flyout-menu .sort-submenu .menu-artists.nested > .artist-submenu::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 100%;
        width: 20rem;
    }

    /* Namen: erst weiss 45 %, Farbe erst wenn die Maus auf den Namen ist */
    .nav-wrapper .flyout-menu .sort-submenu .menu-artists.nested > .artist-submenu > a::before {
        color: var(--banner-text) !important;
        opacity: 0.45;
    }
    .nav-wrapper .flyout-menu .sort-submenu .menu-artists.nested:hover > .artist-submenu > a::before {
        clip-path: inset(0 0 0 0);
    }
    .nav-wrapper .flyout-menu .sort-submenu .menu-artists.nested:hover > .artist-submenu > a::after {
        clip-path: inset(0 100% 0 0);
    }
    .nav-wrapper .flyout-menu .sort-submenu .menu-artists.nested > .artist-submenu:hover > a::before {
        clip-path: inset(0 0 0 100%);
    }
    .nav-wrapper .flyout-menu .sort-submenu .menu-artists.nested > .artist-submenu:hover > a::after {
        clip-path: inset(0 0 0 0);
    }

    /* ===== "NACH KUENSTLER" IM SORTIER-MENUE (oben und gescrollt), GLEICHES PRINZIP EINE EBENE TIEFER =====
       1. "Nach Kuenstler" anfahren: Namen fliegen raus, schlicht weiss in 45 %.
       2. Maus auf die Namen: Namen bekommen Buchstabe fuer Buchstabe ihre Farbe, die Sortier-Optionen
          dimmen auf 45 % (Wisch von "Nach Kuenstler" hoch bis "Empfohlen"); gescrollt geht das Hauptmenue auf 20 %.
       3. Zurueck: alles umgekehrt. */
    .nav-wrapper .sort-submenu .menu-artists.nested > .artist-submenu > a::before {
        color: var(--banner-text) !important;
        opacity: 0.45;
    }
    .nav-wrapper .sort-submenu .menu-artists.nested:hover > .artist-submenu > a::before {
        clip-path: inset(0 0 0 0);
    }
    .nav-wrapper .sort-submenu .menu-artists.nested:hover > .artist-submenu > a::after {
        clip-path: inset(0 100% 0 0);
    }
    .nav-wrapper .sort-submenu .menu-artists.nested > .artist-submenu:hover > a::before {
        clip-path: inset(0 0 0 100%);
    }
    .nav-wrapper .sort-submenu .menu-artists.nested > .artist-submenu:hover > a::after {
        clip-path: inset(0 0 0 0);
    }

    /* Sortier-Optionen dimmen per Wisch auf 45 % (gescrollt dimmt zusaetzlich das Hauptmenue auf 20 %, siehe oben) */
    .nav-wrapper .sort-submenu > a.sort-option,
    .nav-wrapper .sort-submenu > .menu-artists > a.sort-artist-trigger {
        -webkit-mask-image: linear-gradient(90deg, #000 0 50%, rgba(0, 0, 0, 0.45) 50% 100%);
        mask-image: linear-gradient(90deg, #000 0 50%, rgba(0, 0, 0, 0.45) 50% 100%);
        -webkit-mask-size: 200% 100%;
        mask-size: 200% 100%;
        -webkit-mask-position: 0 0;
        mask-position: 0 0;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        transition: transform 0.2s ease, -webkit-mask-position 0.15s linear, mask-position 0.15s linear;
    }
    .nav-wrapper .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option,
    .nav-wrapper .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > .menu-artists > a.sort-artist-trigger {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
    }
    /* Reihenfolge: Nach Kuenstler, Nach Datum, Empfohlen */
    .nav-wrapper .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > .menu-artists > a.sort-artist-trigger { transition-delay: 0s, 0s, 0s; }
    .nav-wrapper .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option:nth-child(2) { transition-delay: 0s, 0.15s, 0.15s; }
    .nav-wrapper .sort-submenu:has(.menu-artists.nested > .artist-submenu:hover) > a.sort-option:nth-child(1) { transition-delay: 0s, 0.30s, 0.30s; }

    /* ===== GESCROLLT: KUENSTLER-FLYOUT IN ZWEI STUFEN =====
       1. "Kuenstler" anfahren: Namen fliegen raus, alle schlicht weiss in 45 % (wie das gedimmte Menue).
       2. Maus auf die Namen: Menue dimmt, die Namen bekommen Buchstabe fuer Buchstabe ihre Farbe
          (rot; der aktive Eintrag hell weiss bzw. schwarz). Zurueck aufs Menue: alles umgekehrt. */
    .nav-wrapper .flyout-menu > .menu-artists:not(.nested) > .artist-submenu > a::before {
        color: var(--banner-text) !important;
        opacity: 0.45;
    }
    .nav-wrapper .flyout-menu > .menu-artists:not(.nested):hover > .artist-submenu > a::before {
        clip-path: inset(0 0 0 0);
    }
    .nav-wrapper .flyout-menu > .menu-artists:not(.nested):hover > .artist-submenu > a::after {
        clip-path: inset(0 100% 0 0);
    }
    .nav-wrapper .flyout-menu > .menu-artists:not(.nested) > .artist-submenu:hover > a::before {
        clip-path: inset(0 0 0 100%);
    }
    .nav-wrapper .flyout-menu > .menu-artists:not(.nested) > .artist-submenu:hover > a::after {
        clip-path: inset(0 0 0 0);
    }

    /* "By Artist": Kuenstler fahren links daneben raus */
    .sort-submenu .menu-artists.nested .artist-submenu {
        top: 0;
        right: 100%;
        left: auto;
        padding-top: 0;
        padding-right: 1.2rem;
        transform: translateX(8px);
        align-items: flex-end;
    }

    .flyout-menu .sort-submenu .menu-artists.nested .artist-submenu {
        font-size: 1em;
    }

    @media (hover: hover) and (pointer: fine) {
        .sort-submenu .menu-artists.nested:hover .artist-submenu { transform: translateX(0); }
    }

    .menu-sort.open .sort-submenu {
        opacity: 1;
        visibility: visible;
    }
    .banner-menu-popup .menu-sort.open .sort-submenu { transform: translateY(0); }
    .flyout-menu .menu-sort.open .sort-submenu { transform: translateX(0); }
    .sort-submenu .menu-artists.nested.open .artist-submenu { transform: translateX(0); }


    /* Reihenfolge im gescrollten Menue: Galerie, Timeline, Artists, Info, Pfeil */
    body.is-scrolled .nav-wrapper:hover .flyout-menu > a:nth-child(4) { transition-delay: 0.20s; }
    body.is-scrolled .nav-wrapper:hover .flyout-menu > .menu-sort > a.sort-trigger { transition-delay: 0.25s; }

    /* ===== ARTISTS-SEITE (/artists) ===== */
    .artists-list {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
    }

    .artists-list a {
        color: var(--text-color);
        font-size: clamp(2.2rem, 6vw, 4.5rem);
        font-weight: 900;
        letter-spacing: 0.04em;
        line-height: 1.15;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s;
    }

    .artists-list a:hover {
        color: var(--accent-red);
    }

    /* kleiner Hinweis neben dem Logo, solange ein Kuenstler-Filter aktiv ist (Klick = Filter aus) */
    .artist-filter-indicator {
        display: none;
        margin-left: 1rem;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--subtext-color);
        cursor: pointer;
    }

    .artist-filter-indicator.visible {
        display: inline;
    }

    .artist-filter-indicator::after {
        content: " \00d7";
        color: var(--accent-red);
    }

    /* ===== EINZELNE KUENSTLER-SEITE ===== */
    .artist-view {
        min-height: 100vh;
        padding: 90px 2rem 3rem;
        background-color: var(--bg-color);
    }

    /* Collection | feine rote Linie | Zeitstrahl */
    .artist-layout {
        --artist-top: 90px; /* = padding-top der Seite */
        display: grid;
        grid-template-columns: minmax(0, 1fr) 1px minmax(220px, 280px);
        column-gap: 2.5rem;
        align-items: start;
    }

    /* keine Timeline-Eintraege: nur die Collection, ohne Linie */
    .artist-layout.no-timeline {
        grid-template-columns: minmax(0, 1fr);
    }
    .artist-layout.no-timeline .artist-divider,
    .artist-layout.no-timeline .artist-timeline {
        display: none;
    }

    .artist-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    /* Hauptbild links, die zwei Spalten rechts daneben (wie in der Galerie) */
    .artist-collection + .artist-collection {
        margin-top: 4rem; /* Abstand zwischen den Collections */
    }

    .artist-collection {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 2rem;
        align-items: start;
    }

    .artist-hero-col {
        position: sticky;
        top: var(--artist-top);
        min-width: 0;
    }

    .artist-back,
    .artist-gallery-link {
        color: var(--subtext-color);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s;
    }
    .artist-back:hover,
    .artist-gallery-link:hover { color: var(--accent-red); }
    .artist-back { margin-bottom: 1.5rem; align-self: flex-start; }
    .artist-gallery-link { margin-top: 1.4rem; align-self: flex-start; }

    .artist-hero-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 100%;
    }

    /* Rahmen genau so gross wie das Bild; der Name steht darueber (kein Abschneiden) */
    .artist-hero-frame {
        position: relative;
        display: inline-block;
        max-width: 100%;
        line-height: 0;
    }

    .artist-hero-frame img {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 320px);
        min-height: 200px;
        width: auto;
        height: auto;
        cursor: zoom-in;
    }

    /* Grosser Name ueber dem Bild: bleibt stehen (keine Ausblend-Animation), genau so breit wie das Bild */
    .artist-hero-frame .artist-big {
        --name-overflow-x: 0;
        --name-sink: 0.004;
        line-height: 1;
    }
    .artist-hero-frame .artist-big span {
        opacity: 1;
        animation: none;
    }

    .artist-name-plain {
        font-family: "Anton", Impact, "Arial Narrow", sans-serif;
        font-weight: 400;
        font-size: clamp(3rem, 10vw, 8rem);
        line-height: 1;
        text-transform: uppercase;
        color: var(--accent-red);
    }

    /* feine, kurze Linie zwischen Collection und Zeitstrahl, rot */
    .artist-divider {
        width: 1px;
        height: 55vh;
        background-color: var(--accent-red);
        position: sticky;
        top: 22.5vh;
        /* startet tiefer (auf Hoehe des Zeitstrahl-Titels); beim Scrollen der Zeitstrahl-Liste
           gleitet sie mit nach oben bis hierher und beim Zurueckscrollen wieder hinunter (Script) */
        transform: translateY(var(--divider-drop, 0px));
        will-change: transform;
        align-self: start;
        margin-top: calc(22.5vh - var(--artist-top));
    }

    /* Zeitstrahl: der erste Eintrag beginnt in der Bildschirmmitte, dann scrollt die Liste in sich */
    .artist-timeline {
        --tl-thumb-h: 80px;
        position: sticky;
        top: 0;
        height: 100vh;
        margin-top: calc(var(--artist-top) * -1);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: calc(50vh - 2.3rem - var(--tl-thumb-h) / 2) 4px 50vh 0;
    }
    .artist-timeline::-webkit-scrollbar { display: none; }

    .artist-timeline-title {
        margin-bottom: 1.4rem;
        color: var(--accent-red);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        line-height: 0.9rem;
        text-transform: uppercase;
    }

    .artist-timeline-list {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
    }

    .artist-tl-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        text-decoration: none;
        color: var(--text-color);
        cursor: pointer;
    }

    .artist-tl-item img {
        width: 64px;
        height: var(--tl-thumb-h);
        object-fit: cover;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.45s ease;
    }
    .artist-tl-item img.is-loaded { opacity: 0.85; }
    .artist-tl-item:hover img.is-loaded { opacity: 1; }

    .artist-tl-text {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
    }

    .artist-tl-date {
        color: var(--subtext-color);
        font-size: 0.6rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .artist-tl-title {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1.35;
        text-transform: uppercase;
        overflow-wrap: anywhere;
        transition: color 0.2s;
    }
    .artist-tl-item:hover .artist-tl-title { color: var(--accent-red); }

    @media (max-width: 1200px) {
        .artist-layout { grid-template-columns: minmax(0, 1fr) 1px minmax(190px, 230px); column-gap: 2rem; }
    }

    @media (max-width: 900px) {
        .artist-view { padding: 80px 2rem 3rem; }
        .artist-layout,
        .artist-layout.no-timeline {
            grid-template-columns: 1fr;
            row-gap: 2.5rem;
        }
        .artist-collection { grid-template-columns: 1fr; }
        .artist-hero-col { position: static; }
        .artist-hero-frame img { max-height: 65vh; min-height: 0; }
        /* mobil: die feine Linie liegt waagrecht zwischen Collection und Zeitstrahl */
        .artist-divider {
            position: static;
            width: 55%;
            height: 1px;
            margin: 0;
            justify-self: center;
        }
        .artist-timeline {
            position: static;
            height: auto;
            margin-top: 0;
            padding: 0;
            overflow: visible;
        }
    }

    /* ===== TIMELINE-EVENTS AUS ORDNERN (mehrere Bilder pro Event) ===== */

    /* kleiner Hinweis "+N" neben dem Datum, wenn ein Event weitere Bilder hat */
    .timeline-multi-tag {
        display: inline-block;
        margin-left: 0.6em;
        padding: 1px 7px;
        font-size: 0.7em;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fff;
        background: var(--accent-red);
        border-radius: 10px;
        vertical-align: middle;
    }

    .event-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1500;
        background-color: var(--bg-color);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .event-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .event-scroll {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }

    .event-scroll .collection-wrapper {
        width: 100%;
        min-height: 100%;
    }

    /* Schliessen-Punkt: exakt dieselbe Box wie der Menue-Punkt (gleiche Position/Groesse) */
    .event-close-btn {
        position: fixed;
        top: 0;
        right: var(--nav-dot-right);
        height: 60px;
        width: var(--nav-dot);
        z-index: 1510;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .event-close-btn::before {
        content: "";
        position: absolute;
        inset: 0 -15px;
    }

    .event-close-btn .red-dot-btn {
        width: var(--nav-dot);
        height: var(--nav-dot);
        background-color: var(--accent-red);
        border-radius: 50%;
    }

    /* Rechte Spalte: 2-spaltiges Raster. Der Beschreibungs-Block belegt ZWEI Zeilen. */
    .event-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        align-content: start;
    }

    .event-grid .gallery-item {
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .event-grid .image-wrapper {
        aspect-ratio: 4 / 5;
    }

    .event-grid .image-wrapper img {
        height: 100%;
        object-fit: cover;
    }

    .event-desc-block {
        grid-column: 1;
        grid-row: span 2; /* doppelte Zeile */
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1.5rem 1.5rem 1.7rem;
        border: 1px solid var(--divider-color);
        border-left: 3px solid var(--accent-red);
        color: var(--text-color);
        overflow-wrap: anywhere;
    }

    .event-desc-date {
        color: var(--accent-red);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
    }

    .event-desc-title {
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 1.15;
        text-transform: uppercase;
    }

    .event-desc-text {
        font-size: 0.95rem;
        line-height: 1.65;
        opacity: 0.85;
        white-space: pre-line;
    }

    @media (max-width: 900px) {
        /* Mobil gibt es kein "rechts": der Block steht ueber die volle Breite unter dem Hauptbild */
        .event-desc-block {
            grid-column: 1 / -1;
            grid-row: auto;
        }
        .event-grid {
            gap: 12px;
        }
    }

</style>

    const path = (pathname || "/").replace(/\/+$/, "");
    const m = path.match(/^\/(?:kuenstler|künstler|artists)\/([^\/]+)$/i);
    return m ? decodeURIComponent(m[1]) : null;
}
function artistPagePath(slug) {
    return VIEW_PATHS.artists + '/' + encodeURIComponent(slug);
}

function viewFromPath(pathname) {
    if (artistSlugFromPath(pathname)) return "artist";
    const path = (pathname || "/").replace(/\/+$/, "") || "/";
    for (const [view, p] of Object.entries(VIEW_PATHS)) {
        if (p === path) return view;
    }
    return OLD_PATHS[path] || "gallery";

        currentArtistSlug = artistSlug || artistSlugFromPath(window.location.pathname);
        if (!currentArtistSlug) viewName = 'artists';

    document.getElementById(viewName + "View").classList.add("active-view");
    document.body.dataset.view = viewName; // fuer ansichtsabhaengige Styles (z.B. Menue-Hintergrund)

    const targetPath = viewName === 'artist' ? artistPagePath(currentArtistSlug) : views[viewName];
    if (updateUrl && window.location.pathname !== targetPath) {
        history.pushState({ view: viewName }, "", targetPath);
    }

    if (viewName !== 'artist') document.title = t('pageTitle');
    if (viewName === 'artist' && typeof renderArtistPage === 'function') renderArtistPage();
