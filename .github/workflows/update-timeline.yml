name: Update Timeline List Automatically

on:
  push:
    paths:
      - 'timeline/**'
      - '!timeline/timeline.json'
      - '!timeline/broll.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate timeline.json and broll.json
        run: |
          cd timeline
          python3 - <<'PY'
          import os, json, re

          IMG = ('.jpg', '.jpeg', '.png', '.webp')
          # Ein Event-Ordner hat ein Bild namens main.jpg oder 1.jpg, 2.jpg, ...
          EVENT_IMG = re.compile(r'^(main|\d+)\.(jpg|jpeg|png|webp)$', re.I)
          # B-Roll-Bild: b1_28102026_skizze.jpg, b2_..., ...
          BROLL_IMG = re.compile(r'^b\d+[_-]', re.I)

          def is_image(name):
              return name.lower().endswith(IMG) and not name.startswith('.')

          def stem(name):
              return os.path.splitext(name)[0]

          def broll_in(path, rel):
              """B-Roll-Bilder in einem Ordner, sortiert nach der Nummer hinter 'b'."""
              files = [f for f in os.listdir(path) if is_image(f) and BROLL_IMG.match(f)]
              files.sort(key=lambda f: int(re.match(r'^b(\d+)', f, re.I).group(1)))
              return [f'{rel}/{f}' for f in files]

          def is_event_folder(path):
              return any(EVENT_IMG.match(f) for f in os.listdir(path))

          entries = []
          broll = {}

          def scan(folder, prefix):
              """Liest einen Ordner (timeline/ oder timeline/<kuenstler>/)."""
              names = sorted(n for n in os.listdir(folder) if not n.startswith('.'))
              image_stems = {stem(n): n for n in names
                             if os.path.isfile(os.path.join(folder, n)) and is_image(n) and not BROLL_IMG.match(n)}
              for name in names:
                  path = os.path.join(folder, name)
                  rel = f'{prefix}{name}'
                  if os.path.isfile(path):
                      if is_image(name) and not BROLL_IMG.match(name):
                          entries.append(rel)
                  elif os.path.isdir(path):
                      if name in image_stems:
                          # gleichnamiger Ordner zu einem Bild = B-Roll dieses Bildes
                          files = broll_in(path, rel)
                          if files:
                              broll[f'{prefix}{image_stems[name]}'] = files
                      elif is_event_folder(path):
                          entries.append(rel)
                          files = broll_in(path, rel)
                          if files:
                              broll[rel] = files
                      elif prefix == '':
                          # Kuenstler-Ordner, z.B. timeline/1/
                          scan(path, f'{name}/')

          scan('.', '')

          with open('timeline.json', 'w', encoding='utf-8') as f:
              json.dump(entries, f, indent=2, ensure_ascii=False)
              f.write('\n')
          with open('broll.json', 'w', encoding='utf-8') as f:
              json.dump(broll, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(f'{len(entries)} Eintraege, B-Roll fuer {len(broll)} Bilder')
          PY

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add timeline/timeline.json timeline/broll.json
          git diff-index --quiet HEAD || git commit -m "Auto-update timeline.json and broll.json"
          git push